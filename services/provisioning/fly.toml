# Fly.io config — weuseai-provisioning
#
# Sized to spec (2026-05-02 founder review):
#   - Region sin (Singapore) — closest Fly POP to IDCloudHost jkt01
#   - shared-cpu-1x / 256MB → ~$1.94/mo if always-on
#   - auto_stop_machines + min=0/max=1 → effectively $0/mo at MVP traffic
#     and hard-capped at one machine if traffic spikes
#
# Secrets set separately via `fly secrets set` (NOT in this file):
#   Provider routing (Vultr-migration cascade 2026-05-11, PR #75 cutover):
#     VPS_PROVIDER                    # 'vultr' (post-cutover default) | 'idcloudhost' (rollback)
#     VULTR_API_KEY                   # generated at my.vultr.com/settings/#settingsapi
#     VULTR_REGION                    # 'sgp' (Singapore — capacity-stable since 2014)
#     VULTR_FLEET_SSH_KEY_ID          # uuid from POST /v2/ssh-keys (FLEET_SSH_PUBKEY upload)
#     DIGITALOCEAN_API_KEY            # for failover when Vultr capacity exhausted
#     DIGITALOCEAN_REGION             # 'sgp1' (DO Singapore — NOTE: NOT same code as Vultr's 'sgp')
#     DIGITALOCEAN_FLEET_SSH_KEY_ID   # id from POST /v2/account/keys
#   Grandfathered (read-only — kept so existing Renita + e282ce25 VPSes work):
#     IDCLOUDHOST_API_KEY, IDCLOUDHOST_BILLING_ACCOUNT_ID, IDCLOUDHOST_REGION
#   Service auth + Telegram + Supabase (unchanged):
#     TELEGRAM_BOT_TOKEN, DEFAULT_TELEGRAM_CHAT_ID, PROVISIONING_AUTH_TOKEN,
#     SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RICHIE_CHAT_ID,
#     FLEET_SSH_PRIVATE_KEY, FLEET_SSH_PUBKEY

app = "weuseai-provisioning"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8081"
  NODE_ENV = "production"
  # Real provisioning ON in production. Set to "false" for staging dry-runs.
  ENABLE_REAL_PROVISIONING = "true"

[http_service]
  internal_port = 8081
  force_https = true
  # Keep 1 machine always running. Cold-start delays cause Edge Function
  # fetch timeouts to spinUp (verified 2026-05-03 — webhook returned in 4s
  # with provision_deferred while machines were stopped). At ~$2/mo this
  # is a worthwhile fix for Phase 1.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  # Long timeout: cloud-init renders and IDCH API call can take ~30s on a
  # cold start. The HTTP route waits for both.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Spec: max_machines_running = 1 — cap blast radius if anything misbehaves.
# Fly enforces this via the [deploy] strategy + scale.
[deploy]
  strategy = "immediate"
  max_unavailable = 1
