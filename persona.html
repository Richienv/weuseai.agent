<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>weuseai.agent — Detail persona</title>
  <meta name="description" content="Detail persona weuseai.agent — apa yang dia bisa, bagaimana dia kerja, contoh output, dan template yang sudah ada di inventory." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="weuseai.agent — Detail persona" />
  <meta property="og:description" content="Detail persona weuseai.agent — apa yang dia bisa, bagaimana dia kerja, contoh output." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <!-- Persona detail content (shared with /index.html) -->
  <script src="/assets/persona-details.js"></script>

  <style>
    :root {
      --void: #0a0a0a;
      --void-2: #0d0d0d;
      --void-3: #111;
      --bone: #f5f5f5;
      --bone-d: rgba(245, 245, 245, 0.82);
      --bone-m: rgba(245, 245, 245, 0.62);
      --bone-l: rgba(245, 245, 245, 0.42);
      --signal: #E5322D;
      --signal-d: #c92823;
      --line: rgba(255, 255, 255, 0.06);
      --line-strong: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.028);
      --glass-strong: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--void);
      color: var(--bone);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* Atmospheric backdrop — large halftone in the upper-left, fades out */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: -160px;
      width: 720px;
      height: 720px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.32) 1.5px, transparent 2.2px);
      background-size: 18px 18px;
      mask-image: radial-gradient(circle at 30% 30%, #000 0%, transparent 60%);
      -webkit-mask-image: radial-gradient(circle at 30% 30%, #000 0%, transparent 60%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* Page wrapper — generous max-width + breathing padding */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 96px;
    }
    @media (min-width: 720px) { .page { padding: 40px 48px 120px; } }
    @media (min-width: 1100px) { .page { padding: 48px 72px 160px; } }

    /* Top bar — small, restrained, just back + logo */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 64px;
    }
    @media (min-width: 720px) { .topbar { margin-bottom: 96px; } }
    .topbar-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px 9px 12px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--bone-d);
      font-size: 12.5px;
      letter-spacing: 0.01em;
      transition: background 200ms ease, border-color 200ms ease;
    }
    .topbar-back:hover {
      background: rgba(229, 50, 45, 0.08);
      border-color: rgba(229, 50, 45, 0.32);
      color: var(--bone);
    }
    .topbar-back svg { width: 14px; height: 14px; }
    .topbar-logo {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
      color: var(--bone-m);
      letter-spacing: -0.01em;
    }
    .topbar-logo strong { color: var(--bone); font-weight: 400; }

    /* Hero — persona identity. Big, calm, asymmetric. */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: end;
      padding-bottom: 56px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 88px;
    }
    @media (min-width: 760px) {
      .hero { grid-template-columns: auto 1fr auto; gap: 36px; padding-bottom: 72px; margin-bottom: 112px; }
    }
    .hero-glyph {
      flex-shrink: 0;
      width: 96px; height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(229, 50, 45, 0.22), rgba(229, 50, 45, 0.04));
      border: 1px solid rgba(229, 50, 45, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 56px;
      color: var(--signal);
      box-shadow: 0 12px 40px rgba(229, 50, 45, 0.15);
    }
    @media (min-width: 760px) {
      .hero-glyph { width: 120px; height: 120px; border-radius: 28px; font-size: 70px; }
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
      margin-bottom: 12px;
    }
    .hero-name {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(44px, 7vw, 80px);
      line-height: 0.96;
      letter-spacing: -0.03em;
      color: var(--bone);
      margin: 0 0 18px;
    }
    .hero-tagline {
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.55;
      color: var(--bone-m);
      max-width: 640px;
      margin: 0;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      background: var(--signal);
      color: var(--bone);
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: background 200ms ease, transform 160ms ease;
      white-space: nowrap;
    }
    .hero-cta:hover { background: var(--signal-d); transform: translateY(-1px); }
    .hero-cta svg { width: 13px; height: 13px; }

    /* Section — generous vertical rhythm */
    .section {
      margin-bottom: 96px;
    }
    @media (min-width: 760px) { .section { margin-bottom: 128px; } }
    .section-head {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 720px;
      margin-bottom: 40px;
    }
    @media (min-width: 720px) { .section-head { margin-bottom: 56px; } }
    .section-eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
    }
    .section-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(28px, 3.5vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--bone);
      margin: 0;
    }
    .section-sub {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--bone-m);
      max-width: 580px;
      margin: 6px 0 0;
    }

    /* ── Capability cards — SYMMETRIC uniform grid (3-col desktop) ──
       Reference: skincare-magic style — equal-size cards, one clean visual
       per card centered in generous whitespace, calm caption below.
       NO span-2 or row-2 — every card has the same shape so the grid feels
       tidy and scannable. */
    .cards {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 680px) { .cards { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    @media (min-width: 980px) { .cards { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
    .card {
      position: relative;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.038), rgba(255,255,255,0.012));
      border: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 360px;
      transition: border-color 260ms ease, transform 220ms ease, box-shadow 260ms ease;
    }
    .card:hover {
      border-color: rgba(229, 50, 45, 0.32);
      transform: translateY(-2px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
    }
    /* Visual zone — centered, takes the top ~55-60% of card */
    .card-visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 32px;
      background: rgba(255, 255, 255, 0.015);
      border-bottom: 1px solid var(--line);
      min-height: 200px;
      position: relative;
      overflow: hidden;
    }
    .card-visual::after {
      /* Subtle halftone accent in the upper-right of the visual zone */
      content: '';
      position: absolute;
      top: -32px; right: -32px;
      width: 90px; height: 90px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.3) 1px, transparent 1.6px);
      background-size: 9px 9px;
      mask-image: radial-gradient(circle at top right, #000 0%, transparent 65%);
      -webkit-mask-image: radial-gradient(circle at top right, #000 0%, transparent 65%);
      pointer-events: none;
      opacity: 0.4;
    }
    /* Caption zone — bottom block, clean + compact */
    .card-cap {
      padding: 22px 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-cap-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .card-cap-idx {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid rgba(229, 50, 45, 0.32);
      border-radius: 999px;
      color: var(--signal);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-cap-idx .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--signal);
    }
    .card-cap-badge {
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(229, 50, 45, 0.16);
      color: var(--signal);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .card-cap-title {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      line-height: 1.18;
      color: var(--bone);
      letter-spacing: -0.015em;
      margin: 4px 0 0;
    }
    .card-cap-sub {
      font-size: 13px;
      line-height: 1.6;
      color: var(--bone-m);
      margin: 0;
    }

    /* ── Visual primitives — one large clean element per card ── */

    /* 1. Citation badge cluster — large [1] [2] [3] floating with a source line */
    .vis-citation {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }
    .vis-citation-refs {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }
    .vis-citation-ref {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: rgba(229, 50, 45, 0.14);
      border: 1px solid rgba(229, 50, 45, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      color: var(--signal);
      letter-spacing: -0.01em;
      position: relative;
    }
    .vis-citation-ref.tilt-l { transform: rotate(-6deg); }
    .vis-citation-ref.tilt-r { transform: rotate(6deg); }
    .vis-citation-source {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 220px;
      width: 100%;
    }
    .vis-citation-source .ln {
      height: 6px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }
    .vis-citation-source .ln.short { width: 65%; }

    /* 2. Five source icons — stacked fan, centered */
    .vis-sources {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .vis-sources-row {
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }
    .vis-source-card {
      width: 32px; height: 42px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(229, 50, 45, 0.18), rgba(229, 50, 45, 0.06));
      border: 1px solid rgba(229, 50, 45, 0.34);
      position: relative;
    }
    .vis-source-card::before, .vis-source-card::after {
      content: '';
      position: absolute;
      left: 6px; right: 6px;
      height: 3px;
      background: rgba(229, 50, 45, 0.55);
      border-radius: 1.5px;
    }
    .vis-source-card::before { top: 8px; }
    .vis-source-card::after { top: 16px; right: 14px; }
    .vis-sources-counter {
      font-family: 'Instrument Serif', serif;
      font-size: 32px;
      color: var(--signal);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .vis-sources-counter-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--bone-l);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: -8px;
    }

    /* 3. Verified / unverified — two large pills side by side */
    .vis-tags {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .vis-tag-pill {
      flex: 1;
      max-width: 120px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 14px;
      border-radius: 999px;
      border: 1px solid currentColor;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      justify-content: center;
    }
    .vis-tag-pill.ok {
      color: rgba(120, 220, 150, 0.95);
      background: rgba(120, 220, 150, 0.08);
    }
    .vis-tag-pill.warn {
      color: rgba(229, 180, 60, 0.95);
      background: rgba(229, 180, 60, 0.08);
    }
    .vis-tag-pill .glyph {
      font-family: 'Instrument Serif', serif;
      font-size: 16px;
      line-height: 1;
    }

    /* 4. Conflict — two arrows converging at a center dot */
    .vis-conflict {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      position: relative;
    }
    .vis-conflict-side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      width: 90px;
    }
    .vis-conflict-side.right { align-items: flex-start; }
    .vis-conflict-side .ln {
      height: 5px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2.5px;
    }
    .vis-conflict-side .ln.short { width: 60%; }
    .vis-conflict-center {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(229, 50, 45, 0.14);
      border: 1px solid rgba(229, 50, 45, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--signal);
      flex-shrink: 0;
    }

    /* 5. Funnel — 3 docs → arrow → summary doc */
    .vis-funnel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .vis-funnel-stack {
      position: relative;
      width: 48px; height: 60px;
    }
    .vis-funnel-stack .pg {
      position: absolute;
      width: 36px; height: 46px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }
    .vis-funnel-stack .pg:nth-child(1) { top: 0; left: 0; }
    .vis-funnel-stack .pg:nth-child(2) { top: 6px; left: 8px; }
    .vis-funnel-stack .pg:nth-child(3) {
      top: 12px; left: 16px;
      background: rgba(229, 50, 45, 0.14);
      border-color: rgba(229, 50, 45, 0.36);
    }
    .vis-funnel-arrow {
      color: var(--signal);
      font-size: 22px;
      line-height: 1;
    }
    .vis-funnel-summary {
      width: 56px; height: 64px;
      border-radius: 6px;
      background: rgba(229, 50, 45, 0.1);
      border: 1.5px solid rgba(229, 50, 45, 0.45);
      padding: 9px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vis-funnel-summary .ln {
      height: 3px;
      background: rgba(229, 50, 45, 0.5);
      border-radius: 1.5px;
    }
    .vis-funnel-summary .ln.short { width: 60%; }

    /* Citation paragraph + footnotes */
    .mock-paragraph {
      font-size: 11px;
      line-height: 1.7;
      color: var(--bone-d);
    }
    .mock-paragraph .ref {
      display: inline-block;
      background: rgba(229, 50, 45, 0.18);
      color: var(--signal);
      border-radius: 3px;
      padding: 0 5px;
      font-size: 9.5px;
      margin: 0 2px;
      vertical-align: 1px;
      letter-spacing: 0.04em;
    }
    .mock-footnotes {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.07);
    }
    .mock-footnote {
      font-size: 9.5px;
      color: var(--bone-l);
      line-height: 1.8;
      display: flex;
      gap: 8px;
    }
    .mock-footnote .num { color: var(--signal); flex-shrink: 0; }

    /* Verified / unverified split */
    .mock-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mock-split-col {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .mock-split-col .lbl {
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .mock-split-col.verified .lbl { color: rgba(120, 220, 150, 0.95); }
    .mock-split-col.unverified .lbl { color: rgba(229, 180, 60, 0.95); }
    .mock-split-col .ln {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin: 3px 0;
    }
    .mock-split-col.verified .ln { background: rgba(120, 220, 150, 0.34); }
    .mock-split-col.unverified .ln { background: rgba(229, 180, 60, 0.34); }

    /* Conflict — opposing quotes side by side */
    .mock-conflict {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
    }
    .mock-conflict::before {
      content: 'vs';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: rgba(229, 50, 45, 0.7);
      background: var(--void-2);
      padding: 2px 8px;
      border-radius: 50%;
      z-index: 2;
      line-height: 1;
    }
    .mock-quote {
      background: rgba(255, 255, 255, 0.025);
      border-left: 2px solid rgba(229, 50, 45, 0.4);
      padding: 9px 11px;
      border-radius: 5px;
      font-size: 10.5px;
      line-height: 1.6;
      color: var(--bone-d);
      font-style: italic;
    }
    .mock-quote .src {
      display: block;
      margin-top: 6px;
      font-style: normal;
      font-size: 9px;
      color: var(--bone-l);
      letter-spacing: 0.04em;
    }

    /* Source-count visual */
    .mock-sources {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      justify-content: center;
      padding: 10px 0 4px;
    }
    .mock-source-icon {
      width: 22px;
      height: 28px;
      background: rgba(229, 50, 45, 0.18);
      border: 1px solid rgba(229, 50, 45, 0.32);
      border-radius: 3px;
      position: relative;
    }
    .mock-source-icon::before {
      content: '';
      position: absolute;
      top: 5px; left: 4px; right: 4px;
      height: 2px;
      background: rgba(229, 50, 45, 0.55);
      box-shadow: 0 4px 0 rgba(229, 50, 45, 0.55), 0 8px 0 rgba(229, 50, 45, 0.55);
    }
    .mock-counter {
      text-align: center;
      font-family: 'Instrument Serif', serif;
      font-size: 36px;
      color: var(--signal);
      line-height: 1;
      margin-top: 10px;
      letter-spacing: -0.02em;
    }
    .mock-counter-lbl {
      text-align: center;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--bone-l);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Sintesis funnel */
    .mock-funnel {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
    }
    .mock-paper-stack {
      position: relative;
      width: 40px;
      height: 44px;
      flex-shrink: 0;
    }
    .mock-paper-stack .pg {
      position: absolute;
      width: 26px;

    function getSlugFromURL() {
      try {
        const u = new URL(window.location.href);
        const q = u.searchParams.get('slug');
        if (q) return q;
        // Allow /persona/<slug> if Vercel rewrites are configured
        const m = u.pathname.match(/^\/persona\/([\w-]+)/);
        if (m) return m[1];
      } catch (e) { /* ignore */ }
      return null;
    }

    // Small renaming helper used for the bold-bracket caption in deliverable

        default:           return (<svg {...c}><circle cx="12" cy="12" r="9" /></svg>);

          badge: null,
          title: 'Sintesis 10+ paper',
          sub: 'Decompose, baca, distill jadi exec summary dua halaman dengan methodology note.',
          visual: (
            <div className="vis-funnel">
              <div className="vis-funnel-stack">
                <span className="pg" /><span className="pg" /><span className="pg" />
              </div>
              <span className="vis-funnel-arrow">→</span>
              <div className="vis-funnel-summary">
                <div className="ln" /><div className="ln" /><div className="ln short" />
              </div>
            </div>
          ),
        },
      ];
      return (
        <div className="cards">
          {cards.map((c, i) => (
            <div key={i} className="card">
              <div className="card-visual">{c.visual}</div>
              <div className="card-cap">
                {c.badge && (
                  <div className="card-cap-row">
                    <span className="card-cap-badge">{c.badge}</span>
                  </div>
                )}
                <h3 className="card-cap-title">{c.title}</h3>
                <p className="card-cap-sub">{c.sub}</p>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // Generic fallback — same uniform card shape, simple text-only visual zone
    // (until each persona gets bespoke visuals authored).
    function CapabilityCardsGeneric({ persona }) {
      return (
        <div className="cards">
          {persona.capabilities.map((c, i) => {
            const parts = c.split('—');
            const title = parts[0].trim();
            const sub = parts.length > 1 ? parts.slice(1).join('—').trim() : '';
            return (
              <div key={i} className="card">
                <div className="card-visual">
                  <div style={{ width: 56, height: 56, borderRadius: 14, background: 'rgba(229,50,45,0.1)', border: '1px solid rgba(229,50,45,0.28)' }} />
                </div>
                <div className="card-cap">
                  <h3 className="card-cap-title">{title}</h3>
                  {sub && <p className="card-cap-sub">{sub}</p>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function CapabilityCards({ persona }) {
      if (persona.slug === 'deep-researcher') return <CapabilityCardsDeepResearcher />;
      return <CapabilityCardsGeneric persona={persona} />;
    }

    // ─────────────── flow bento ───────────────
    function FlowCards({ persona }) {
      const icons = FLOW_ICONS[persona.slug] || [];
      return (
        <div className="flow-bento">
          {persona.flow.map((step, i) => (
            <div key={i} className="flow-card">
              <div className="flow-card-head">
                <span className="flow-card-num">{String(i + 1).padStart(2, '0')}</span>
                <span className="flow-card-icon"><StepIcon kind={icons[i]} /></span>
              </div>
              <h4 className="flow-card-title">{step.title}</h4>
              <p className="flow-card-desc">{step.desc}</p>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────── deliverable bento ───────────────
    function DeliverableCards({ persona }) {
      return (
        <div className="deliv-bento">
          <div className="deliv-frame">
            <div className="deliv-frame-inner">
              <DeliverableInner kind={persona.deliverable.kind} />
            </div>
            <p className="deliv-caption" dangerouslySetInnerHTML={{ __html: renderBoldMd(persona.deliverable.caption) }} />
          </div>
          <div className="deliv-frame">
            <div className="deliv-frame-inner">
              <div className="mini-title">Output yang kamu pegang</div>
              <div style={{ fontSize: 11, color: 'var(--bone-m)', marginTop: 10, lineHeight: 1.65 }}>
                Setiap deliverable di-versi dan tersimpan di VPS kamu sendiri. Aku tidak push ke cloud pihak ketiga tanpa kamu approve.
              </div>
              <div style={{ marginTop: 14, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {persona.templates.slice(0, 3).map((t, i) => (
                  <span key={i} className="mini-chip">{t.kind}</span>
                ))}
              </div>
            </div>
            <p className="deliv-caption">
              Output disimpan <strong>di VPS kamu</strong>. Versi history, audit log, dan export ke format apapun yang kamu mau.
            </p>
          </div>
        </div>
      );
    }

    // ─────────────── templates bento ───────────────
    function TemplateCards({ persona }) {
      return (
        <div className="tpl-bento">
          {persona.templates.map((t, i) => (
            <div key={i} className="tpl-card">
              <div className="tpl-icon">{(t.kind || 'tpl').slice(0, 3).toUpperCase()}</div>
              <div className="tpl-body">
                <div className="tpl-name">{t.name}</div>
                <div className="tpl-kind">{t.kind}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────── page ───────────────
    function PersonaPage() {
      const slug = useMemo(getSlugFromURL, []);
      const persona = useMemo(() => {
        if (!slug || !Array.isArray(window.PERSONA_DETAILS)) return null;
        return window.PERSONA_DETAILS.find((p) => p.slug === slug) || null;
      }, [slug]);

      // Update document title once persona loads
      useEffect(() => {
        if (persona) {
          document.title = `${persona.name} — weuseai.agent`;
        } else {
          document.title = 'Persona tidak ditemukan — weuseai.agent';
        }
      }, [persona]);

      if (!persona) {
        return (
          <div className="page">
            <div className="topbar">
              <a className="topbar-back" href="/#persona-details">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="15 18 9 12 15 6" />
                </svg>
                <span>Kembali ke landing</span>
              </a>
              <div className="topbar-logo"><strong>weuseai</strong>.agent</div>
            </div>
            <div className="nf">
              <h1>Persona tidak ditemukan</h1>
              <p>Slug yang kamu buka tidak cocok dengan persona yang ada. Cek ejaan, atau kembali ke landing untuk lihat semua persona.</p>
              <a className="footer-cta-primary" href="/#persona-details" style={{ display: 'inline-flex' }}>
                <span>Lihat semua persona</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      return (
        <div className="page">
          {/* Top bar */}
          <div className="topbar">
            <a className="topbar-back" href="/#persona-details">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              <span>Semua persona</span>
            </a>
            <div className="topbar-logo"><strong>weuseai</strong>.agent</div>
          </div>

          {/* Hero */}
          <header className="hero">
            <div className="hero-glyph">{persona.glyph}</div>
            <div>
              <div className="hero-eyebrow">Persona spesialis</div>
              <h1 className="hero-name">{persona.name}</h1>
              <p className="hero-tagline">{persona.tagline}</p>
            </div>
            <a className="hero-cta" href={`/checkout?persona=${persona.slug}`}>
              <span>Pilih {persona.name}</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
              </svg>
            </a>
          </header>

          {/* Section: Apa yang aku bisa */}
          <section className="section">
            <div className="section-head">
              <div className="section-eyebrow">Apa yang aku bisa</div>
              <h2 className="section-title">Kapabilitas inti</h2>
              <p className="section-sub">Bukan deskripsi umum — tiap kapabilitas dirancang untuk satu jenis kerja konkret.</p>
            </div>
            <CapabilityCards persona={persona} />
          </section>

          {/* Section: Contoh deliverable */}
          <section className="section">
            <div className="section-head">
              <div className="section-eyebrow">Contoh deliverable</div>
              <h2 className="section-title">Seperti apa output-nya</h2>
              <p className="section-sub">Preview shape — content actual selalu disesuaikan dengan input kamu.</p>
            </div>
            <DeliverableCards persona={persona} />
          </section>

          {/* Section: Templates */}
          <section className="section">
            <div className="section-head">
              <div className="section-eyebrow">Templates aku punya</div>
              <h2 className="section-title">Sudah ada di inventory</h2>
              <p className="section-sub">Template ini dipakai sebagai starting frame. Kamu tetap pegang final draft.</p>
            </div>
            <TemplateCards persona={persona} />
          </section>

          {/* Footer CTA */}
          <div className="footer-cta">
            <div>
              <h2 className="footer-cta-title">Siap pakai {persona.name}?</h2>
              <p className="footer-cta-hint">Checkout 5 menit, Telegram bot kamu siap hari ini. Kamu bisa pause kapan saja.</p>
            </div>
            <a className="footer-cta-primary" href={`/checkout?persona=${persona.slug}`}>
              <span>Pilih {persona.name} sebagai agent kamu</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
              </svg>
            </a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<PersonaPage />);
  </script>
</body>
</html>
