  <!--
    Identitas per persona.

    Halaman ini melayani banyak persona lewat /persona/<slug> (rewrite di
    vercel.json) atau /persona.html?slug=<slug>. Tanpa langkah ini, sepuluh
    persona berbagi satu judul dan satu deskripsi — jadi hasil pencarian dan
    preview saat dibagikan terlihat identik semua.

    Dijalankan vanilla di <head>, sesudah persona-details.js selesai dimuat
    (script biasa, sinkron), jadi window.PERSONA_DETAILS sudah tersedia dan
    meta-nya sudah benar sebelum React bahkan mulai render.
  -->
  <script>
    (function () {
      var ORIGIN = 'https://www.weuseai.id';
      var OG_IMAGE = ORIGIN + '/assets/og-image.png';

      function readSlug() {
        try {
          var u = new URL(window.location.href);
          var q = u.searchParams.get('slug');
          if (q) return q;
          var m = u.pathname.match(/^\/persona\/([\w-]+)/);
          if (m) return m[1];
        } catch (e) { /* URL tidak bisa dibaca — pakai meta statis */ }
        return null;
      }

      function setMeta(attr, key, value) {
        var el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, key);
          document.head.appendChild(el);
        }
        el.setAttribute('content', value);
      }

      function setCanonical(href) {
        var el = document.head.querySelector('link[rel="canonical"]');
        if (!el) {
          el = document.createElement('link');
          el.setAttribute('rel', 'canonical');
          document.head.appendChild(el);
        }
        el.setAttribute('href', href);
      }

      function apply(slug) {
        var list = Array.isArray(window.PERSONA_DETAILS) ? window.PERSONA_DETAILS : [];
        var persona = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i] && list[i].slug === slug) { persona = list[i]; break; }
        }

        var title, description, url, imageAlt;

        if (persona) {
          title = persona.name + ' — persona weuseai.agent';
          description = (persona.tagline || '') +
            ' Lihat cara kerjanya, contoh output, dan template yang sudah ada.';
          // Bentuk ?slug= — BUKAN /persona/<slug>. Rewrite bersegmen-dinamis
          // di vercel.json tidak aktif di deployment ini: /persona/the-pro
          // menjawab 404 sementara /persona?slug=the-pro menjawab 200.
          // Meng-canonical-kan ke URL 404 membuat Google membuang halamannya.
          url = ORIGIN + '/persona?slug=' + encodeURIComponent(persona.slug);
          imageAlt = persona.name + ' — persona weuseai.agent';
        } else if (slug) {
          title = 'Persona tidak ditemukan — weuseai.agent';
          description = 'Persona ini tidak ada di daftar. Lihat sepuluh persona yang tersedia di halaman utama.';
          url = ORIGIN + '/persona';
          imageAlt = 'weuseai.agent — detail persona';
          setMeta('name', 'robots', 'noindex, follow');
        } else {
          return; // tanpa slug: biarkan meta statis apa adanya
        }

        description = description.replace(/\s+/g, ' ').trim();

        document.title = title;
        setMeta('name', 'description', description);
        setCanonical(url);
        setMeta('property', 'og:title', title);
        setMeta('property', 'og:description', description);
        setMeta('property', 'og:url', url);
        setMeta('property', 'og:image', OG_IMAGE);
        setMeta('property', 'og:image:alt', imageAlt);
        setMeta('name', 'twitter:title', title);
        setMeta('name', 'twitter:description', description);
        setMeta('name', 'twitter:image', OG_IMAGE);
        setMeta('name', 'twitter:image:alt', imageAlt);
      }

      // Dipakai ulang oleh React supaya judulnya cuma punya satu sumber.
      window.__applyPersonaMeta = apply;
      apply(readSlug());
    })();
  </script>

  <style>
    :root {
      --void: #0a0a0a;
      --void-2: #0d0d0d;
      --void-3: #111;
      --bone: #f5f5f5;
      --bone-d: rgba(245, 245, 245, 0.82);
      --bone-m: rgba(245, 245, 245, 0.62);
      --bone-l: rgba(245, 245, 245, 0.42);
      --signal: #E5322D;
      --signal-d: #c92823;
      --line: rgba(255, 255, 255, 0.06);
      --line-strong: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.028);
      --glass-strong: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--void);
      color: var(--bone);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* Atmospheric backdrop — large halftone in the upper-left, fades out */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: -160px;
      width: 720px;
      height: 720px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.32) 1.5px, transparent 2.2px);
      background-size: 18px 18px;
      mask-image: radial-gradient(circle at 30% 30%, #000 0%, transparent 60%);
      -webkit-mask-image: radial-gradient(circle at 30% 30%, #000 0%, transparent 60%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* Cinematic warm glow — fixed at bottom-center of viewport, follows the
       reader as they scroll. Inspired by the Claude Summon ambient halo
       (2026-05-27 cowork). Signal-Red palette with a peach-ish core so the
       whole page feels lit from below — calm, premium, never gaudy. */
    body::after {
      content: '';
      position: fixed;
      left: 50%;
      bottom: -360px;
      transform: translateX(-50%);
      width: min(1400px, 140vw);
      height: 720px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 130, 80, 0.34) 0%,
          rgba(229, 80, 50, 0.24) 22%,
          rgba(229, 50, 45, 0.10) 46%,
          rgba(229, 50, 45, 0.02) 68%,
          transparent 80%
        );
      filter: blur(36px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.92;
    }
    @media (prefers-reduced-motion: no-preference) {
      body::after { animation: glowBreathe 8s ease-in-out infinite; }
    }
    @keyframes glowBreathe {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1.0; }
    }

    /* Page wrapper — generous max-width + breathing padding */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 96px;
    }
    @media (min-width: 720px) { .page { padding: 40px 48px 120px; } }
    @media (min-width: 1100px) { .page { padding: 48px 72px 160px; } }

    /* Top bar — small, restrained, just back + logo */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 64px;
    }
    @media (min-width: 720px) { .topbar { margin-bottom: 96px; } }
    .topbar-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px 9px 12px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--bone-d);
      font-size: 12.5px;
      letter-spacing: 0.01em;
      transition: background 200ms ease, border-color 200ms ease;
    }
    .topbar-back:hover {
      background: rgba(229, 50, 45, 0.08);
      border-color: rgba(229, 50, 45, 0.32);
      color: var(--bone);
    }
    .topbar-back svg { width: 14px; height: 14px; }
    .topbar-logo {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
      color: var(--bone-m);
      letter-spacing: -0.01em;
    }
    .topbar-logo strong { color: var(--bone); font-weight: 400; }

    /* Hero — persona identity. Smaller, more cinematic, stacked vertically.
       Glyph + (eyebrow + name + tagline + CTA) → CTA sits below tagline so
       the hero block reads top-to-bottom symmetric instead of being split
       three-ways across a row. */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
      padding-bottom: 56px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 88px;
    }
    @media (min-width: 760px) {
      .hero { grid-template-columns: auto 1fr; gap: 36px; padding-bottom: 72px; margin-bottom: 112px; }
    }
    .hero-glyph {
      flex-shrink: 0;
      width: 88px; height: 88px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(229, 50, 45, 0.22), rgba(229, 50, 45, 0.04));
      border: 1px solid rgba(229, 50, 45, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 50px;
      color: var(--signal);
      box-shadow: 0 12px 40px rgba(229, 50, 45, 0.15);
    }
    @media (min-width: 760px) {
      .hero-glyph { width: 104px; height: 104px; border-radius: 24px; font-size: 60px; }
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
      margin-bottom: 10px;
    }
    .hero-name {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(34px, 4.6vw, 56px);
      line-height: 1.0;
      letter-spacing: -0.025em;
      color: var(--bone);
      margin: 0 0 16px;
    }
    .hero-tagline {
      font-size: clamp(14px, 1.4vw, 17px);
      line-height: 1.6;
      color: var(--bone-m);
      max-width: 560px;
      margin: 0 0 24px;
    }
    /* CTA matches pricing section button style — solid Signal Red pill,
       white text, northeast arrow, white border equal to fill for the
       featured look. Identical hover spec as the pricing "Ambil Pro". */
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #E5322D;
      color: #ffffff;
      border: 1px solid #E5322D;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: background 200ms ease, transform 160ms ease, box-shadow 200ms ease;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(229, 50, 45, 0.28);
    }
    .hero-cta:hover {
      background: var(--signal-d);
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(229, 50, 45, 0.38);
    }
    .hero-cta svg { width: 14px; height: 14px; }

    /* Section — generous vertical rhythm */
    .section {
      margin-bottom: 96px;
    }
    @media (min-width: 760px) { .section { margin-bottom: 128px; } }
    .section-head {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 720px;
      margin-bottom: 40px;
    }
    @media (min-width: 720px) { .section-head { margin-bottom: 56px; } }
    .section-eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
    }
    .section-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(28px, 3.5vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--bone);
      margin: 0;
    }
    .section-sub {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--bone-m);
      max-width: 580px;
      margin: 6px 0 0;
    }

    /* ── Capability cards — SYMMETRIC uniform grid (3-col desktop) ──
       Reference: skincare-magic style — equal-size cards, one clean visual
       per card centered in generous whitespace, calm caption below.
       NO span-2 or row-2 — every card has the same shape so the grid feels
       tidy and scannable. */
    .cards {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 680px) { .cards { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    @media (min-width: 980px) { .cards { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
    .card {
      position: relative;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.038), rgba(255,255,255,0.012));
      border: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 360px;
      transition: border-color 260ms ease, transform 220ms ease, box-shadow 260ms ease;
    }
    .card:hover {
      border-color: rgba(229, 50, 45, 0.32);
      transform: translateY(-2px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
    }
    /* Visual zone — centered, takes the top ~55-60% of card */
    .card-visual {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 32px;
      background: rgba(255, 255, 255, 0.015);
      border-bottom: 1px solid var(--line);
      min-height: 200px;
      position: relative;
      overflow: hidden;
    }
    .card-visual::after {
      /* Subtle halftone accent in the upper-right of the visual zone */
      content: '';
      position: absolute;
      top: -32px; right: -32px;
      width: 90px; height: 90px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.3) 1px, transparent 1.6px);
      background-size: 9px 9px;
      mask-image: radial-gradient(circle at top right, #000 0%, transparent 65%);
      -webkit-mask-image: radial-gradient(circle at top right, #000 0%, transparent 65%);
      pointer-events: none;
      opacity: 0.4;
    }
    /* Caption zone — bottom block, clean + compact */
    .card-cap {
      padding: 22px 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-cap-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .card-cap-idx {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid rgba(229, 50, 45, 0.32);
      border-radius: 999px;
      color: var(--signal);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;

    .card-cap-title {

    }
    .card-cap-sub {
      font-size: 13px;
      line-height: 1.6;
      color: var(--bone-m);
      margin: 0;
    }

    /* ── Visual primitives — one large clean element per card ── */

    /* 1. Citation badge cluster — large [1] [2] [3] floating with a source line */
    .vis-citation {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }
    .vis-citation-refs {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }
    .vis-citation-ref {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: rgba(229, 50, 45, 0.14);
      border: 1px solid rgba(229, 50, 45, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      color: var(--signal);
      letter-spacing: -0.01em;
      position: relative;
    }
    .vis-citation-ref.tilt-l { transform: rotate(-6deg); }
    .vis-citation-ref.tilt-r { transform: rotate(6deg); }
    .vis-citation-source {

      flex-direction: column;
      align-items: center;

      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--bone-l);
      letter-spacing: 0.12em;

    /* 3. Verified / unverified — two large pills side by side */

    .vis-conflict-side .ln.short { width: 60%; }

      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(229, 50, 45, 0.14);
      border: 1px solid rgba(229, 50, 45, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--signal);
      flex-shrink: 0;
    }

    /* ── shared primitives used across the other 9 personas ── */

    /* Mini grid for slides / kanban / calendar */
    .vis-grid {
      display: grid;
      gap: 5px;
    }
    .vis-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .vis-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .vis-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
    .vis-grid .gcell {
      aspect-ratio: 4 / 3;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .vis-grid .gcell.accent {
      background: rgba(229, 50, 45, 0.18);
      border-color: rgba(229, 50, 45, 0.4);
    }

    /* Pill-pair — two larger pills */
    .vis-pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .vis-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(229, 50, 45, 0.1);
      border: 1px solid rgba(229, 50, 45, 0.32);
      color: var(--signal);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .vis-pill.muted {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--line);
      color: var(--bone-d);
    }

    /* Bar chart */
    .vis-bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      height: 110px;
    }
    .vis-bars .bar {
      width: 22px;
      background: linear-gradient(180deg, rgba(229, 50, 45, 0.45), rgba(229, 50, 45, 0.18));
      border-top: 1px solid rgba(229, 50, 45, 0.6);
      border-radius: 3px 3px 1px 1px;
    }

    /* Checklist with bullet checks */
    .vis-checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 220px;
    }
    .vis-checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .vis-checklist-item .chk {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(229, 50, 45, 0.18);
      border: 1px solid rgba(229, 50, 45, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--signal);
      flex-shrink: 0;
      font-size: 10px;
      line-height: 1;
    }
    .vis-checklist-item .chk.empty {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.18);
      color: transparent;
    }
    .vis-checklist-item .ln {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2.5px;
    }
    .vis-checklist-item .ln.short { max-width: 60%; }

    /* Hub + spokes — central node with branches */
    .vis-hub {
      position: relative;
      width: 200px;
      height: 110px;
    }
    .vis-hub-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(229, 50, 45, 0.18);
      border: 1.5px solid rgba(229, 50, 45, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      color: var(--signal);
      z-index: 2;
    }
    .vis-hub-spoke {
      position: absolute;
      width: 32px; height: 32px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .vis-hub-spoke::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 50px; height: 1px;
      background: linear-gradient(90deg, rgba(229, 50, 45, 0.5), transparent);
      transform-origin: 0 0;
      z-index: -1;
    }
    .vis-hub-spoke.tl { top: 0; left: 0; }
    .vis-hub-spoke.tr { top: 0; right: 0; }
    .vis-hub-spoke.bl { bottom: 0; left: 0; }
    .vis-hub-spoke.br { bottom: 0; right: 0; }

    /* Window frame — browser/terminal chrome */
    .vis-window {
      width: 100%;
      max-width: 240px;
      border-radius: 8px;
      background: var(--void-2);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .vis-window-bar {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 5px;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .vis-window-bar .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .vis-window-bar .dot.red { background: rgba(229, 50, 45, 0.55); }
    .vis-window-bar .dot.grey { background: rgba(255, 255, 255, 0.16); }
    .vis-window-bar .url {
      flex: 1;
      margin-left: 8px;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2.5px;
    }
    .vis-window-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vis-window-body .ln {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2.5px;
    }
    .vis-window-body .ln.short { width: 55%; }
    .vis-window-body .ln.med   { width: 80%; }
    .vis-window-body .ln.accent { background: rgba(229, 50, 45, 0.5); }

    /* Doc mock — single document with lines */
    .vis-doc {
      width: 130px;
      padding: 14px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vis-doc.accent {
      background: rgba(229, 50, 45, 0.08);
      border-color: rgba(229, 50, 45, 0.36);
    }
    .vis-doc .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--signal);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .vis-doc .ln {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2.5px;
    }
    .vis-doc.accent .ln { background: rgba(229, 50, 45, 0.35); }
    .vis-doc .ln.short { width: 55%; }

    /* Phone frame — for TikTok-style */
    .vis-phone {
      width: 100px;
      height: 160px;
      border-radius: 14px;
      background: var(--void-2);
      border: 2px solid var(--line-strong);
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }
    .vis-phone::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 3px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 1.5px;
    }
    .vis-phone .pln {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    .vis-phone .pln.accent { background: rgba(229, 50, 45, 0.55); }
    .vis-phone .pln.short { width: 50%; }
    .vis-phone .pln.long { width: 100%; }

    /* Timeline — horizontal with marker dots */
    .vis-timeline {
      width: 100%;
      max-width: 220px;
      position: relative;
      padding: 18px 0 8px;
    }
    .vis-timeline-line {
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
      position: relative;
    }
    .vis-timeline-mark {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(229, 50, 45, 0.2);
      border: 1.5px solid rgba(229, 50, 45, 0.55);
    }
    .vis-timeline-mark.solid {
      background: var(--signal);
    }
    .vis-timeline-lbl {
      position: absolute;
      transform: translateX(-50%);
      top: 100%;
      margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--bone-l);
      letter-spacing: 0.06em;
    }

    /* Chat bubbles — for The Pro */
    .vis-chat {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 220px;
    }
    .vis-bubble {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 80%;
    }
    .vis-bubble.right {
      align-self: flex-end;
      background: rgba(229, 50, 45, 0.1);
      border-color: rgba(229, 50, 45, 0.32);
    }
    .vis-bubble .ln {
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 2px;
      margin: 2px 0;
    }
    .vis-bubble.right .ln { background: rgba(229, 50, 45, 0.55); }
    .vis-bubble .ln.short { width: 60%; }

    /* Voice waveform — for The Pro voice match */
    .vis-waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 60px;
    }
    .vis-waveform .wb {
      width: 4px;
      background: rgba(229, 50, 45, 0.5);
      border-radius: 1.5px;
    }

    /* Counter — big serif number, reusable */
    .vis-big-num {
      font-family: 'Instrument Serif', serif;
      font-size: 56px;
      color: var(--signal);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .vis-big-num-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--bone-l);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
      text-align: center;
    }

    /* Receipt / invoice calc — for Doc Expert PPN */
    .vis-calc {
      width: 100%;
      max-width: 220px;
      padding: 14px 14px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }
    .vis-calc-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: var(--bone-m);
    }
    .vis-calc-row.total {
      border-top: 1px solid var(--line);
      margin-top: 6px;
      padding-top: 8px;
      color: var(--bone);
    }
    .vis-calc-row .num { color: var(--signal); }

    /* 5. Funnel — 3 docs → arrow → summary doc */
    .vis-funnel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .vis-funnel-stack {
      position: relative;
      width: 48px; height: 60px;
    }
    .vis-funnel-stack .pg {
      position: absolute;
      width: 36px; height: 46px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }
    .vis-funnel-stack .pg:nth-child(1) { top: 0; left: 0; }
    .vis-funnel-stack .pg:nth-child(2) { top: 6px; left: 8px; }
    .vis-funnel-stack .pg:nth-child(3) {
      top: 12px; left: 16px;
      background: rgba(229, 50, 45, 0.14);
      border-color: rgba(229, 50, 45, 0.36);
    }
    .vis-funnel-arrow {
      color: var(--signal);
      font-size: 22px;
      line-height: 1;
    }
    .vis-funnel-summary {
      width: 56px; height: 64px;
      border-radius: 6px;
      background: rgba(229, 50, 45, 0.1);
      border: 1.5px solid rgba(229, 50, 45, 0.45);
      padding: 9px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vis-funnel-summary .ln {
      height: 3px;
      background: rgba(229, 50, 45, 0.5);
      border-radius: 1.5px;
    }
    .vis-funnel-summary .ln.short { width: 60%; }

    /* Citation paragraph + footnotes */
    .mock-paragraph {
      font-size: 11px;
      line-height: 1.7;
      color: var(--bone-d);
    }
    .mock-paragraph .ref {
      display: inline-block;
      background: rgba(229, 50, 45, 0.18);
      color: var(--signal);
      border-radius: 3px;
      padding: 0 5px;
      font-size: 9.5px;
      margin: 0 2px;
      vertical-align: 1px;
      letter-spacing: 0.04em;
    }
    .mock-footnotes {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.07);
    }
    .mock-footnote {
      font-size: 9.5px;
      color: var(--bone-l);
      line-height: 1.8;
      display: flex;
      gap: 8px;
    }
    .mock-footnote .num { color: var(--signal); flex-shrink: 0; }

    /* Verified / unverified split */
    .mock-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mock-split-col {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .mock-split-col .lbl {
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .mock-split-col.verified .lbl { color: rgba(120, 220, 150, 0.95); }
    .mock-split-col.unverified .lbl { color: rgba(229, 180, 60, 0.95); }
    .mock-split-col .ln {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin: 3px 0;
    }
    .mock-split-col.verified .ln { background: rgba(120, 220, 150, 0.34); }
    .mock-split-col.unverified .ln { background: rgba(229, 180, 60, 0.34); }

    /* Conflict — opposing quotes side by side */
    .mock-conflict {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
    }
    .mock-conflict::before {
      content: 'vs';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: rgba(229, 50, 45, 0.7);
      background: var(--void-2);
      padding: 2px 8px;
      border-radius: 50%;
      z-index: 2;
      line-height: 1;
    }
    .mock-quote {
      background: rgba(255, 255, 255, 0.025);
      border-left: 2px solid rgba(229, 50, 45, 0.4);
      padding: 9px 11px;
      border-radius: 5px;
      font-size: 10.5px;
      line-height: 1.6;
      color: var(--bone-d);
      font-style: italic;
    }
    .mock-quote .src {
      display: block;
      margin-top: 6px;
      font-style: normal;
      font-size: 9px;
      color: var(--bone-l);
      letter-spacing: 0.04em;
    }

    /* Source-count visual */
    .mock-sources {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      justify-content: center;
      padding: 10px 0 4px;
    }
    .mock-source-icon {
      width: 22px;
      height: 28px;
      background: rgba(229, 50, 45, 0.18);
      border: 1px solid rgba(229, 50, 45, 0.32);
      border-radius: 3px;
      position: relative;
    }
    .mock-source-icon::before {
      content: '';
      position: absolute;
      top: 5px; left: 4px; right: 4px;
      height: 2px;
      background: rgba(229, 50, 45, 0.55);
      box-shadow: 0 4px 0 rgba(229, 50, 45, 0.55), 0 8px 0 rgba(229, 50, 45, 0.55);
    }
    .mock-counter {
      text-align: center;
      font-family: 'Instrument Serif', serif;
      font-size: 36px;
      color: var(--signal);
      line-height: 1;
      margin-top: 10px;
      letter-spacing: -0.02em;
    }
    .mock-counter-lbl {
      text-align: center;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--bone-l);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Sintesis funnel */
    .mock-funnel {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
    }
    .mock-paper-stack {
      position: relative;
      width: 40px;
      height: 44px;
      flex-shrink: 0;
    }
    .mock-paper-stack .pg {
      position: absolute;
      width: 26px;
      height: 34px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }
    .mock-paper-stack .pg:nth-child(1) { top: 0; left: 0; }
    .mock-paper-stack .pg:nth-child(2) { top: 5px; left: 7px; }
    .mock-paper-stack .pg:nth-child(3) {
      top: 10px; left: 14px;
      background: rgba(229, 50, 45, 0.16);
      border-color: rgba(229, 50, 45, 0.32);
    }
    .mock-arrow {
      color: var(--signal);
      font-size: 20px;
      line-height: 1;
    }
    .mock-summary-card {
      flex: 1;
      background: rgba(229, 50, 45, 0.06);
      border: 1px solid rgba(229, 50, 45, 0.22);
      border-radius: 5px;
      padding: 8px 9px;
    }
    .mock-summary-card .ttl {
      font-size: 9.5px;
      color: var(--signal);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .mock-summary-card .ln {
      height: 3.5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1.5px;
      margin: 3px 0;
    }
    .mock-summary-card .ln.short { width: 60%; }

    /* ── Flow bento — 3x2 on desktop with generous gaps ── */
    .flow-bento {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 600px) { .flow-bento { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
    @media (min-width: 960px) { .flow-bento { grid-template-columns: repeat(3, 1fr); gap: 22px; } }
    .flow-card {
      position: relative;
      padding: 24px 22px 26px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 170px;
    }
    .flow-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .flow-card-num {
      font-family: 'Instrument Serif', serif;
      font-size: 38px;
      color: rgba(229, 50, 45, 0.9);
      line-height: 0.85;
      letter-spacing: -0.02em;
    }
    .flow-card-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: rgba(229, 50, 45, 0.1);
      border: 1px solid rgba(229, 50, 45, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--signal);
      flex-shrink: 0;
    }
    .flow-card-icon svg { width: 14px; height: 14px; }
    .flow-card-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--bone);
      line-height: 1.3;
      margin: 0;
    }
    .flow-card-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--bone-m);
      margin: 0;
    }

    /* ── Deliverable frames — symmetric, equal-width on desktop ── */
    .deliv-bento {
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 760px) {
      .deliv-bento { grid-template-columns: repeat(2, 1fr); gap: 28px; }
    }
    .deliv-frame {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.012));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      overflow: hidden;
    }
    .deliv-frame::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 18px;
      width: 48px;
      height: 10px;
      background:
        radial-gradient(circle at 5px 5px, rgba(229, 50, 45, 0.5) 4px, transparent 4.6px),
        radial-gradient(circle at 21px 5px, rgba(255, 255, 255, 0.2) 4px, transparent 4.6px),
        radial-gradient(circle at 37px 5px, rgba(255, 255, 255, 0.13) 4px, transparent 4.6px);
    }
    .deliv-frame-inner {
      margin-top: 22px;
      background: var(--void-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.65;
      color: var(--bone-m);
      min-height: 200px;
    }
    .deliv-frame-inner .mini-title {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
      color: var(--bone);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .deliv-frame-inner .mini-eyebrow {
      font-size: 10px;
      color: rgba(229, 50, 45, 0.85);
      letter-spacing: 0.13em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .deliv-frame-inner .mini-line {
      height: 5px;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 2.5px;
      margin: 6px 0;
    }
    .deliv-frame-inner .mini-line.short { width: 50%; }
    .deliv-frame-inner .mini-line.med   { width: 75%; }
    .deliv-frame-inner .mini-line.long  { width: 100%; }
    .deliv-frame-inner .mini-line.accent { background: rgba(229, 50, 45, 0.55); }
    .deliv-frame-inner .mini-citation {
      font-size: 10px;

    const { useEffect, useMemo } = React;

    // ─────────────── helpers ───────────────
    function getSlugFromURL() {
      try {
        const u = new URL(window.location.href);
        const q = u.searchParams.get('slug');
        if (q) return q;
        // Allow /persona/<slug> if Vercel rewrites are configured
        const m = u.pathname.match(/^\/persona\/([\w-]+)/);
        if (m) return m[1];
      } catch (e) { /* ignore */ }
      return null;
    }

    // Small renaming helper used for the bold-bracket caption in deliverable
    function renderBoldMd(s) {
      return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        case 'checkpoint': return (<svg {...c}><rect x="5" y="5" width="14" height="14" rx="2" /><polyline points="9 12 11 14 15 10" /></svg>);

        case 'synth':      return (<svg {...c}><path d="M12 2v6M5 12h14M12 16v6" /><circle cx="12" cy="12" r="3" /></svg>);
        default:           return (<svg {...c}><circle cx="12" cy="12" r="9" /></svg>);

              <div className="vis-big-num">15.6<span style={{ fontSize: 22, opacity: 0.65 }}>K</span></div>
              <div className="vis-big-num-lbl">IDR / USD</div>
              <div className="vis-pill" style={{ marginTop: 4 }}>BI 7DRR · 6.00%</div>
            </div>
          ),
        },
        {
          title: 'Bitget read-only',
          sub: 'Portfolio snapshot, P&L, funding rate signal. Tidak execute trade.',
          visual: (
            <div className="vis-window">
              <div className="vis-window-bar"><div className="dot red" /><div className="dot grey" /><div className="dot grey" /><div className="url" /></div>
              <div className="vis-window-body">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ height: 4, width: 60, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }} />
                  <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 9, color: 'rgba(120,220,150,0.95)' }}>+4.2%</span>
                </div>
                <div className="ln short" /><div className="ln" />
                <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 9, color: 'var(--bone-l)', letterSpacing: '0.1em' }}>READ-ONLY</span>
              </div>
            </div>
          ),
        },
      ]} />;
    }

    // ─────────────── Video Producer ───────────────
    function CapabilityCardsVideoProducer() {
      return <UniformCards cards={[
        {
          title: 'Script TikTok 15-90s',
          sub: 'Hook-body-CTA, hook 3 detik pertama jadi prioritas.',
          visual: (
            <div className="vis-phone">
              <div className="pln accent short" />
              <div className="pln long" /><div className="pln" />
              <div className="pln short" /><div className="pln" />
              <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: 4 }}>
                <div className="pln accent" /><div className="pln short" />
              </div>
            </div>
          ),
        },
        {
          title: 'Hashtag research per niche',
          sub: 'Emerging, peak, atau decay. Tag mix sesuai target audience.',
          visual: (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center' }}>
              <div className="vis-pills">
                <span className="vis-pill">#emerging</span>
                <span className="vis-pill muted">#peak</span>
              </div>
              <div className="vis-pills">
                <span className="vis-pill muted">#decay</span>
                <span className="vis-pill">#niche</span>
              </div>
            </div>
          ),
        },
        {
          title: 'Sound trend tracking',
          sub: 'Early ride atau saturated — kamu tahu sebelum putuskan adopt.',
          visual: (
            <div className="vis-waveform" style={{ height: 70 }}>
              {[18, 38, 28, 52, 42, 60, 48, 70, 58, 44, 30, 22].map((h, i) => (
                <span key={i} className="wb" style={{ height: h }} />
              ))}
            </div>
          ),
        },
        {
          title: 'Edit suggestion',
          sub: 'Cut points, transition style, B-roll prompts, timing per beat.',
          visual: (
            <div className="vis-timeline">
              <div className="vis-timeline-line" />
              {[10, 28, 52, 76, 94].map((pct, i) => (
                <div key={i} className={`vis-timeline-mark${[1, 3].includes(i) ? ' solid' : ''}`} style={{ left: `${pct}%` }} />
              ))}
              <div className="vis-timeline-lbl" style={{ left: '0%' }}>0:00</div>
              <div className="vis-timeline-lbl" style={{ left: '100%' }}>0:30</div>
            </div>
          ),
        },
        {
          title: 'HyperFrames storyboard',
          sub: 'JSON spec per-scene siap render di RunwayML atau Sora.',
          visual: (
            <div className="vis-grid cols-4" style={{ width: 180 }}>
              <span className="gcell accent" /><span className="gcell" />
              <span className="gcell" /><span className="gcell accent" />
            </div>
          ),
        },
      ]} />;
    }

    function CapabilityCards({ persona }) {
      switch (persona.slug) {
        case 'deep-researcher':   return <CapabilityCardsDeepResearcher />;
        case 'the-pro':           return <CapabilityCardsThePro />;
        case 'slide-master':      return <CapabilityCardsSlideMaster />;
        case 'doc-expert':        return <CapabilityCardsDocExpert />;
        case 'business-agent':    return <CapabilityCardsBusinessAgent />;
        case 'project-conductor': return <CapabilityCardsProjectConductor />;
        case 'web-app-builder':   return <CapabilityCardsWebAppBuilder />;
        case 'social-conductor':  return <CapabilityCardsSocialConductor />;
        case 'trade-pro':         return <CapabilityCardsTradePro />;
        case 'video-producer':    return <CapabilityCardsVideoProducer />;
        default:                  return <CapabilityCardsGeneric persona={persona} />;
      }
    }

    // ─────────────── flow bento ───────────────
    function FlowCards({ persona }) {
      const icons = FLOW_ICONS[persona.slug] || [];
      return (
        <div className="flow-bento">
          {persona.flow.map((step, i) => (
            <div key={i} className="flow-card">
              <div className="flow-card-head">
                <span className="flow-card-num">{String(i + 1).padStart(2, '0')}</span>
                <span className="flow-card-icon"><StepIcon kind={icons[i]} /></span>
              </div>
              <h4 className="flow-card-title">{step.title}</h4>
              <p className="flow-card-desc">{step.desc}</p>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────── deliverable bento ───────────────
    function DeliverableCards({ persona }) {
      return (
        <div className="deliv-bento">
          <div className="deliv-frame">
            <div className="deliv-frame-inner">
              <DeliverableInner kind={persona.deliverable.kind} />
            </div>
            <p className="deliv-caption" dangerouslySetInnerHTML={{ __html: renderBoldMd(persona.deliverable.caption) }} />
          </div>
          <div className="deliv-frame">
            <div className="deliv-frame-inner">
              <div className="mini-title">Output yang kamu pegang</div>
              <div style={{ fontSize: 11, color: 'var(--bone-m)', marginTop: 10, lineHeight: 1.65 }}>
                Setiap deliverable di-versi dan tersimpan di VPS kamu sendiri. Aku tidak push ke cloud pihak ketiga tanpa kamu approve.
              </div>
              <div style={{ marginTop: 14, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {persona.templates.slice(0, 3).map((t, i) => (
                  <span key={i} className="mini-chip">{t.kind}</span>
                ))}
              </div>
            </div>
            <p className="deliv-caption">
              Output disimpan <strong>di VPS kamu</strong>. Versi history, audit log, dan export ke format apapun yang kamu mau.
            </p>
          </div>
        </div>
      );
    }

    // ─────────────── templates bento ───────────────
    function TemplateCards({ persona }) {
      return (
        <div className="tpl-bento">
          {persona.templates.map((t, i) => (
            <div key={i} className="tpl-card">
              <div className="tpl-icon">{(t.kind || 'tpl').slice(0, 3).toUpperCase()}</div>
              <div className="tpl-body">
                <div className="tpl-name">{t.name}</div>
                <div className="tpl-kind">{t.kind}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────── page ───────────────
    function PersonaPage() {
      const slug = useMemo(getSlugFromURL, []);
      const persona = useMemo(() => {
        if (!slug || !Array.isArray(window.PERSONA_DETAILS)) return null;
        return window.PERSONA_DETAILS.find((p) => p.slug === slug) || null;
      }, [slug]);

      // Judul + meta share dipegang oleh helper di <head> (satu sumber, sudah
      // jalan sebelum render). Di sini cuma dipanggil ulang kalau slug berubah.
      useEffect(() => {
        if (typeof window.__applyPersonaMeta === 'function') {
          window.__applyPersonaMeta(slug);
        }
      }, [slug]);

      if (!persona) {
        return (
          <div className="page">
            <div className="topbar">
              <a className="topbar-back" href="/#persona-details">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="15 18 9 12 15 6" />
                </svg>
                <span>Kembali ke landing</span>
              </a>
              <div className="topbar-logo"><strong>weuseai</strong>.agent</div>
            </div>
            <div className="nf">
              <h1>Persona tidak ditemukan</h1>
              <p>Slug yang kamu buka tidak cocok dengan persona yang ada. Cek ejaan, atau kembali ke landing untuk lihat semua persona.</p>
              <a className="footer-cta-primary" href="/#persona-details" style={{ display: 'inline-flex' }}>
                <span>Lihat semua persona</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
                </svg>
              </a>
            </div>
          </div>
        );
      }

      return (
        <div className="page">
          {/* Top bar */}
          <div className="topbar">
            <a className="topbar-back" href="/#persona-details">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              <span>Semua persona</span>
            </a>
            <div className="topbar-logo"><strong>weuseai</strong>.agent</div>
          </div>

          {/* Hero — glyph + (eyebrow / name / tagline / CTA stacked) */}
          <header className="hero">
            <div className="hero-glyph">{persona.glyph}</div>
            <div>
              <div className="hero-eyebrow">Persona spesialis</div>
              <h1 className="hero-name">{persona.name}</h1>
              <p className="hero-tagline">{persona.tagline}</p>
              <a className="hero-cta" href={`/checkout?persona=${persona.slug}`}>
                <span>Pilih {persona.name}</span>
                {/* Northeast arrow — matches pricing-section CTA glyph for continuity */}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                  <path d="M7 17 17 7" />
                  <path d="M7 7h10v10" />
                </svg>
              </a>
            </div>
          </header>

          {/* Section: Apa yang aku bisa */}
          <section className="section">
            <div className="section-head">
              <div className="section-eyebrow">Apa yang aku bisa</div>
              <h2 className="section-title">Kapabilitas inti</h2>
              <p className="section-sub">Bukan deskripsi umum — tiap kapabilitas dirancang untuk satu jenis kerja konkret.</p>
            </div>
            <CapabilityCards persona={persona} />
          </section>

          {/* Section: Contoh deliverable */}
          <section className="section">
            <div className="section-head">
              <div className="section-eyebrow">Contoh deliverable</div>
              <h2 className="section-title">Seperti apa output-nya</h2>
              <p className="section-sub">Preview shape — content actual selalu disesuaikan dengan input kamu.</p>
            </div>
            <DeliverableCards persona={persona} />
          </section>

          {/* Section: Templates */}
          <section className="section">
            <div className="section-head">
              <div className="section-eyebrow">Templates aku punya</div>
              <h2 className="section-title">Sudah ada di inventory</h2>
              <p className="section-sub">Template ini dipakai sebagai starting frame. Kamu tetap pegang final draft.</p>
            </div>
            <TemplateCards persona={persona} />
          </section>

          {/* Footer CTA */}
          <div className="footer-cta">
            <div>
              <h2 className="footer-cta-title">Siap pakai {persona.name}?</h2>
              <p className="footer-cta-hint">Checkout 5 menit, Telegram bot kamu siap hari ini. Kamu bisa pause kapan saja.</p>
            </div>
            <a className="footer-cta-primary" href={`/checkout?persona=${persona.slug}`}>
              <span>Pilih {persona.name} sebagai agent kamu</span>
              {/* Northeast arrow — matches pricing-section CTA glyph for continuity */}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M7 17 17 7" />
                <path d="M7 7h10v10" />
              </svg>
            </a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<PersonaPage />);
  </script>
</body>
</html>
