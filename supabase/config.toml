# Supabase project config — read by `supabase functions deploy` to set per-
# function flags. Without this file, deploys default to `verify_jwt = true`,
# which gates the function behind a Supabase JWT and returns 401
# UNAUTHORIZED_NO_AUTH_HEADER for callers that don't send one.
#
# Both Edge Functions here are called by parties that CANNOT send a Supabase
# JWT and must remain unauthenticated at the gateway:
#
#   - xendit-webhook  → called server-to-server by Xendit; auth is the
#                       shared `x-callback-token` secret, verified inside
#                       the function.
#   - create-invoice  → called pre-auth from checkout.html in the browser
#                       (customer hasn't signed in yet); the function
#                       recomputes amounts server-side and trusts no input.
#
# Regression history: 2026-05-02 deploy of xendit-webhook without this file
# flipped verify_jwt back on, breaking the Xendit callback path entirely.

project_id = "gtjgsligllbjcisiyrah"

[functions.xendit-webhook]
verify_jwt = false

[functions.create-invoice]
verify_jwt = false

# Onboarding flow (Phase 1, post-payment). Both bypass Supabase JWT:
#
#   - complete-onboarding → called from onboarding.html in the browser; the
#                           customer doesn't have a Supabase JWT (we don't
#                           use Supabase Auth for end customers). Auth is
#                           "knowledge of the cid UUID" + server-side
#                           validation that cid maps to a paid subscription
#                           and that pairing is complete.
#   - telegram-bot-webhook → called server-to-server by Telegram; auth is
#                            the X-Telegram-Bot-Api-Secret-Token header
#                            verified inside the function against the
#                            secret_token set on setWebhook.
[functions.complete-onboarding]
verify_jwt = false

[functions.telegram-bot-webhook]
verify_jwt = false

# rotate-pairing-code → called from onboarding.html in the browser before
# any server-side state has been confirmed (no Supabase Auth JWT at this
# point in the flow). Authz is "knowledge of cid + paid subscription
# verified server-side". Replaces the unsafe anon column-grant approach
# from 20260506140000 (see 20260506150000_revoke_pairing_anon_update.sql).
[functions.rotate-pairing-code]
verify_jwt = false

# Workflow library (Phase 2E-1.5, Hermes-native). All five bypass
# Supabase JWT — Hermes on the customer's VPS calls these as
# server-to-server with customer_id in the body. No browser-facing
# CORS concerns; no Supabase JWT carried across.
#
# Removed vs the pre-pivot version: workflow-discover (Hermes does
# intent matching natively now) + the OPENROUTER_ORCHESTRATION_KEY
# secret (no platform-side LLM calls remain).
#
#   - workflow-list             → catalog browser (debugging UI)
#   - workflow-execute          → validate + tier check + handler routing
#                                 + workflow_runs audit row per call
#   - invoice-generator-handler → renders HTML invoice template, uploads
#                                 to Storage, returns 24h signed URL
#   - daily-briefing-handler    → composes markdown briefing from mock
#                                 fixtures (real MCPs land in 2C-2)
#   - tiktok-script-handler     → schema validator only; Hermes generates
#                                 JSON locally on VPS using customer's BYOK
#                                 LLM, posts here for canonicalization
[functions.workflow-list]
verify_jwt = false

[functions.workflow-execute]
verify_jwt = false

# Playbook state-machine engine (Phase 1 Week 2, 2026-05-18 consult).
# Hermes on the customer's VPS calls this server-to-server to drive a
# persona playbook. Bypasses Supabase JWT — same model as workflow-execute
# — and the handler does its own X-CID == customer_id gate.
[functions.flow-state]
verify_jwt = false

[functions.invoice-generator-handler]
verify_jwt = false

[functions.daily-briefing-handler]
verify_jwt = false

[functions.tiktok-script-handler]
verify_jwt = false

# Bundle delivery (Phase 2E-2). All three bypass Supabase JWT — admin
# endpoint (bundle-publish) does its own service-role-bearer check
# inline; customer endpoints (bundle-fetch, bundle-pull-record) trust
# customer_id UUID + active subscription (same model as workflow-execute).
#
#   - bundle-publish      → admin only (service-role bearer required)
#                            uploads bundles/<slug>/<version>.tar.gz to
#                            workflow-templates Storage bucket
#   - bundle-fetch        → customer-auth, returns 5-min signed URL by
#                            tier+policy version resolution
#   - bundle-pull-record  → customer-auth, telemetry write into
#                            bundle_pull_attempts (best-effort)
[functions.bundle-publish]
verify_jwt = false

[functions.bundle-fetch]
verify_jwt = false

[functions.bundle-pull-record]
verify_jwt = false

# Phase 2E-3 additions. Both use the JWT-role admin auth pattern (see
# docs/security/jwt-role-pattern.md + supabase/functions/_shared/admin-auth.ts).
#
#   - pdf-render          → admin only (service-role bearer); renders
#                            HTML → PDF via Cloudflare Browser Rendering,
#                            uploads to pdf-renders bucket, returns
#                            30-day signed URL.
#   - customer-tier-bump  → admin only (service-role bearer); resolves
#                            customer → updates tier in DB → calls
#                            provisioning service /tier-bump (SSH) →
#                            audits + nudges. Triggered by xendit-webhook.
[functions.pdf-render]
verify_jwt = false

[functions.customer-tier-bump]
verify_jwt = false

# Per-customer Telegram bot pairing flow (Phase 1, Pair-flow Option A —
# 2026-05-09). All four bypass Supabase JWT — see comments above for the
# auth-pattern rationale (cid + paid subscription verified server-side
# for browser-callable; Telegram secret-token header for the webhook).
#
# History note (2026-05-10): validate-bot-token + pair-customer-bot-webhook
# were missing from this file at one point and got 401-ed in prod after a
# deploy that flipped them back to verify_jwt=true. Same regression class
# as the 2026-05-02 xendit-webhook incident referenced at the top of this
# file. tests/edge-fn-verify-jwt-config.spec.ts now pins this shut.
#
#   - validate-bot-token        → onboarding step 2 (browser pastes the
#                                  customer's BotFather token)
#   - pair-customer-bot-webhook → Telegram → customer's own bot when they
#                                  send /pair <code>; auth = secret-token
#                                  header on setWebhook
#   - reset-bot-pairing         → onboarding step 3 "Bukan bot kamu —
#                                  Ganti bot" recovery (PR #56)
#   - save-onboarding-profile   → onboarding step 1 capture of Name +
#                                  Email + WhatsApp post-payment (PR #57)
[functions.validate-bot-token]
verify_jwt = false

[functions.pair-customer-bot-webhook]
verify_jwt = false

[functions.reset-bot-pairing]
verify_jwt = false

[functions.save-onboarding-profile]
verify_jwt = false

# Track 1 (post-pair UX polish, 2026-05-10): browser-callable readiness
# probe wrapper. welcome.html polls this every 10s during state A/B and
# only transitions to "klik Buka Telegram" when critical checks pass.
# Authz: customer_id must be UUID + map to existing customer with
# subscription. No PII in response (just 8 booleans + vps_id + ip).
[functions.customer-readiness]
verify_jwt = false

# Track 3c (2026-05-10): admin-only manual rescue path. Service-role
# JWT required. Gateway verifies bearer (verify_jwt=true), then
# isServiceRoleCaller in the handler extracts role from the verified
# JWT. Per docs/security/jwt-role-pattern.md.
[functions.admin-customer-vps-refresh]
verify_jwt = true

# Genesis Onboarding (2026-06-13): called from onboarding.html in the
# browser — same model as complete-onboarding. The customer has no Supabase
# JWT; authz is "knowledge of the cid UUID" + the handler's own
# X-CID == customer_id gate. The function has NO side effects (no DB writes,
# no provisioning) — it only distills pasted samples into a draft the
# customer confirms — so the exposure here is an LLM call, not state.
[functions.genesis-distill]
verify_jwt = false

# Dashboard chat relay (Phase 2, 2026-06-16): browser-facing relay for the
# "chat dengan agent kamu" web UI. The browser carries no Supabase Auth JWT;
# authz is the X-CID == customer_id gate + a durable per-cid rate/budget cap,
# enforced in the handler. Ships DARK — AGENT_CHAT_ENABLED defaults false, so
# every request 404s until the live throwaway-VPS spike validates the transport.
[functions.agent-chat-relay]
verify_jwt = false
