      font-family: 'JetBrains Mono', monospace; font-size: 7.5px;
    }
    .howmock-form .field .value {
      color: rgba(255,255,255,0.78); flex: 1;
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
    }
    @keyframes howFormFlash {
      0%, 1%   { border-color: #E5322D; background: rgba(229,50,45,0.10); box-shadow: 0 0 10px rgba(229,50,45,0.30); }
      4%, 100% { border-color: rgba(255,255,255,0.10); background: rgba(0,0,0,0.25); box-shadow: none; }
    }

    /* MOCK 3 — Setup progress + tasks checking */
    .howmock-setup { padding: 6px 4px; display: flex; flex-direction: column; gap: 7px; height: 100%; justify-content: center; }
    .howmock-setup .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .howmock-setup .bar .fill {
      height: 100%; width: 0;
      background: linear-gradient(to right, rgba(229,50,45,0.55), #E5322D);
      animation: howSetupFill 16s ease-in-out infinite;
      animation-delay: 8s;
    }
    @keyframes howSetupFill {
      0%, 1%   { width: 0%; }
      20%      { width: 100%; }
      25%, 100% { width: 100%; }
    }
    .howmock-setup .task {
      font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
      color: rgba(255,255,255,0.55);
      display: flex; align-items: center; gap: 6px;
    }
    .howmock-setup .task .check {
      color: #6FA08F; width: 9px; opacity: 0; font-weight: bold;
      animation: howCheckPop 16s ease-in-out infinite;
    }
    .howmock-setup .task:nth-of-type(1) .check { animation-delay: 8.6s; }
    .howmock-setup .task:nth-of-type(2) .check { animation-delay: 9.3s; }
    .howmock-setup .task:nth-of-type(3) .check { animation-delay: 10.0s; }
    @keyframes howCheckPop {
      0%, 1%   { opacity: 0; transform: scale(0.6); }
      3%, 25%  { opacity: 1; transform: scale(1); }
      26%, 100% { opacity: 1; transform: scale(1); }
    }

    /* MOCK 4 — Chat with reply + PDF + email toast (sequenced inside step 4 window: 75–97% of cycle) */
    .howmock-chat { padding: 6px; height: 100%; width: 100%; position: relative; }

    .howmock-chat .bubble {
      position: absolute;
      padding: 5px 9px; border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: 9px;
      line-height: 1.3; opacity: 0;
      white-space: nowrap;
    }
    /* User question — top right */
    .howmock-chat .bubble.user {
      top: 2px; right: 2px;
      background: #E5322D; color: #fff;
      max-width: 78%;
      animation: howChat-user 16s ease-out infinite;
    }
    @keyframes howChat-user {
      0%, 73%  { opacity: 0; transform: translateY(6px); }
      76%, 96% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; }
    }

    /* Typing dots — center-left, brief */
    .howmock-chat .bubble.dots {
      top: 30px; left: 2px;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; gap: 3px; align-items: center; padding: 7px 9px;
      animation: howChat-dots 16s ease-out infinite;
    }
    .howmock-chat .bubble.dots .dot {
      width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.7);
      animation: howTypingDot 1.4s ease-in-out infinite;
    }
    .howmock-chat .bubble.dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .howmock-chat .bubble.dots .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes howChat-dots {
      0%, 78%  { opacity: 0; }
      80%, 86% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    @keyframes howTypingDot {
      0%, 70%, 100% { opacity: 0.3; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-2px); }
    }

    /* Reply bubble — replaces dots */
    .howmock-chat .bubble.reply {
      top: 30px; left: 2px;
      background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 88%;
      animation: howChat-reply 16s ease-out infinite;
    }
    @keyframes howChat-reply {
      0%, 86%  { opacity: 0; transform: translateY(6px); }
      88%, 96% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; }
    }

    /* PDF attachment chip — below reply */
    .howmock-chat .pdf-chip {
      position: absolute; left: 2px; top: 64px;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 7px 4px 4px; border-radius: 7px;
      background: rgba(229,50,45,0.10);
      border: 1px solid rgba(229,50,45,0.45);
      opacity: 0;
      animation: howChat-pdf 16s ease-out infinite;
    }
    .howmock-chat .pdf-chip .ic {
      font-family: 'JetBrains Mono', monospace; font-size: 7.5px; font-weight: 600;
      color: #fff; background: #E5322D;
      padding: 2px 5px; border-radius: 3px;
      letter-spacing: 0.06em;
    }
    .howmock-chat .pdf-chip .nm {
      font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
      color: rgba(255,255,255,0.92); letter-spacing: 0.01em;
    }
    @keyframes howChat-pdf {
      0%, 89%  { opacity: 0; transform: translateY(6px) scale(0.94); }
      92%, 96% { opacity: 1; transform: translateY(0)   scale(1); }
      98%, 100% { opacity: 0; }
    }

    /* Email-sent toast — bottom right, slides in */
    .howmock-chat .email-toast {
      position: absolute; bottom: 2px; right: 2px;
      padding: 3px 7px; border-radius: 5px;
      font-family: 'JetBrains Mono', monospace; font-size: 8px;
      color: #6FA08F;
      background: rgba(111,160,143,0.10);
      border: 1px solid rgba(111,160,143,0.4);
      display: flex; align-items: center; gap: 5px;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: howChat-toast 16s ease-out infinite;
    }
    .howmock-chat .email-toast .env {
      font-size: 9px; color: #6FA08F;
      transform: translateY(0.5px);
    }
    @keyframes howChat-toast {
      0%, 91%  { opacity: 0; transform: translateX(14px); }
      93%, 96% { opacity: 1; transform: translateX(0); }
      98%, 100% { opacity: 0; transform: translateX(0); }
    }
  </style>
</head>
<body class="bg-black text-white">
  <div id="app"></div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useRef, useState } = React;
    const M = window.Motion || window.motion || {};
    const Mot = M.motion;

    const HERO_VIDEO = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260307_083826_e938b29f-a43a-41ec-a153-3d4730578ab8.mp4";
    const HLS_START = "https://stream.mux.com/9JXDljEVWYwWu01PUkAemafDugK89o01BR6zqJ3aS9u00A.m3u8";
    const HLS_STATS = "https://stream.mux.com/NcU3HlHeF7CUL86azTTzpy3Tlb00d6iF3BmCdFslMJYM.m3u8";
    const HLS_CTA   = "https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8";

    const EASE = [0.16, 1, 0.3, 1];

    // ─────────────────────── ICONS ───────────────────────
    const Icon = ({ d, size = 16, stroke = 1.75, fill = 'none', className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"
        className={className}>{d}</svg>
    );
    const ArrowUpRight = (p) => <Icon {...p} d={<><path d="M7 17 17 7" /><path d="M7 7h10v10" /></>} />;
    const Play = (p) => <Icon {...p} fill="currentColor" stroke="currentColor" d={<polygon points="6 3 20 12 6 21 6 3" />} />;

    // ─────────────────────── HLS VIDEO ───────────────────────
    function HlsVideo({ src, className = '', style = {}, filter = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        const v = ref.current; if (!v) return;
        if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
        } else if (window.Hls && window.Hls.isSupported()) {
          const hls = new window.Hls({ enableWorker: true });
          hls.loadSource(src); hls.attachMedia(v);
          return () => hls.destroy();
        } else {
          v.src = src;
        }
      }, [src]);
      return (
        <video ref={ref} autoPlay loop muted playsInline
          className={`absolute inset-0 w-full h-full object-cover ${className}`}
          style={{ filter, ...style }} />
      );
    }

    const FadeTop = ({ h = 200 }) => <div className="absolute top-0 left-0 right-0 pointer-events-none z-[2]" style={{ height: h, background: 'linear-gradient(to bottom, #000, transparent)' }} />;
    const FadeBottom = ({ h = 200 }) => <div className="absolute bottom-0 left-0 right-0 pointer-events-none z-[2]" style={{ height: h, background: 'linear-gradient(to top, #000, transparent)' }} />;

    // ─────────────────────── BLUR TEXT ───────────────────────
    function BlurText({ text, className = '', by = 'word', delay = 100, as: Tag = 'h1', style = {} }) {
      const parts = by === 'word' ? text.split(' ') : text.split('');
      const [inView, setInView] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current; if (!el) return;
        const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); io.unobserve(el); } }, { threshold: 0.15 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return (
        <Tag ref={ref} className={className} style={style}>
          {parts.map((p, i) => (
            <Mot.span
              key={`bt-${i}`}
              style={{
                display: 'inline-block',
                marginRight: by === 'word' && i < parts.length - 1 ? '0.28em' : 0
              }}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={inView ? { filter: 'blur(0px)', opacity: 1, y: 0 } : {}}
              transition={{ duration: 0.7, ease: EASE, delay: i * delay / 1000 }}>
              {p}
            </Mot.span>
          ))}
        </Tag>
      );
    }

    // ─────────────────────── NAVBAR ───────────────────────
    function Navbar() {
      const links = ['Beranda', 'Agent', 'Kerja', 'Proses', 'Harga'];
      return (
        <header className="fixed top-3 md:top-4 left-0 right-0 z-50 px-4 md:px-8 lg:px-16 py-3">
          <div className="flex items-center justify-between gap-3">
            <a href="#" className="flex items-center gap-2">
              <span className="rounded-full liquid-glass grid place-items-center px-4 py-2 md:px-5 md:py-2.5">
                <img src="assets/logo.svg" alt="weuseai.agent" className="block h-4 md:h-5 w-auto" />
              </span>
            </a>
            <nav className="hidden md:flex liquid-glass rounded-full px-1.5 py-1 items-center gap-0">
              {links.map((l) => (
                <a key={l} href={`#${l.toLowerCase()}`} className="px-3 py-2 text-sm font-medium text-foreground/90 font-body hover:text-white transition-colors">{l}</a>
              ))}
              <button className="bg-white text-black rounded-full px-3.5 py-1.5 text-sm font-medium flex items-center gap-1.5 ml-1">
                Get Started <ArrowUpRight size={14} stroke={2.2} />
              </button>
            </nav>
            <button className="md:hidden liquid-glass rounded-full px-3.5 py-1.5 text-xs font-medium text-white flex items-center gap-1.5 whitespace-nowrap">
              Mulai <ArrowUpRight size={12} stroke={2.2} />
            </button>
          </div>

      ];

      const [step, setStep] = useState(0);
      const [phase, setPhase] = useState('idle');
      const [typed, setTyped] = useState(0);

      useEffect(() => {
        let cleanup = () => {};
        if (step >= conversation.length) {
          const t = setTimeout(() => { setStep(0); setPhase('idle'); setTyped(0); }, 5000);
          return () => clearTimeout(t);
        }
        const ev = conversation[step];
        if (ev.type === 'system') {
          setPhase('idle');
          const t = setTimeout(() => setStep(s => s + 1), 1400);
          cleanup = () => clearTimeout(t);
        } else if (ev.type === 'agent') {
          setPhase('agent-typing');
          const t1 = setTimeout(() => {
            setPhase('idle');
            const t2 = setTimeout(() => setStep(s => s + 1), 2400);
            cleanup = () => clearTimeout(t2);
          }, 1100);
          cleanup = () => clearTimeout(t1);
        } else {
          // user event
          setPhase('user-typing');
          setTyped(0);
          const text = ev.text;
          const speed = Math.max(28, Math.min(55, 1400 / text.length));
          let i = 0;
          const ti = setInterval(() => {
            i++;
            setTyped(i);
            if (i >= text.length) {
              clearInterval(ti);
              const t1 = setTimeout(() => {
                setPhase('user-moving');
                const t2 = setTimeout(() => {
                  setPhase('user-click');
                  const t3 = setTimeout(() => {
                    setPhase('idle');
                    setTyped(0);
                    const t4 = setTimeout(() => setStep(s => s + 1), 200);
                    cleanup = () => clearTimeout(t4);
                  }, 240);
                  cleanup = () => clearTimeout(t3);
                }, 380);
                cleanup = () => clearTimeout(t2);
              }, 320);
              cleanup = () => clearTimeout(t1);
            }
          }, speed);
          cleanup = () => clearInterval(ti);
        }
        return () => cleanup();
      }, [step]);

      const ev = conversation[step];
      const visible = conversation.slice(0, step);
      if (ev) {
        if (ev.type === 'system') visible.push(ev);
        else if (ev.type === 'agent' && phase === 'idle') visible.push(ev);
      }
      const showAgentTyping = ev && ev.type === 'agent' && phase === 'agent-typing';
      const typedText = (ev && ev.type === 'user' && phase === 'user-typing') ? ev.text.slice(0, typed) : '';

      const renderBubble = (m, i) => {
        if (m.type === 'system') return <div key={i} className="db-bubble-row system">{m.text}</div>;
        if (m.type === 'user') return <div key={i} className="db-bubble-row user"><div className="db-msg-user">{m.text}</div></div>;
        return (
          <div key={i} className="db-bubble-row agent">
            <div className="db-avatar">●</div>
            <div className="db-bubble">{m.content}</div>
          </div>
        );
      };

      return (
        <section className="db-section">
          <div className="db-eyebrow">
            <div className="db-eyebrow-pill">
              <span className="live-dot" />
              <span>Agent in action</span>
            </div>
            <h2 className="db-headline">A single agent. Twelve capabilities. Zero context-switching.</h2>
            <p className="db-sub">Lihat agent kamu kerja — bukan demo dummy, ini contoh nyata dari 12 cara dia membantu kamu setiap hari.</p>
          </div>

          <div className="db-frame">
            {/* Top bar */}
            <div className="db-topbar">
              <div className="db-traffic"><span /><span /><span /></div>
              <div className="db-title">weuseai.agent · dashboard</div>
              <div className="db-status">Online</div>
            </div>

            {/* Body: sidebar + main */}
            <div className="db-body">
              <aside className="db-sidebar">
                <button className="db-nav active"><span className="sq" /> Chat</button>
                <button className="db-nav"><span className="sq" /> Tasks</button>
                <button className="db-nav"><span className="sq" /> Memory</button>
                <button className="db-nav"><span className="sq" /> Settings</button>
                <div className="db-user">
                  <div className="db-user-avatar">J</div>
                  <span>Jason</span>
                </div>
              </aside>

              <main className="db-main">
                <div className="db-thread">
                  <div className="db-thread-content">
                    {visible.map(renderBubble)}
                    {showAgentTyping && (
                      <div className="db-typing-row agent">
                        <div className="typing-bubble"><span className="dot" /><span className="dot" /><span className="dot" /></div>
                      </div>
                    )}
                  </div>
                </div>
              </main>
            </div>

            {/* Input area — typewriter shows next user prompt */}
            <div className="db-input">
              <div className="db-input-box">
                {typedText
                  ? <span className="db-input-typed">{typedText}<span className="db-input-caret" /></span>
                  : <span className="db-input-placeholder">Tanya apa aja...<span className="db-input-caret" /></span>}
              </div>
              <button className={`db-send ${phase === 'user-click' ? 'db-send-clicked' : ''}`}>
                <ArrowUpRight size={18} stroke={2.4} />
              </button>
            </div>

            {/* Animated mouse cursor — moves to send button when user message is ready */}
            <div className={`db-cursor cur-${phase}`}>
              <svg viewBox="0 0 18 22">
                <path d="M2 2 L2 17 L6.5 13 L9 18 L11.5 17 L8.8 12 L14 12 Z" fill="#fff" stroke="#000" strokeWidth="0.7" strokeLinejoin="round" />
              </svg>
            </div>
          </div>
        </section>
      );
    }

    // ─────────────────────── PRICING ───────────────────────
    function LimitedSeats() {
      const TOTAL = 1000;
      const KEY = 'wai-seats-remaining-v1';
      const FLOOR = 47;

      const [remaining, setRemaining] = useState(247);
      const [pulse, setPulse] = useState(false);

      // hydrate from localStorage on mount (avoids SSR/hydration mismatch)
      useEffect(() => {
        try {
          const stored = parseInt(window.localStorage.getItem(KEY) || '0', 10);
          if (stored > FLOOR && stored <= TOTAL) setRemaining(stored);
          else window.localStorage.setItem(KEY, '247');
        } catch (e) {}
      }, []);

      // simulate "live" decrements every ~7s with 30% probability
      useEffect(() => {
        const id = setInterval(() => {
          setRemaining((prev) => {
            if (prev <= FLOOR) return prev;
            if (Math.random() < 0.30) {
              const next = prev - 1;
              try { window.localStorage.setItem(KEY, String(next)); } catch (e) {}
              setPulse(true);
              setTimeout(() => setPulse(false), 1400);
              return next;
            }
            return prev;
          });
        }, 7000);
        return () => clearInterval(id);
      }, []);

      const pct = (remaining / TOTAL) * 100;

      return (
        <Mot.div
          initial={{ opacity: 0, y: 20 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, amount: 0.3 }}
          transition={{ duration: 0.8, ease: EASE }}
          className="liquid-glass seats-banner"
        >
          <div className="seats-stack">
            <p className="seats-caption">Hanya 1.000 seat untuk launch ini.</p>
            <div className={`seats-num-big ${pulse ? 'pulse' : ''}`}>
              {remaining.toLocaleString('id-ID')}
            </div>
            <p className="seats-sub">dari 1.000 seat tersisa</p>
            <div className="seats-bar">
              <div className="seats-fill" style={{ width: `${pct}%` }} />
            </div>
            <div className="seats-foot">
              Counter update real-time tiap ada yang sukses bayar
            </div>
          </div>
        </Mot.div>
      );
    }
