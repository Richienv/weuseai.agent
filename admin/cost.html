<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Cost Monitoring — weuseai.agent admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="/admin/assets/admin-shared.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { Sidebar, useFetch } = window.WeUseAdmin;

    function formatUsd(cents) { return '$' + (cents / 100).toFixed(2); }
    function formatPct(p) { return p === null || p === undefined ? '—' : p.toFixed(1) + '%'; }
    function sourceLabel(s) {
      if (s === 'openrouter_live') return 'live';
      if (s === 'snapshot') return 'snapshot';
      return 'unavailable';
    }

    function CostPage() {
      const { data, err, loading } = useFetch('/api/admin/observability/cost');

      return (
        <div className="app-shell">
          <Sidebar activeHref="/admin/cost" />
          <main className="app-main">
            <header className="page-head">
              <div>
                <h1>Cost Monitoring</h1>
                <p>{data ? <>Per-customer LLM spend. Alert threshold {data.alert_threshold_pct}%.</> : 'Per-customer LLM spend vs sub-key cap.'}</p>
              </div>
            </header>

            {loading ? <div className="alert info">Memuat...</div> : null}
            {err ? <div className="alert error">Gagal load data: {err}</div> : null}

            {data ? (
              <>
                <div className="stat-grid">
                  <div className="stat-card">
                    <div className="stat-label">Customer dipantau</div>
                    <div className="stat-value">{data.customer_count}</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">Alert aktif (≥{data.alert_threshold_pct}%)</div>
                    <div className="stat-value" style={{ color: data.alert_count > 0 ? 'var(--danger)' : undefined }}>{data.alert_count}</div>
                  </div>
                </div>

                {data.customers.length === 0 ? (
                  <div className="alert info">Belum ada customer dengan sub-key OpenRouter.</div>
                ) : (
                  <table className="data-table">
                    <thead>
                      <tr><th>Customer</th><th className="num">Cap</th><th className="num">Spend</th><th className="num">% of cap</th><th>Source</th><th>Alert</th></tr>
                    </thead>
                    <tbody>
                      {data.customers.map((c) => (
                        <tr key={c.customer_id} className={c.alert_70 ? 'row-alert' : ''}>
                          <td><a href={'/admin/customers/' + c.customer_id}>{c.email}</a></td>
                          <td className="num">{c.credit_limit_usd_cents > 0 ? formatUsd(c.credit_limit_usd_cents) : '—'}</td>
                          <td className="num">{c.cost_source === 'unavailable' ? '—' : formatUsd(c.cost_usd_cents)}</td>
                          <td className="num">{formatPct(c.pct_used)}</td>
                          <td><span className="tag">{sourceLabel(c.cost_source)}</span></td>
                          <td>
                            {c.alert_70
                              ? <span style={{ color: 'var(--danger)', fontWeight: 500 }}>≥ {data.alert_threshold_pct}%</span>
                              : <span style={{ color: 'var(--ink-3)' }}>—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}

                <p className="muted" style={{ marginTop: 18, fontSize: '0.8125rem' }}>
                  Generated {new Date(data.generated_at).toLocaleString('id-ID')}. Cap di-fetch live dari OpenRouter management API; saat fetch gagal row degrade ke snapshot atau unavailable (lihat kolom Source).
                </p>
              </>
            ) : null}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CostPage />);
  </script>
</body>
</html>
