<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Support tickets · admin · weuseai.agent</title>
    <style>
      :root {
        --canvas: #faf9f5;
        --ink: #141413;
        --ink-soft: #5d5c58;
        --ink-faint: #8a8983;
        --rule: #e3e1da;
        --rule-soft: #ecebe5;
        --accent: #0047ff;
        --ok: #1f8a4d;
        --warn: #c47a00;
        --stuck: #b3261e;
        --bg-card: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 15px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 96px; }
      .topnav { font-size: 12px; color: var(--ink-faint); margin-bottom: 32px; }
      .topnav a { color: var(--accent); text-decoration: none; }
      h1 {
        font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px;
      }
      .lede { color: var(--ink-soft); margin: 0 0 32px; }
      .controls {
        background: var(--bg-card); border: 1px solid var(--rule);
        border-radius: 10px; padding: 20px; margin-bottom: 24px;
      }
      .controls .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      label {
        display: block; font-size: 11px; font-weight: 600;
        letter-spacing: 0.04em; color: var(--ink-soft);
        text-transform: uppercase; margin-bottom: 4px;
      }
      input, select, textarea {
        width: 100%; font: inherit; padding: 8px 10px;
        border: 1px solid var(--rule); border-radius: 6px;
        background: var(--canvas); color: var(--ink);
      }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 71, 255, 0.12);
      }
      .actions { display: flex; gap: 12px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
      button {
        font: inherit; font-weight: 500; padding: 8px 16px; border-radius: 6px;
        border: 1px solid var(--ink); background: var(--ink); color: var(--canvas); cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--ink); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .hint { font-size: 12px; color: var(--ink-faint); }
      .err { color: var(--stuck); font-size: 13px; margin-top: 8px; }
      .ok-msg { color: var(--ok); font-size: 13px; margin-top: 8px; }
      table {
        width: 100%; border-collapse: collapse;
        background: var(--bg-card); border: 1px solid var(--rule); border-radius: 10px;
        overflow: hidden;
      }
      thead th {
        text-align: left; padding: 12px 14px; font-size: 11px;
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--ink-faint); background: var(--rule-soft);
        border-bottom: 1px solid var(--rule);
      }
      tbody td {
        padding: 12px 14px; border-bottom: 1px solid var(--rule-soft);
        vertical-align: top;
      }
      tbody tr:hover { background: var(--rule-soft); }
      .badge {
        display: inline-block; padding: 2px 8px; border-radius: 4px;
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-open { background: rgba(0, 71, 255, 0.12); color: var(--accent); }
      .badge-in_progress { background: rgba(196, 122, 0, 0.12); color: var(--warn); }
      .badge-awaiting_customer { background: rgba(138, 137, 131, 0.18); color: var(--ink-soft); }
      .badge-resolved { background: rgba(31, 138, 77, 0.12); color: var(--ok); }
      .badge-closed_no_action { background: rgba(138, 137, 131, 0.12); color: var(--ink-faint); }
      .badge-low { background: rgba(138, 137, 131, 0.12); color: var(--ink-soft); }
      .badge-medium { background: rgba(0, 71, 255, 0.10); color: var(--accent); }
      .badge-high { background: rgba(196, 122, 0, 0.15); color: var(--warn); }
      .badge-urgent { background: rgba(179, 38, 30, 0.15); color: var(--stuck); }
      .ts { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-faint); }
      .id-short { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--ink-faint); }
      .modal {
        position: fixed; inset: 0; background: rgba(20, 20, 19, 0.5);
        display: none; align-items: flex-start; justify-content: center;
        padding: 64px 24px;
      }
      .modal.open { display: flex; }
      .modal-card {
        background: var(--bg-card); border-radius: 10px; padding: 24px;
        width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto;
      }
      .modal-title { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
      .modal-row { margin-bottom: 16px; }
      textarea { min-height: 100px; font-family: inherit; resize: vertical; }
      .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
      h2.create-header {
        font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--ink-faint); margin: 32px 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="topnav"><a href="/admin">← Admin</a></p>
      <h1>Support tickets</h1>
      <p class="lede">Customer-reported issues. Reads <code>support_tickets</code> table via <code>/api/admin/support-tickets</code>.</p>

      <form id="filter-form" class="controls" onsubmit="onFilter(event)">
        <div class="row">
          <div>
            <label for="f-secret">Admin secret</label>
            <input id="f-secret" type="password" placeholder="OBSERVABILITY_ADMIN_SECRET" autocomplete="off" />
          </div>
          <div>
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="">all</option>
              <option value="open">open</option>
              <option value="in_progress">in_progress</option>
              <option value="awaiting_customer">awaiting_customer</option>
              <option value="resolved">resolved</option>
              <option value="closed_no_action">closed_no_action</option>
            </select>
          </div>
          <div>
            <label for="f-severity">Severity</label>
            <select id="f-severity">
              <option value="">all</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </div>
          <div>
            <label for="f-customer">Customer id</label>
            <input id="f-customer" type="text" placeholder="(optional)" autocomplete="off" />
          </div>
        </div>
        <div class="actions">
          <button id="f-go" type="submit">List tickets</button>
          <button type="button" class="secondary" onclick="openCreateModal()">Create ticket</button>
          <span class="hint">Secret persists per-tab in sessionStorage.</span>
          <span id="f-msg" class="ok-msg" style="margin-left:auto;"></span>
        </div>
        <p id="f-err" class="err" hidden></p>
      </form>

      <div id="list-out"></div>
    </div>

    <div id="create-modal" class="modal">
      <div class="modal-card">
        <h2 class="modal-title">Create support ticket</h2>
        <form id="create-form" onsubmit="onCreate(event)">
          <div class="modal-row">
            <label for="c-customer">Customer id (uuid)</label>
            <input id="c-customer" type="text" required />
          </div>
          <div class="modal-row">
            <label for="c-kind">Kind</label>
            <select id="c-kind" required>
              <option value="provisioning_stuck">provisioning_stuck</option>
              <option value="pairing_failed">pairing_failed</option>
              <option value="bundle_pull_failed">bundle_pull_failed</option>
              <option value="hermes_crash">hermes_crash</option>
              <option value="first_message_silence">first_message_silence</option>
              <option value="tier_change_request">tier_change_request</option>
              <option value="billing_dispute">billing_dispute</option>
              <option value="feature_request">feature_request</option>
              <option value="other">other</option>
            </select>
          </div>
          <div class="modal-row">
            <label for="c-severity">Severity</label>
            <select id="c-severity">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </div>
          <div class="modal-row">
            <label for="c-title">Title (max 120 chars)</label>
            <input id="c-title" type="text" required maxlength="120" />
          </div>
          <div class="modal-row">
            <label for="c-body">Body (markdown)</label>
            <textarea id="c-body"></textarea>
          </div>
          <p id="c-err" class="err" hidden></p>
          <div class="modal-actions">
            <button type="button" class="secondary" onclick="closeCreateModal()">Cancel</button>
            <button type="submit">Create</button>
          </div>
        </form>
      </div>
    </div>

    <div id="edit-modal" class="modal">
      <div class="modal-card">
        <h2 class="modal-title">Edit ticket <span id="e-id" class="id-short"></span></h2>
        <form id="edit-form" onsubmit="onUpdate(event)">
          <input id="e-uuid" type="hidden" />
          <div class="modal-row">
            <label for="e-status">Status</label>
            <select id="e-status">
              <option value="open">open</option>
              <option value="in_progress">in_progress</option>
              <option value="awaiting_customer">awaiting_customer</option>
              <option value="resolved">resolved</option>
              <option value="closed_no_action">closed_no_action</option>
            </select>
          </div>
          <div class="modal-row">
            <label for="e-severity">Severity</label>
            <select id="e-severity">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </div>
          <div class="modal-row">
            <label for="e-resolution">Resolution notes (markdown — set when status flips to resolved/closed)</label>
            <textarea id="e-resolution"></textarea>
          </div>
          <p id="e-err" class="err" hidden></p>
          <div class="modal-actions">
            <button type="button" class="secondary" onclick="closeEditModal()">Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const fSecret = document.getElementById('f-secret')
      const fStatus = document.getElementById('f-status')
      const fSeverity = document.getElementById('f-severity')
      const fCustomer = document.getElementById('f-customer')
      const fGo = document.getElementById('f-go')
      const fErr = document.getElementById('f-err')
      const fMsg = document.getElementById('f-msg')
      const listOut = document.getElementById('list-out')

      // sessionStorage persistence
      try {
        const s = sessionStorage.getItem('admin_secret')
        if (s) fSecret.value = s
      } catch (e) {}

      function authHeader() {
        return { Authorization: `Bearer ${fSecret.value}` }
      }

      async function onFilter(ev) {
        ev.preventDefault()
        fErr.hidden = true; fMsg.textContent = ''
        if (!fSecret.value) return showErr(fErr, 'Admin secret required.')
        try { sessionStorage.setItem('admin_secret', fSecret.value) } catch (e) {}

        const params = new URLSearchParams()
        if (fStatus.value) params.set('status', fStatus.value)
        if (fSeverity.value) params.set('severity', fSeverity.value)
        if (fCustomer.value.trim()) params.set('customer_id', fCustomer.value.trim())

        fGo.disabled = true; fGo.textContent = 'Loading…'
        try {
          const r = await fetch(`/api/admin/support-tickets?${params.toString()}`, {
            headers: { ...authHeader() },
          })
          if (r.status === 401) return showErr(fErr, '401 unauthorized — wrong admin secret.')
          if (!r.ok) {
            const t = await r.text().catch(() => '')
            return showErr(fErr, `HTTP ${r.status}: ${t.slice(0, 240)}`)
          }
          const j = await r.json()
          renderList(j.tickets || [])
        } catch (e) {
          showErr(fErr, `fetch failed: ${e.message || e}`)
        } finally {
          fGo.disabled = false; fGo.textContent = 'List tickets'
        }
      }

      function renderList(tickets) {
        if (tickets.length === 0) {
          listOut.innerHTML = '<p class="hint" style="text-align:center;padding:48px;">No tickets matching filter.</p>'
          return
        }
        const rows = tickets.map(t => `
          <tr onclick="openEditModal(${escapeAttr(JSON.stringify(t))})" style="cursor:pointer">
            <td><span class="id-short">${esc(t.id.slice(0, 8))}</span></td>
            <td><span class="ts">${esc(t.created_at.slice(0, 16).replace('T', ' '))}</span></td>
            <td><span class="id-short">${esc(t.customer_id.slice(0, 8))}</span></td>
            <td>${esc(t.kind)}</td>
            <td><span class="badge badge-${esc(t.severity)}">${esc(t.severity)}</span></td>
            <td><span class="badge badge-${esc(t.status)}">${esc(t.status.replace(/_/g, ' '))}</span></td>
            <td>${esc(t.title)}</td>
          </tr>
        `).join('')
        listOut.innerHTML = `
          <table>
            <thead><tr>
              <th>id</th><th>created</th><th>customer</th><th>kind</th>
              <th>sev</th><th>status</th><th>title</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `
      }

      // ─── Create ──

      function openCreateModal() {
        document.getElementById('create-modal').classList.add('open')
        document.getElementById('c-customer').value = ''
        document.getElementById('c-title').value = ''
        document.getElementById('c-body').value = ''
        document.getElementById('c-err').hidden = true
      }
      function closeCreateModal() {
        document.getElementById('create-modal').classList.remove('open')
      }
      async function onCreate(ev) {
        ev.preventDefault()
        const cErr = document.getElementById('c-err')
        cErr.hidden = true
        if (!fSecret.value) return showErr(cErr, 'Set admin secret in filter form first.')
        const body = {
          customer_id: document.getElementById('c-customer').value.trim(),
          kind: document.getElementById('c-kind').value,
          severity: document.getElementById('c-severity').value,
          title: document.getElementById('c-title').value.trim(),
          body_md: document.getElementById('c-body').value || null,
        }
        try {
          const r = await fetch('/api/admin/support-tickets', {
            method: 'POST',
            headers: { ...authHeader(), 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          if (!r.ok) {
            const t = await r.json().catch(() => ({}))
            return showErr(cErr, `HTTP ${r.status}: ${t.error || 'unknown'}`)
          }
          closeCreateModal()
          fMsg.textContent = 'Ticket created.'
          onFilter({ preventDefault: () => {} })
        } catch (e) {
          showErr(cErr, `fetch failed: ${e.message || e}`)
        }
      }

      // ─── Edit ──

      function openEditModal(t) {
        document.getElementById('e-id').textContent = t.id
        document.getElementById('e-uuid').value = t.id
        document.getElementById('e-status').value = t.status
        document.getElementById('e-severity').value = t.severity
        document.getElementById('e-resolution').value = t.resolution_md || ''
        document.getElementById('e-err').hidden = true
        document.getElementById('edit-modal').classList.add('open')
      }
      function closeEditModal() {
        document.getElementById('edit-modal').classList.remove('open')
      }
      async function onUpdate(ev) {
        ev.preventDefault()
        const eErr = document.getElementById('e-err')
        eErr.hidden = true
        const id = document.getElementById('e-uuid').value
        const body = {
          status: document.getElementById('e-status').value,
          severity: document.getElementById('e-severity').value,
        }
        const resolutionVal = document.getElementById('e-resolution').value
        if (resolutionVal) body.resolution_md = resolutionVal
        try {
          const r = await fetch(`/api/admin/support-tickets?id=${encodeURIComponent(id)}`, {
            method: 'POST',
            headers: { ...authHeader(), 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          if (!r.ok) {
            const t = await r.json().catch(() => ({}))
            return showErr(eErr, `HTTP ${r.status}: ${t.error || 'unknown'}`)
          }
          closeEditModal()
          fMsg.textContent = 'Ticket updated.'
          onFilter({ preventDefault: () => {} })
        } catch (e) {
          showErr(eErr, `fetch failed: ${e.message || e}`)
        }
      }

      // ─── helpers ──

      function showErr(el, msg) { el.hidden = false; el.textContent = msg }
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
      }
      function escAttr(s) { return esc(s).replace(/"/g, '&quot;') }
      function escapeAttr(s) { return esc(s).replace(/"/g, '&quot;') }
    </script>
  </body>
</html>
