<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Fleet Summary — weuseai.agent admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="/admin/assets/admin-shared.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState } = React;
    const { Sidebar, useFetch, formatDate, formatIdr } = window.WeUseAdmin;

    function Stat({ label, value, sub }) {
      return (
        <div className="stat-card">
          <div className="stat-label">{label}</div>
          <div className="stat-value">{value}</div>
          {sub ? <div className="stat-sub">{sub}</div> : null}
        </div>
      );
    }

    function FleetPage() {
      const initialDays = new URLSearchParams(window.location.search).get('days') || '30';
      const [days, setDays] = useState(initialDays);
      const { data, err, loading } = useFetch('/api/admin/observability/fleet-summary?days=' + encodeURIComponent(days));

      const onApply = () => {
        const u = new URL(window.location.href);
        u.searchParams.set('days', days);
        window.location.href = u.toString();
      };

      return (
        <div className="app-shell">
          <Sidebar activeHref="/admin/fleet" />
          <main className="app-main">
            <header className="page-head">
              <div>
                <h1>Fleet Summary</h1>
                <p>{data ? <>Window {data.window_days} hari. Generated {formatDate(data.generated_at)}.</> : 'Ringkasan fleet harian — customer, VPS, revenue.'}</p>
              </div>
              <div className="toolbar">
                <label>
                  Window
                  <select value={days} onChange={(e) => setDays(e.target.value)}>
                    <option value="7">7 hari</option>
                    <option value="30">30 hari</option>
                    <option value="90">90 hari</option>
                    <option value="365">365 hari</option>
                  </select>
                </label>
                <button type="button" className="action-btn" onClick={onApply}>Apply</button>
              </div>
            </header>

            {loading ? <div className="alert info">Memuat...</div> : null}
            {err ? <div className="alert error">Gagal load data: {err}</div> : null}

            {data ? (() => {
              const maxByDay = Math.max(1, ...data.revenue.by_day.map((d) => d.idr_total));
              return (
                <>
                  <section className="section">
                    <div className="stat-grid">
                      <Stat label="Customer aktif" value={data.customers.active} sub={'Total ' + data.customers.total} />
                      <Stat label="Signup baru"   value={data.customers.signups_in_window} sub={'Window ' + data.window_days + ' hari'} />
                      <Stat label="VPS running"   value={data.vps.running} sub={'Total ' + data.vps.total} />
                      <Stat label="VPS provisioning" value={data.vps.provisioning} sub={'Failed ' + data.vps.failed + ' · Stopped ' + data.vps.stopped} />
                    </div>
                  </section>

                  <section className="section">
                    <div className="stat-grid">
                      <Stat label="Revenue window" value={formatIdr(data.revenue.paid_idr_total)} sub={data.revenue.paid_invoices_count + ' invoice paid'} />
                      <Stat label="Setup"   value={formatIdr(data.revenue.paid_idr_setup)} sub="One-time" />
                      <Stat label="Hosting" value={formatIdr(data.revenue.paid_idr_hosting)} sub="Recurring" />
                      <Stat label="Template no-match" value={data.template_no_match.events_in_window_count}
                        sub={<a href="/admin/templates" style={{ color: 'var(--accent)' }}>Lihat detail →</a>} />
                    </div>
                  </section>

                  <section className="section">
                    <div className="section-head">
                      <h2>Revenue per hari</h2>
                      <div className="meta">{data.revenue.by_day.length} hari aktif</div>
                    </div>
                    {data.revenue.by_day.length === 0 ? (
                      <div className="alert info">Belum ada paid invoice di window ini.</div>
                    ) : (
                      <div className="card" style={{ padding: 16 }}>
                        {data.revenue.by_day.map((d) => (
                          <div className="bar-row" key={d.day}>
                            <span>{d.day}</span>
                            <div className="bar-track">
                              <div className="bar-fill" style={{ width: ((d.idr_total / maxByDay) * 100) + '%' }} />
                            </div>
                            <span className="num">{formatIdr(d.idr_total)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </section>

                  <section className="section">
                    <div className="section-head">
                      <h2>Parked flow runs</h2>
                      <div className="meta">
                        {data.flow_state_parked.total_parked} total · awaiting {data.flow_state_parked.awaiting_customer} · escalated {data.flow_state_parked.escalated}
                      </div>
                    </div>
                    {data.flow_state_parked.expiring_within_3_days.length === 0 ? (
                      <div className="alert info">Tidak ada flow run yang expire dalam 3 hari ke depan.</div>
                    ) : (
                      <table className="data-table">
                        <thead><tr><th>Flow ID</th><th>Customer</th><th>Playbook</th><th>Expires</th></tr></thead>
                        <tbody>
                          {data.flow_state_parked.expiring_within_3_days.map((row) => (
                            <tr key={row.id} className="row-warn">
                              <td><code style={{ fontSize: '0.75rem' }}>{row.id.slice(0, 8)}</code></td>
                              <td><a href={'/admin/customers/' + row.customer_id}><code style={{ fontSize: '0.75rem' }}>{row.customer_id.slice(0, 8)}</code></a></td>
                              <td>{row.playbook_id}</td>
                              <td>{formatDate(row.expires_at)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </section>
                </>
              );
            })() : null}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FleetPage />);
  </script>
</body>
</html>
