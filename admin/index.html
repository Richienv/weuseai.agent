<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Admin — weuseai.agent</title>
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--ink-2); font-size: 0.875rem;">
    Memuat admin...
  </div>
  <script>
    // Probe auth and bounce. /api/admin/me returns 200 if cookie is valid,
    // 401 otherwise. Redirect target on success = the first tab.
    fetch('/api/admin/session', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 200) {
          window.location.replace('/admin/manual-provision');
        } else {
          window.location.replace('/admin/login');
        }
      })
      .catch(function () {
        window.location.replace('/admin/login');
      });
  </script>
</body>
</html>
