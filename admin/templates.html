<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Template no-match — weuseai.agent admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="/admin/assets/admin-shared.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState } = React;
    const { Sidebar, useFetch, formatDate } = window.WeUseAdmin;

    function TemplatesPage() {
      const initialDays = new URLSearchParams(window.location.search).get('days') || '30';
      const [days, setDays] = useState(initialDays);
      const { data, err, loading } = useFetch('/api/admin/observability/template-no-match?days=' + encodeURIComponent(days));

      const onApply = () => {
        const u = new URL(window.location.href);
        u.searchParams.set('days', days);
        window.location.href = u.toString();
      };

      return (
        <div className="app-shell">
          <Sidebar activeHref="/admin/templates" />
          <main className="app-main">
            <header className="page-head">
              <div>
                <h1>Template no-match</h1>
                <p>{data
                  ? <>{data.total_events} event dalam {data.window_days} hari · paling banyak count = template berikutnya yang worth di-author.</>
                  : 'Skill yang minta template tapi library belum punya.'}
                </p>
              </div>
              <div className="toolbar">
                <label>
                  Window
                  <select value={days} onChange={(e) => setDays(e.target.value)}>
                    <option value="7">7 hari</option>
                    <option value="30">30 hari</option>
                    <option value="90">90 hari</option>
                    <option value="365">365 hari</option>
                  </select>
                </label>
                <button type="button" className="action-btn" onClick={onApply}>Apply</button>
              </div>
            </header>

            {loading ? <div className="alert info">Memuat...</div> : null}
            {err ? <div className="alert error">Gagal load data: {err}</div> : null}

            {data ? (
              <>
                <section className="section">
                  <div className="section-head">
                    <h2>Grup persona × skill</h2>
                    <div className="meta">Sorted by count DESC</div>
                  </div>
                  {data.by_persona_skill.length === 0 ? (
                    <div className="alert info">Tidak ada miss di window ini.</div>
                  ) : (
                    <table className="data-table">
                      <thead><tr><th>Persona</th><th>Skill</th><th>Sample request</th><th className="num">Count</th></tr></thead>
                      <tbody>
                        {data.by_persona_skill.map((g, i) => (
                          <tr key={g.persona_slug + '::' + g.skill_id + '::' + i}>
                            <td><span className="tag">{g.persona_slug}</span></td>
                            <td><code style={{ fontSize: '0.75rem' }}>{g.skill_id}</code></td>
                            <td style={{ color: 'var(--ink-2)', fontSize: '0.8125rem' }}>
                              {g.sample_deliverables.slice(0, 2).map((s) => '"' + s.slice(0, 80) + '"').join(' · ')}
                            </td>
                            <td className="num"><strong>{g.count}</strong></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </section>

                <section className="section">
                  <div className="section-head">
                    <h2>Recent events</h2>
                    <div className="meta">Newest first · max 100</div>
                  </div>
                  {data.recent.length === 0 ? (
                    <div className="alert info">Belum ada event.</div>
                  ) : (
                    <table className="data-table">
                      <thead><tr><th>Persona</th><th>Skill</th><th>Requested deliverable</th><th>When</th></tr></thead>
                      <tbody>
                        {data.recent.map((e) => (
                          <tr key={e.id}>
                            <td><span className="tag">{e.persona_slug}</span></td>
                            <td><code style={{ fontSize: '0.75rem' }}>{e.skill_id}</code></td>
                            <td style={{ color: 'var(--ink-2)' }}>{e.requested_deliverable.slice(0, 140)}</td>
                            <td style={{ color: 'var(--ink-3)' }}>{formatDate(e.created_at)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </section>
              </>
            ) : null}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TemplatesPage />);
  </script>
</body>
</html>
