<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Customer List — weuseai.agent admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="/admin/assets/admin-shared.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState } = React;
    const { Sidebar, useFetch, statusDot, statusLabel, formatDate } = window.WeUseAdmin;

    const STATUS_OPTIONS = [
      { value: 'all',      label: 'Semua'    },
      { value: 'active',   label: 'Aktif'    },
      { value: 'pending',  label: 'Pending'  },
      { value: 'paused',   label: 'Paused'   },
      { value: 'canceled', label: 'Canceled' },
      { value: 'failed',   label: 'Error'    },
      { value: 'refunded', label: 'Refunded' },
    ];

    function latestSub(rows) {
      if (!rows || rows.length === 0) return null;
      const active = rows.find((r) => r.status === 'active');
      if (active) return active;
      return rows.slice().sort((a, b) => {
        const ta = a.started_at ? new Date(a.started_at).getTime() : 0;
        const tb = b.started_at ? new Date(b.started_at).getTime() : 0;
        return tb - ta;
      })[0];
    }

    function latestVps(rows) {
      if (!rows || rows.length === 0) return null;
      return rows.slice().sort((a, b) => {
        const ta = a.created_at ? new Date(a.created_at).getTime() : 0;
        const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
        return tb - ta;
      })[0];
    }

    function CustomersPage() {
      const initialStatus = new URLSearchParams(window.location.search).get('status') || 'all';
      const [statusFilter, setStatusFilter] = useState(initialStatus);
      const { data, err, loading } = useFetch('/api/admin/customer-list');

      const rows = (data && data.customers) || [];
      const filtered = statusFilter === 'all'
        ? rows
        : rows.filter((r) => {
            const s = latestSub(r.subscriptions);
            return s && s.status === statusFilter;
          });

      return (
        <div className="app-shell">
          <Sidebar activeHref="/admin/customers" />
          <main className="app-main">
            <header className="page-head">
              <div>
                <h1>Customer List</h1>
                <p>{filtered.length} customer{statusFilter !== 'all' ? ' (filter: ' + statusFilter + ')' : ''} · total {rows.length}.</p>
              </div>
            </header>

            <div className="toolbar">
              <label>
                Status
                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                  {STATUS_OPTIONS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </label>
            </div>

            {loading ? <div className="alert info">Memuat...</div> : null}
            {err ? <div className="alert error">Gagal load customer: {err}</div> : null}

            {!loading && !err && filtered.length === 0 ? (
              <div className="alert info">Tidak ada customer untuk filter ini.</div>
            ) : null}

            {filtered.length > 0 ? (
              <table className="data-table">
                <thead>
                  <tr>
                    <th>Email</th><th>Nama</th><th>Tier</th><th>Status</th>
                    <th>VPS</th><th>Bot</th><th>Created</th><th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((c) => {
                    const sub = latestSub(c.subscriptions);
                    const vps = latestVps(c.vps_instances);
                    const tier = sub ? sub.tier : null;
                    const subStatus = sub ? sub.status : null;
                    const vpsStatus = vps ? vps.status : null;
                    const hasBot = Boolean(c.telegram_chat_id);
                    return (
                      <tr key={c.id}>
                        <td><a href={'/admin/customers/' + c.id}>{c.email}</a></td>
                        <td>{c.display_name || <span className="muted">—</span>}</td>
                        <td>{tier ? <span className={'tag tier-' + tier}>{tier}</span> : <span className="muted">—</span>}</td>
                        <td>{statusDot(subStatus)}{statusLabel(subStatus)}</td>
                        <td>{vpsStatus ? <>{statusDot(vpsStatus)}{vpsStatus}</> : <span className="muted">tidak ada</span>}</td>
                        <td>{hasBot ? statusDot('active') : statusDot('pending')}{hasBot ? 'paired' : 'belum'}</td>
                        <td style={{ color: 'var(--ink-3)' }}>{formatDate(c.created_at)}</td>
                        <td><a href={'/admin/customers/' + c.id} className="action-btn">Detail</a></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            ) : null}

            <p className="muted" style={{ marginTop: 18, fontSize: '0.8125rem' }}>
              Klik email atau Detail untuk membuka halaman customer dengan opsi resend onboarding email + stub actions lainnya.
            </p>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CustomersPage />);
  </script>
</body>
</html>
