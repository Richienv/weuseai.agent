<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{nama_acara}}</title>
<style>
  :root { --tinta: #2c2420; --latar: #fdfaf5; --aksen: #92400e; --garis: #ece4d8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Georgia, "Times New Roman", serif; background: var(--latar); color: var(--tinta); line-height: 1.7; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 20px 64px; text-align: center; }
  .bingkai { border: 1px solid var(--garis); border-radius: 16px; padding: 48px 28px; margin-top: 32px; background: #fff; }
  .label { color: var(--aksen); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.22em; margin-bottom: 20px; font-family: -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 1.9rem; font-weight: 500; letter-spacing: 0.01em; margin-bottom: 24px; }
  .garis { width: 48px; height: 1px; background: var(--aksen); margin: 24px auto; }
  .detail { font-size: 1.02rem; }
  .detail p { margin-bottom: 6px; }
  .pesan { margin-top: 28px; font-style: italic; color: #6b5d52; white-space: pre-line; font-size: 0.98rem; }
</style>
</head>
<body>
<main>
  <div class="bingkai">
    <p class="label">Undangan</p>
    <h1>{{nama_acara}}</h1>
    <div class="garis"></div>
    <div class="detail">
      <p>{{waktu}}</p>
      <p>{{lokasi}}</p>
    </div>
    <p class="pesan">{{pesan}}</p>
  </div>
</main>
</body>
</html>
