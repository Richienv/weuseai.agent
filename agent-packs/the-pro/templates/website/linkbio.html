<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{nama}}</title>
<style>
  :root { --tinta: #f5f5f4; --latar: #111110; --kartu: #1e1d1b; --garis: #2c2a27; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--latar); color: var(--tinta); line-height: 1.6; min-height: 100vh; }
  main { max-width: 480px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  .inisial { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: var(--kartu); border: 1px solid var(--garis); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; }
  h1 { font-size: 1.4rem; letter-spacing: -0.01em; }
  .bio { color: #a8a29e; margin: 10px 0 32px; white-space: pre-line; font-size: 0.95rem; }
  .tautan { display: block; background: var(--kartu); border: 1px solid var(--garis); color: var(--tinta); text-decoration: none; padding: 15px 20px; border-radius: 12px; margin-bottom: 12px; font-weight: 600; }
  .tautan:active { background: var(--garis); }
</style>
</head>
<body>
<main>
  <div class="inisial">&#9670;</div>
  <h1>{{nama}}</h1>
  <p class="bio">{{bio}}</p>
  {{tautan|links}}
</main>
</body>
</html>
