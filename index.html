  <style>
    :root {
      --background: 0 0% 0%;
      --foreground: 0 0% 100%;
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
      --glass-blur: 16px;
    }
    html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    ::selection { background: rgba(255,255,255,.9); color: #000; }

    /* ───── Liquid glass ───── */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative; overflow: hidden;
    }
    .liquid-glass::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,.45) 0%, rgba(255,255,255,.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,.15) 80%, rgba(255,255,255,.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative; overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,.5) 0%, rgba(255,255,255,.2) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,.2) 80%, rgba(255,255,255,.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }

    button, a { font-family: inherit; }
    button { cursor: pointer; }
    html { scroll-behavior: smooth; }

    /* count-up red-glow (mirrors .seats-num-big.pulse) */
    .countup {
      transition: color 0.55s ease, text-shadow 0.55s ease;
    }
    .countup.glow {
      color: #E5322D;
      text-shadow: 0 0 32px rgba(229, 50, 45, 0.75);
    }

    /* nav pills — soft blur backdrop, no border line */
    .nav-clean {
      background: rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
    }

    /* ─── Pricing card: hosting + always-on ─── */
    .pc-setup-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.45); margin-top: 4px;
    }
    @media (min-width: 768px) { .pc-setup-sub { font-size: 10.5px; } }

    .pc-hosting {
      margin-top: 18px; padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }
    .pc-hosting .pch-line {
      display: flex; align-items: baseline; gap: 6px;
      font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,0.92);
    }
    .pc-hosting .pch-line .plus { color: rgba(255,255,255,0.55); font-weight: 400; }
    .pc-hosting .pch-sub {
      margin-top: 4px; font-size: 11.5px; line-height: 1.45;
      color: rgba(255,255,255,0.55); font-weight: 300;
    }

    .pc-toggle {
      margin-top: 10px;
      display: grid; grid-template-columns: 18px 1fr; gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .pc-toggle:hover { border-color: rgba(255,255,255,0.20); }
    .pc-toggle.is-on {
      border-color: rgba(229,50,45,0.55);
      box-shadow: 0 0 22px rgba(229,50,45,0.18), inset 0 0 0 1px rgba(229,50,45,0.18);
      background: rgba(229,50,45,0.04);
    }
    .pc-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .pc-checkbox {
      width: 18px; height: 18px; border-radius: 5px;
      border: 1.5px solid rgba(255,255,255,0.30);
      display: grid; place-items: center;
      margin-top: 2px;
      transition: border-color 0.18s ease, background 0.18s ease;
    }
    .pc-toggle.is-on .pc-checkbox {
      background: #E5322D; border-color: #E5322D;
    }
    .pc-toggle.is-on .pc-checkbox::after {
      content: ''; width: 10px; height: 5px; margin-top: -2px;
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }
    .pc-toggle .pct-title {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px;
      font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,0.92);
    }
    .pc-toggle .pct-add {
      font-size: 12px; color: #E5322D; font-weight: 500;
    }
    .pc-toggle .pct-sub {
      margin-top: 4px; font-size: 11.5px; line-height: 1.45;
      color: rgba(255,255,255,0.55); font-weight: 300;
    }
    .pc-monthly-preview {
      margin-top: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px; letter-spacing: 0.10em; text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      line-height: 1.5;
    }
    .pc-monthly-preview b { color: rgba(255,255,255,0.92); font-weight: 600; letter-spacing: 0; text-transform: none; font-family: 'Inter', sans-serif; font-size: 12.5px; }

    /* ─── FAQ ─── */
    .faq-item {
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .faq-item:first-child { border-top: 1px solid rgba(255,255,255,0.10); }
    .faq-trigger {
      width: 100%; padding: 22px 4px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: transparent; border: none; cursor: pointer;
      text-align: left; color: #fff;
      font-family: 'Instrument Serif', serif;
      font-size: 20px; line-height: 1.25; letter-spacing: -0.015em;
      transition: color 0.18s ease;
    }
    @media (min-width: 768px) { .faq-trigger { font-size: 26px; padding: 26px 4px; } }
    .faq-trigger:hover { color: rgba(255,255,255,0.85); }
    .faq-icon {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.20);
      display: grid; place-items: center; flex-shrink: 0;
      transition: transform 0.3s ease, border-color 0.18s ease;
      color: rgba(255,255,255,0.70);
    }
    .faq-item.is-open .faq-icon { transform: rotate(45deg); border-color: rgba(229,50,45,0.55); color: #E5322D; }
    .faq-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .faq-item.is-open .faq-body { max-height: 720px; }
    .faq-body-inner {
      padding: 0 4px 24px;
      font-family: 'Inter', sans-serif; font-weight: 300;
      font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.70);
      max-width: 64ch;
    }
    @media (min-width: 768px) { .faq-body-inner { font-size: 15px; } }

    /* ─── DASHBOARD DEMO (12-scene cycle, 72s total) ─── */
    .db-section {
      position: relative;
      padding: 80px 16px 100px;
      background: #050505;
      overflow: hidden;
    }
    .db-section::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(229, 50, 45, 0.08), transparent 70%);
    }
    .db-section .db-eyebrow {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      margin-bottom: 36px; text-align: center;
    }
    .db-section .db-eyebrow-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px; border-radius: 999px;
      background: rgba(229, 50, 45, 0.10);
      border: 1px solid rgba(229, 50, 45, 0.40);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
      color: #E5322D;
    }
    .db-section .db-eyebrow-pill .live-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #E5322D;
      animation: priceLiveDot 1.4s ease-in-out infinite;
    }
    .db-section .db-headline {
      font-family: 'Instrument Serif', serif;
      color: #fff;
      font-size: 38px; line-height: 1.0; letter-spacing: -0.04em;
      max-width: 24ch;
      margin: 0 auto;
    }
    @media (min-width: 768px) { .db-section .db-headline { font-size: 56px; } }
    @media (min-width: 1024px) { .db-section .db-headline { font-size: 64px; } }
    .db-section .db-sub {
      margin-top: 6px;
      font-family: 'Inter', sans-serif; font-weight: 300;
      font-size: 13px; line-height: 1.5;
      color: rgba(255, 255, 255, 0.55);
      max-width: 42ch;
      margin-left: auto; margin-right: auto;
    }

    /* Frame */
    .db-frame {
      max-width: 1080px; margin: 0 auto;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: rgba(8, 8, 10, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 24px 64px rgba(0,0,0,0.6),
        0 0 80px rgba(229, 50, 45, 0.06);
      display: flex; flex-direction: column;
      height: 660px;
    }
    @media (max-width: 767px) { .db-frame { height: 540px; } }

    .db-topbar {
      height: 38px; flex-shrink: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .db-traffic { display: flex; gap: 6px; }
    .db-traffic span { width: 11px; height: 11px; border-radius: 50%; }
    .db-traffic span:nth-child(1) { background: #FF5F57; }
    .db-traffic span:nth-child(2) { background: #FEBC2E; }
    .db-traffic span:nth-child(3) { background: #28C840; }
    .db-title {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: rgba(255, 255, 255, 0.55); letter-spacing: 0.04em;
    }
    .db-status {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: #6FA08F; letter-spacing: 0.10em;
    }
    .db-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #6FA08F; box-shadow: 0 0 6px rgba(111, 160, 143, 0.7);
    }

    .db-body { flex: 1; display: flex; min-height: 0; }
    .db-sidebar {
      width: 200px; flex-shrink: 0;
      display: flex; flex-direction: column;
      padding: 18px 12px 14px;
      background: rgba(0, 0, 0, 0.30);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }
    @media (max-width: 767px) { .db-sidebar { display: none; } }
    .db-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 11px; border-radius: 8px;
      background: transparent; border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      cursor: default;
      width: 100%;
    }
    .db-nav.active {
      background: rgba(229, 50, 45, 0.10);
    }
    .db-agent-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 14px;
      letter-spacing: -0.02em;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.78);
    }
    .db-nav.active .db-agent-avatar.a {
      background: linear-gradient(135deg, #E5322D, #8B1410);
      border-color: rgba(229,50,45,0.55);
      color: #fff;
      box-shadow: 0 0 12px rgba(229,50,45,0.30);
    }
    .db-agent-avatar.b {
      background: rgba(111,160,143,0.18);
      border-color: rgba(111,160,143,0.40);
      color: #6FA08F;
    }
    .db-agent-avatar.c {
      background: rgba(217,205,182,0.10);
      border-color: rgba(217,205,182,0.30);
      color: #d9cdb6;
    }
    .db-agent-name {
      flex: 1;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: rgba(255,255,255,0.78);
    }
    .db-nav.active .db-agent-name {
      color: #E5322D;
      font-weight: 500;
    }
    .db-agent-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
      background: #E5322D;
      color: #fff;
      box-shadow: 0 0 8px rgba(229,50,45,0.45);
      animation: badgePulse 2.4s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 8px rgba(229,50,45,0.45); }
      50% { box-shadow: 0 0 14px rgba(229,50,45,0.70); }
    }
    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .db-user {
      margin-top: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 11px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
    }
    .db-user-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: #E5322D;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 600;
    }

    .db-main {
      flex: 1; position: relative; overflow: hidden;
      background: rgba(0, 0, 0, 0.10);
    }
    /* Bottom-anchored chat thread — newest at bottom, older pushed up + clipped */
    .db-thread {
      position: absolute; inset: 0;
      overflow: hidden;
      padding: 22px 28px;
      display: flex;
      mask-image: linear-gradient(to bottom, transparent 0, #000 56px, #000 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 56px, #000 100%);
    }
    @media (max-width: 767px) { .db-thread { padding: 16px 18px; } }

    .db-thread-content {
      display: flex; flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      width: 100%; min-height: 100%;
    }

    .db-bubble-row {
      animation: bubbleMountIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    @keyframes bubbleMountIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Typing indicator row — mounted by React when agent is composing */
    .db-typing-row {
      display: flex; align-items: flex-start;
      animation: bubbleMountIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .db-typing-row.user { justify-content: flex-end; }
    .db-typing-row.agent { gap: 12px; }
    .db-typing-row .typing-bubble {
      display: inline-flex; gap: 5px; align-items: center;
      padding: 9px 12px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .db-typing-row.user .typing-bubble {
      background: rgba(229, 50, 45, 0.12);
      border-color: rgba(229, 50, 45, 0.35);
    }
    .db-typing-row .typing-bubble .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      animation: typingPulse 1.4s ease-in-out infinite;
    }
    .db-typing-row.user .typing-bubble .dot { background: rgba(255, 255, 255, 0.85); }
    .db-typing-row .typing-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
    .db-typing-row .typing-bubble .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingPulse {
      0%, 60%, 100% { opacity: 0.30; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-2px); }
    }
    /* (timing handled by React state machine — no CSS-driven scene cycle) */

    .db-bubble-row.user { display: flex; justify-content: flex-end; }
    .db-bubble-row.agent { display: flex; gap: 12px; align-items: flex-start; }
    .db-bubble-row.agent .db-avatar { margin-top: 2px; }
    .db-bubble-row.system {
      align-self: center;
      font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.30);
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    /* User msg + Agent msg + content */
    .db-msg-user {
      align-self: flex-end; max-width: 75%;
      padding: 8px 14px; border-radius: 14px 14px 4px 14px;
      background: rgba(229, 50, 45, 0.12);
      border: 1px solid rgba(229, 50, 45, 0.35);
      font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.4;
      color: #fff;
    }
    .db-msg-agent {
      display: flex; gap: 12px; align-items: flex-start;
      max-width: 92%;
    }
    .db-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #E5322D, #8B1410);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px;
    }
    .db-bubble {
      padding: 12px 16px; border-radius: 4px 14px 14px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45;
      color: rgba(255, 255, 255, 0.92); flex: 1;
    }
    .db-bubble strong { color: #fff; font-weight: 500; }

    /* Scene-specific content blocks */
    .db-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .db-list .item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 7px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: rgba(255,255,255,0.78);
    }
    .db-list .item .marker {
      width: 6px; height: 6px; border-radius: 2px; background: #E5322D; flex-shrink: 0;
    }
    .db-list .item .meta { color: rgba(255,255,255,0.40); margin-left: auto; }

    .db-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .db-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 999px;
      background: rgba(229,50,45,0.10);
      border: 1px solid rgba(229,50,45,0.45);
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: #E5322D; letter-spacing: 0.04em;
    }
    .db-chip::before { content: '✓'; font-size: 9px; }
    .db-chip.dim { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.10); color: rgba(255,255,255,0.6); }
    .db-chip.dim::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.4); }

    .db-slides { display: flex; gap: 8px; margin-top: 10px; }
    .db-slide {
      flex: 1; aspect-ratio: 16/10;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
      padding: 6px 7px;
      display: flex; flex-direction: column; gap: 3px;
      background: rgba(0,0,0,0.30);
    }
    .db-slide .h { height: 3px; background: #E5322D; width: 60%; border-radius: 1px; }
    .db-slide .l { height: 2px; background: rgba(255,255,255,0.30); border-radius: 1px; }

    .db-stats { display: flex; gap: 10px; margin-top: 10px; }
    .db-stat {
      flex: 1; padding: 10px 12px;
      border-radius: 8px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .db-stat .num { font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; color: #fff; letter-spacing: -0.02em; }
    .db-stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-top: 6px; }

    .db-attach {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px 6px 6px; border-radius: 8px;
      background: rgba(229,50,45,0.10); border: 1px solid rgba(229,50,45,0.45);
      margin-top: 10px;
    }
    .db-attach .ic {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600;
      color: #fff; background: #E5322D;
      padding: 3px 6px; border-radius: 3px; letter-spacing: 0.06em;
    }
    .db-attach .nm { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.92); }

    .db-cal-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
    .db-cal-cell {
      aspect-ratio: 1; border-radius: 4px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; padding: 4px; gap: 2px;
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      color: rgba(255,255,255,0.4);
    }
    .db-cal-cell.evt { background: rgba(229,50,45,0.10); border-color: rgba(229,50,45,0.45); color: #E5322D; }
    .db-cal-cell.conflict { background: rgba(229,50,45,0.20); border-color: #E5322D; }

    .db-script { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
    .db-script-row { display: flex; align-items: center; gap: 8px; }
    .db-script-row .t { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #E5322D; width: 36px; }
    .db-script-row .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.55); width: 50px; letter-spacing: 0.10em; }
    .db-script-row .bar { flex: 1; height: 3px; background: rgba(255,255,255,0.15); border-radius: 1.5px; }

    .db-radar { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
    .db-radar svg { width: 56px; height: 56px; flex-shrink: 0; }
    .db-radar .ring { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 0.8; }
    .db-radar .sw { stroke: #E5322D; stroke-width: 1.2; transform-origin: 30px 30px; animation: capSweep 3s linear infinite; }
    .db-radar .blip { fill: #E5322D; }
    .db-radar .info { display: flex; flex-direction: column; gap: 4px; }
    .db-radar .info .t { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #fff; }
    .db-radar .info .s { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; }

    /* Input area */
    .db-input {
      flex-shrink: 0;
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.30);
      display: flex; align-items: center; gap: 10px;
    }
    .db-input-box {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      position: relative;
      min-height: 40px;
      display: flex; align-items: center;
    }
    .db-input-text {
      position: relative;
      width: 100%;
      height: 1.4em;
      overflow: hidden;
    }
    .db-input-text .typing {
      position: absolute; top: 0; left: 0;
      white-space: nowrap; opacity: 0;
      animation: dbInputTyping 72s ease-in-out infinite;
    }
    .db-input-text .typing:nth-child(1)  { animation-delay: 0s; }
    .db-input-text .typing:nth-child(2)  { animation-delay: 6s; }
    .db-input-text .typing:nth-child(3)  { animation-delay: 12s; }
    .db-input-text .typing:nth-child(4)  { animation-delay: 18s; }
    .db-input-text .typing:nth-child(5)  { animation-delay: 24s; }
    .db-input-text .typing:nth-child(6)  { animation-delay: 30s; }
    .db-input-text .typing:nth-child(7)  { animation-delay: 36s; }
    .db-input-text .typing:nth-child(8)  { animation-delay: 42s; }
    .db-input-text .typing:nth-child(9)  { animation-delay: 48s; }
    .db-input-text .typing:nth-child(10) { animation-delay: 54s; }
    .db-input-text .typing:nth-child(11) { animation-delay: 60s; }
    .db-input-text .typing:nth-child(12) { animation-delay: 66s; }
    @keyframes dbInputTyping {
      0% { opacity: 0; }
      1% { opacity: 1; }
      7% { opacity: 1; }
      8.3% { opacity: 0; }
      100% { opacity: 0; }
    }
    .db-input-placeholder {
      font-family: 'Inter', sans-serif; font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      display: inline-flex; align-items: center;
    }
    .db-input-typed {
      font-family: 'Inter', sans-serif; font-size: 13px;
      color: rgba(255, 255, 255, 0.92);
      display: inline-flex; align-items: center;
    }

    /* Send button click flash */
    .db-send {
      transition: background 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
    }
    .db-send.db-send-clicked {
      background: #B8231F;
      transform: scale(0.92);
      box-shadow: 0 0 24px rgba(229, 50, 45, 0.75);
    }

    /* Animated mouse cursor */
    .db-cursor {
      position: absolute;
      width: 18px; height: 22px;
      pointer-events: none;
      z-index: 50;
      bottom: 110px;
      right: 50%;
      opacity: 0;
      transition:
        bottom 0.55s cubic-bezier(0.16, 1, 0.3, 1),
        right 0.55s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.18s cubic-bezier(0.4, 0, 0.6, 1),
        opacity 0.30s ease;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.55));
    }
    .db-cursor svg { width: 100%; height: 100%; display: block; }
    .db-cursor.cur-user-typing {
      opacity: 1;
      bottom: 100px;
      right: 56%;
      transform: rotate(-6deg);
    }
    .db-cursor.cur-user-moving {
      opacity: 1;
      bottom: 30px;
      right: 36px;
      transform: rotate(-4deg);
    }
    .db-cursor.cur-user-click {
      opacity: 1;
      bottom: 30px;
      right: 36px;
      transform: rotate(-4deg) scale(0.84);
    }
    @media (max-width: 767px) {
      .db-cursor {
        bottom: 88px; right: 50%;
      }
      .db-cursor.cur-user-moving,
      .db-cursor.cur-user-click {
        bottom: 30px; right: 30px;
      }
    }
    .db-input-caret {
      display: inline-block;
      width: 1.5px; height: 14px; background: #E5322D;
      vertical-align: middle; margin-left: 2px;
      animation: pvBlink 0.9s steps(2) infinite;
    }
    .db-send {
      width: 40px; height: 40px; border-radius: 10px;
      background: #E5322D;
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
      box-shadow: 0 0 16px rgba(229, 50, 45, 0.35);
    }

    /* Film-grain overlay — masks low-quality video compression */
    .hero-grain {
      position: absolute; inset: 0; pointer-events: none;
      z-index: 1;
      opacity: 0.42;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.62 0 0 0 0 0.58 0 0 0 0 0.52 0 0 0 0.65 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 220px 220px;
      animation: heroGrain 0.6s steps(6) infinite;
    }
    @keyframes heroGrain {
      0%   { background-position: 0 0; }
      20%  { background-position: -36px -64px; }
      40%  { background-position: 80px -28px; }
      60%  { background-position: -110px 90px; }
      80%  { background-position: 60px 110px; }
      100% { background-position: 0 0; }
    }

    /* ─── DIY PAIN CARD ANIMATIONS ─── */
    .pain-viz {
      position: relative;
      height: 88px;
      width: 100%;
      margin-bottom: 18px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px;
      line-height: 1.4;
      color: rgba(255,255,255,0.55);
    }
    .pain-viz::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 70%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* 01 VPS — terminal scrolling cryptic flags */
    .pv-vps { padding: 10px 12px; }
    .pv-vps .row { white-space: nowrap; opacity: 0; animation: pvVpsRow 6s linear infinite; }
    .pv-vps .row:nth-child(1) { animation-delay: 0s; }
    .pv-vps .row:nth-child(2) { animation-delay: 0.6s; }
    .pv-vps .row:nth-child(3) { animation-delay: 1.2s; }
    .pv-vps .row:nth-child(4) { animation-delay: 1.8s; }
    .pv-vps .row:nth-child(5) { animation-delay: 2.4s; }
    .pv-vps .row:nth-child(6) { animation-delay: 3.0s; color: #E5322D; }
    .pv-vps .prompt { color: rgba(229,50,45,0.9); }
    .pv-vps .flag { color: rgba(255,255,255,0.85); }
    @keyframes pvVpsRow {
      0% { opacity: 0; transform: translateY(0); }
      8%, 50% { opacity: 0.85; transform: translateY(0); }
      60%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    .pv-vps .cursor { display: inline-block; width: 6px; height: 11px; background: #E5322D; vertical-align: -1px; animation: pvBlink 0.9s steps(2) infinite; }
    @keyframes pvBlink { 50% { opacity: 0; } }

    /* 02 PYTHON — version collision tug-of-war */
    .pv-py { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .pv-py .ver { padding: 4px 10px; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; font-weight: 500; color: rgba(255,255,255,0.85); }
    .pv-py .ver.a { animation: pvPullL 2.4s ease-in-out infinite; }
    .pv-py .ver.b { animation: pvPullR 2.4s ease-in-out infinite; }
    @keyframes pvPullL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-12px); border-color: #E5322D; color: #fff; } }
    @keyframes pvPullR { 0%,100% { transform: translateX(0); } 50% { transform: translateX(12px); border-color: #E5322D; color: #fff; } }
    .pv-py .clash { width: 24px; height: 1px; background: rgba(255,255,255,0.25); position: relative; }
    .pv-py .clash::before, .pv-py .clash::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      border-radius: 50%; background: #E5322D; transform: translate(-50%,-50%) scale(0);
      animation: pvClash 2.4s ease-in-out infinite;
    }
    .pv-py .clash::after { animation-delay: 0.05s; box-shadow: 0 0 14px #E5322D; }
    @keyframes pvClash { 0%,40%,60%,100% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 50% { transform: translate(-50%,-50%) scale(2.4); opacity: 1; } }
    .pv-py .err { position: absolute; bottom: 8px; left: 12px; right: 12px; text-align: center; font-size: 9px; color: #E5322D; opacity: 0; animation: pvErrFlash 2.4s ease-in-out infinite; }
    @keyframes pvErrFlash { 0%,45%,65%,100% { opacity: 0; } 50%,55% { opacity: 0.95; } }

    /* 03 TOOLS — chips swarming chaotically */
    .pv-tools { padding: 8px; }
    .pv-tools .chip {
      position: absolute; padding: 3px 7px; border-radius: 999px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.78); font-size: 9.5px; white-space: nowrap;
      animation: pvJitter 4s ease-in-out infinite;
    }
    .pv-tools .chip:nth-child(1) { top: 10px; left: 8px; animation-delay: 0s; }
    .pv-tools .chip:nth-child(2) { top: 12px; left: 64px; animation-delay: 0.3s; border-color: rgba(229,50,45,0.5); color: #E5322D; }
    .pv-tools .chip:nth-child(3) { top: 38px; left: 18px; animation-delay: 0.6s; }
    .pv-tools .chip:nth-child(4) { top: 38px; left: 78px; animation-delay: 0.9s; }
    .pv-tools .chip:nth-child(5) { top: 64px; left: 10px; animation-delay: 1.2s; }
    .pv-tools .chip:nth-child(6) { top: 64px; left: 70px; animation-delay: 1.5s; border-color: rgba(229,50,45,0.5); color: #E5322D; }
    .pv-tools .chip:nth-child(7) { top: 10px; left: 130px; animation-delay: 1.8s; }
    .pv-tools .chip:nth-child(8) { top: 38px; left: 140px; animation-delay: 2.1s; }
    .pv-tools .chip:nth-child(9) { top: 64px; left: 132px; animation-delay: 2.4s; }
    @keyframes pvJitter {
      0%,100% { transform: translate(0,0); }
      25% { transform: translate(2px,-2px); }
      50% { transform: translate(-1px,2px); }
      75% { transform: translate(-2px,-1px); }
    }

    /* 04 DEBUG 2AM — red error stack scrolling fast */
    .pv-debug { padding: 8px 12px; }
    .pv-debug .stream {
      position: absolute; inset: 0; padding: 8px 12px;
      animation: pvScroll 5s linear infinite;
      color: rgba(229,50,45,0.85);
      font-size: 9.5px; line-height: 1.45;
    }
    .pv-debug .stream div { white-space: nowrap; }
    .pv-debug .stream .dim { color: rgba(255,255,255,0.35); }
    @keyframes pvScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .pv-debug .clock {
      position: absolute; top: 6px; right: 8px; z-index: 6;
      font-size: 9px; color: rgba(229,50,45,0.9);
      background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px;
      border: 1px solid rgba(229,50,45,0.4);
      animation: pvBlink 1.4s steps(2) infinite;
    }

    /* 05 MEMORY LEAK — bar climbs then crashes */
    .pv-mem { padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .pv-mem .label { display: flex; justify-content: space-between; font-size: 9.5px; color: rgba(255,255,255,0.6); }
    .pv-mem .label .pct { color: #E5322D; font-weight: 500; }
    .pv-mem .bar { height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; position: relative; }
    .pv-mem .fill {
      position: absolute; inset: 0 100% 0 0;
      background: linear-gradient(to right, rgba(229,50,45,0.5), #E5322D);
      animation: pvMemFill 6s ease-in-out infinite;
    }
    @keyframes pvMemFill {
      0% { right: 100%; }
      70% { right: 4%; }
      72% { right: 4%; background: #fff; }
      74% { right: 100%; }
      100% { right: 100%; }
    }
    .pv-mem .ticks { display: flex; gap: 2px; height: 22px; align-items: flex-end; }
    .pv-mem .ticks span { flex: 1; background: rgba(255,255,255,0.12); animation: pvTick 6s ease-in-out infinite; }
    .pv-mem .ticks span:nth-child(1) { animation-delay: 0s; }
    .pv-mem .ticks span:nth-child(2) { animation-delay: 0.3s; }
    .pv-mem .ticks span:nth-child(3) { animation-delay: 0.6s; }
    .pv-mem .ticks span:nth-child(4) { animation-delay: 0.9s; }
    .pv-mem .ticks span:nth-child(5) { animation-delay: 1.2s; }
    .pv-mem .ticks span:nth-child(6) { animation-delay: 1.5s; }
    .pv-mem .ticks span:nth-child(7) { animation-delay: 1.8s; }
    .pv-mem .ticks span:nth-child(8) { animation-delay: 2.1s; }
    .pv-mem .ticks span:nth-child(9) { animation-delay: 2.4s; }
    .pv-mem .ticks span:nth-child(10) { animation-delay: 2.7s; }
    .pv-mem .ticks span:nth-child(11) { animation-delay: 3.0s; }
    .pv-mem .ticks span:nth-child(12) { animation-delay: 3.3s; }
    @keyframes pvTick {
      0% { height: 20%; background: rgba(255,255,255,0.12); }
      70% { height: 95%; background: #E5322D; }
      72% { height: 10%; background: rgba(255,255,255,0.06); }
      100% { height: 20%; background: rgba(255,255,255,0.12); }
    }

    /* 06 TUNING — slider oscillating, never settling */
    .pv-tune { padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 9px; }
    .pv-tune .row { display: flex; align-items: center; gap: 10px; font-size: 9.5px; color: rgba(255,255,255,0.55); }
    .pv-tune .row .name { width: 44px; flex-shrink: 0; }
    .pv-tune .track { flex: 1; height: 2px; background: rgba(255,255,255,0.12); position: relative; border-radius: 1px; }
    .pv-tune .knob {
      position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
      background: #E5322D; box-shadow: 0 0 10px rgba(229,50,45,0.6);
      transform: translate(-50%, -50%);
    }
    .pv-tune .row:nth-child(1) .knob { animation: pvKnob1 3.2s ease-in-out infinite; }
    .pv-tune .row:nth-child(2) .knob { animation: pvKnob2 4.1s ease-in-out infinite; }
    .pv-tune .row:nth-child(3) .knob { animation: pvKnob3 2.7s ease-in-out infinite; }
    @keyframes pvKnob1 { 0%,100% { left: 22%; } 50% { left: 78%; } }
    @keyframes pvKnob2 { 0%,100% { left: 60%; } 50% { left: 18%; } }
    @keyframes pvKnob3 { 0%,100% { left: 35%; } 50% { left: 85%; } }

    /* ─── USE-CASE CARD VIZ ─── */
    .uc-viz {
      position: relative;
      height: 76px;
      width: 100%;
      margin-bottom: 14px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* RISET — scanner sweeping rows of "results" */
    .uc-research { padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; justify-content: center; height: 100%; }
    .uc-research .row { display: flex; align-items: center; gap: 6px; }
    .uc-research .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.45); flex-shrink: 0; }
    .uc-research .line { height: 2.5px; border-radius: 2px; background: rgba(255,255,255,0.16); }
    .uc-research .row:nth-child(1) .line { width: 78%; }
    .uc-research .row:nth-child(2) .line { width: 60%; }
    .uc-research .row:nth-child(3) .line { width: 70%; }
    .uc-research .row:nth-child(4) .line { width: 48%; }
    .uc-research .scanner {
      position: absolute; left: 0; right: 0; height: 12px;
      background: linear-gradient(to bottom, transparent 0%, rgba(229,50,45,0.20) 50%, transparent 100%);
      border-top: 1px solid rgba(229,50,45,0.55);
      border-bottom: 1px solid rgba(229,50,45,0.55);
      animation: ucScan 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes ucScan {
      0% { top: -12px; }
      50% { top: calc(100% - 0px); }
      100% { top: -12px; }
    }

    /* KONTEN — sequential typing bars */
    .uc-content { padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; justify-content: center; height: 100%; }
    .uc-content .ln {
      height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }
    .uc-content .ln::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0.55);
      transform-origin: left;
      transform: scaleX(0);
      animation: ucScale 4.2s ease-in-out infinite;
    }
    .uc-content .ln:nth-child(1) { width: 82%; }
    .uc-content .ln:nth-child(2) { width: 64%; }
    .uc-content .ln:nth-child(3) { width: 76%; }
    .uc-content .ln:nth-child(4) { width: 42%; }
    .uc-content .ln:nth-child(1)::before { animation-delay: 0s; }
    .uc-content .ln:nth-child(2)::before { animation-delay: 0.35s; }
    .uc-content .ln:nth-child(3)::before { animation-delay: 0.7s; }
    .uc-content .ln:nth-child(4)::before { animation-delay: 1.05s; }
    @keyframes ucScale {
      0% { transform: scaleX(0); opacity: 1; }
      40% { transform: scaleX(1); opacity: 1; }
      85% { transform: scaleX(1); opacity: 1; }
      90% { opacity: 0; }
      100% { transform: scaleX(0); opacity: 0; }
    }
    /* tiny red caret on each row */
    .uc-content .ln::after {
      content: ''; position: absolute; top: -2px; bottom: -2px;
      width: 1.4px; background: #E5322D; box-shadow: 0 0 6px rgba(229,50,45,0.7);
      left: 0; opacity: 0;
      animation: ucCaret 4.2s ease-in-out infinite;
    }
    .uc-content .ln:nth-child(1)::after { animation-delay: 0s; }
    .uc-content .ln:nth-child(2)::after { animation-delay: 0.35s; }
    .uc-content .ln:nth-child(3)::after { animation-delay: 0.7s; }
    .uc-content .ln:nth-child(4)::after { animation-delay: 1.05s; }
    @keyframes ucCaret {
      0% { left: 0; opacity: 1; }
      40% { left: 100%; opacity: 1; }
      45%, 100% { opacity: 0; }
    }

    /* CODING — code lines fading in with syntax color */
    .uc-coding { padding: 9px 11px; display: flex; flex-direction: column; gap: 3px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; line-height: 1.45; color: rgba(255,255,255,0.78); }
    .uc-coding .ln { display: flex; align-items: center; gap: 4px; opacity: 0; animation: ucCode 5s ease-in-out infinite; white-space: nowrap; }
    .uc-coding .ln:nth-child(1) { animation-delay: 0s; }
    .uc-coding .ln:nth-child(2) { animation-delay: 0.45s; padding-left: 12px; }
    .uc-coding .ln:nth-child(3) { animation-delay: 0.9s; padding-left: 12px; }
    .uc-coding .ln:nth-child(4) { animation-delay: 1.35s; }
    .uc-coding .num { color: rgba(255,255,255,0.28); width: 8px; flex-shrink: 0; }
    .uc-coding .kw { color: #E5322D; }
    .uc-coding .punct { color: rgba(255,255,255,0.45); }
    @keyframes ucCode {
      0% { opacity: 0; transform: translateX(-3px); }
      10% { opacity: 0.92; transform: translateX(0); }
      85% { opacity: 0.92; }
      92% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* KNOWLEDGE — node/edge graph with traveling pulses */
    .uc-knowledge { padding: 0; }
    .uc-knowledge svg { width: 100%; height: 100%; display: block; }
    .uc-knowledge .edge {
      stroke: rgba(255,255,255,0.18);
      stroke-width: 1;
      stroke-dasharray: 80;
      animation: ucEdge 3.8s ease-in-out infinite;
    }
    .uc-knowledge .edge:nth-of-type(1) { animation-delay: 0s; }
    .uc-knowledge .edge:nth-of-type(2) { animation-delay: 0.4s; }
    .uc-knowledge .edge:nth-of-type(3) { animation-delay: 0.8s; }
    .uc-knowledge .edge:nth-of-type(4) { animation-delay: 1.2s; }
    .uc-knowledge .edge:nth-of-type(5) { animation-delay: 1.6s; }
    .uc-knowledge .edge:nth-of-type(6) { animation-delay: 2.0s; }
    @keyframes ucEdge {
      0% { stroke-dashoffset: 80; stroke: rgba(255,255,255,0.14); }
      40% { stroke: rgba(229,50,45,0.75); }
      55% { stroke-dashoffset: -80; stroke: rgba(229,50,45,0.75); }
      100% { stroke-dashoffset: -80; stroke: rgba(255,255,255,0.14); }
    }
    .uc-knowledge .node {
      fill: rgba(255,255,255,0.55);
      animation: ucNode 3.8s ease-in-out infinite;
    }
    .uc-knowledge .node:nth-of-type(7) { animation-delay: 0.2s; }
    .uc-knowledge .node:nth-of-type(8) { animation-delay: 0.6s; }
    .uc-knowledge .node:nth-of-type(9) { animation-delay: 1.0s; }
    .uc-knowledge .node:nth-of-type(10) { animation-delay: 1.4s; }
    .uc-knowledge .node:nth-of-type(11) { animation-delay: 1.8s; }
    @keyframes ucNode {
      0%, 100% { fill: rgba(255,255,255,0.5); filter: none; }
      50% { fill: #E5322D; filter: drop-shadow(0 0 4px rgba(229,50,45,0.85)); }
    }

    /* ─── INFINITE MARQUEE for use-case cards ─── */
    .uc-marquee {
      position: relative;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 100px, #000 calc(100% - 100px), transparent 100%);
              mask-image: linear-gradient(to right, transparent 0, #000 100px, #000 calc(100% - 100px), transparent 100%);
    }
    .uc-marquee-track {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: ucMarquee 90s linear infinite;
      will-change: transform;
    }
    @media (min-width: 768px) { .uc-marquee-track { gap: 18px; } }
    .uc-marquee:hover .uc-marquee-track { animation-play-state: paused; }
    @keyframes ucMarquee {
      0%   { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    .uc-card { flex: 0 0 200px; }
    @media (min-width: 640px) { .uc-card { flex: 0 0 260px; } }
    @media (min-width: 768px) { .uc-card { flex: 0 0 340px; } }

    /* Bumped viz height for bigger cards */
    .uc-card .uc-viz { height: 80px; margin-bottom: 10px; }
    @media (min-width: 640px) { .uc-card .uc-viz { height: 92px; margin-bottom: 12px; } }
    @media (min-width: 768px) { .uc-card .uc-viz { height: 108px; margin-bottom: 18px; } }

    /* Reverse-direction marquee (top row) */
    .uc-marquee-rev .uc-marquee-track { animation-direction: reverse; }

    /* Marquee cards — stronger blur + dark tint for content clarity over video bg */
    .uc-marquee-track .uc-card.liquid-glass,
    .uc-marquee-track .uc-card-text.liquid-glass {
      backdrop-filter: blur(24px) saturate(1.1);
      -webkit-backdrop-filter: blur(24px) saturate(1.1);
      background: rgba(10, 10, 10, 0.45);
      background-blend-mode: normal;
    }

    /* Text-only capability card for top marquee */
    .uc-card-text {
      flex: 0 0 190px;
      padding: 14px 16px;
      display: flex; flex-direction: column;
      height: 200px;
      border-radius: 14px;
    }
    @media (min-width: 640px) { .uc-card-text { flex: 0 0 250px; height: 220px; padding: 16px 18px; } }
    @media (min-width: 768px) { .uc-card-text { flex: 0 0 320px; padding: 20px 22px; height: 260px; border-radius: 16px; } }

    .uc-card-text .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: 0.20em; text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
    }
    .uc-card-text .title {
      font-family: 'Instrument Serif', serif;
      font-size: 20px; line-height: 1.05; letter-spacing: -0.02em;
      color: #fff; margin-top: 6px;
    }
    @media (min-width: 768px) { .uc-card-text .title { font-size: 24px; margin-top: 6px; } }
    .uc-card-text .body {
      margin-top: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 11px; line-height: 1.5; font-weight: 300;
      color: rgba(255, 255, 255, 0.62);
      flex: 1;
    }
    @media (min-width: 768px) { .uc-card-text .body { font-size: 12px; margin-top: 6px; } }

    /* ─── CAPABILITY VIZ (top marquee) ─── */
    .cap-viz {
      position: relative;
      height: 40px;
      width: 100%;
      margin-bottom: 8px;
      border-radius: 7px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
    }
    @media (min-width: 640px) { .cap-viz { height: 48px; margin-bottom: 10px; } }
    @media (min-width: 768px) { .cap-viz { height: 56px; margin-bottom: 12px; border-radius: 8px; } }

    /* 01 EMAIL — rows with category tag pulses */
    .cap-email { padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .cap-email .ln { display: flex; align-items: center; gap: 7px; }
    .cap-email .ln::before { content: ''; flex: 1; height: 2.5px; border-radius: 1px; background: rgba(255,255,255,0.18); }
    .cap-email .ln .tag { width: 6px; height: 6px; border-radius: 1.5px; flex-shrink: 0; background: rgba(255,255,255,0.10); animation: capEmailTag 4s steps(1, end) infinite; }
    .cap-email .ln:nth-child(1) .tag { animation-delay: 0s; }
    .cap-email .ln:nth-child(2) .tag { animation-delay: 1s; }
    .cap-email .ln:nth-child(3) .tag { animation-delay: 2s; }
    .cap-email .ln:nth-child(4) .tag { animation-delay: 3s; }
    @keyframes capEmailTag {
      0%, 12% { background: #E5322D; box-shadow: 0 0 6px rgba(229,50,45,0.7); }
      15%, 100% { background: rgba(255,255,255,0.10); box-shadow: none; }
    }

    /* 02 SLIDE — 3 mini slides flashing */
    .cap-slide { padding: 5px 8px; display: flex; gap: 5px; height: 100%; align-items: center; justify-content: center; }
    .cap-slide .s {
      flex: 1; max-width: 60px; height: 36px;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
      display: flex; flex-direction: column; padding: 4px 5px; gap: 2px;
      background: rgba(0,0,0,0.30);
      animation: capSlide 4s ease-in-out infinite;
    }
    .cap-slide .s:nth-of-type(1) { animation-delay: 0s; }
    .cap-slide .s:nth-of-type(2) { animation-delay: 0.5s; }
    .cap-slide .s:nth-of-type(3) { animation-delay: 1s; }
    .cap-slide .s .h { height: 2px; background: rgba(229,50,45,0.7); width: 60%; border-radius: 1px; }
    .cap-slide .s .l { height: 1.5px; background: rgba(255,255,255,0.30); border-radius: 1px; }
    .cap-slide .s .l:nth-child(2) { width: 80%; }
    .cap-slide .s .l:nth-child(3) { width: 60%; }
    @keyframes capSlide {
      0%, 1% { border-color: rgba(255,255,255,0.18); box-shadow: none; }
      6%, 16% { border-color: #E5322D; box-shadow: 0 0 8px rgba(229,50,45,0.4); }
      20%, 100% { border-color: rgba(255,255,255,0.18); box-shadow: none; }
    }

    /* 03 MULTIPOST — platform pills + central source */
    .cap-multipost { padding: 5px 8px; display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .cap-multipost .row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
    .cap-multipost .p {
      font-family: 'JetBrains Mono', monospace; font-size: 7.5px;
      padding: 2px 5px; border-radius: 999px;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.50);
      border: 1px solid rgba(255,255,255,0.10);
      animation: capPostP 4s steps(1, end) infinite;
    }
    .cap-multipost .p:nth-child(1) { animation-delay: 0s; }
    .cap-multipost .p:nth-child(2) { animation-delay: 0.4s; }
    .cap-multipost .p:nth-child(3) { animation-delay: 0.8s; }
    .cap-multipost .p:nth-child(4) { animation-delay: 1.2s; }
    .cap-multipost .p:nth-child(5) { animation-delay: 1.6s; }
    .cap-multipost .p:nth-child(6) { animation-delay: 2.0s; }
    @keyframes capPostP {
      0%, 8%   { background: #E5322D; color: #fff; border-color: #E5322D; box-shadow: 0 0 5px rgba(229,50,45,0.5); }
      12%, 100% { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.50); border-color: rgba(255,255,255,0.10); box-shadow: none; }
    }
    .cap-multipost .src {
      font-family: 'Instrument Serif', serif; font-size: 9px; text-align: center;
      color: rgba(229,50,45,0.85); letter-spacing: 0.06em; font-style: italic;
    }

    /* 04 AUTOREPLY — chat bubbles + clock */
    .cap-autoreply { padding: 6px 8px; height: 100%; position: relative; }
    .cap-autoreply .clock {
      position: absolute; top: 4px; right: 7px;
      font-family: 'JetBrains Mono', monospace; font-size: 7.5px;
      color: rgba(229,50,45,0.85); letter-spacing: 0.05em;
    }
    .cap-autoreply .bubble {
      position: absolute;
      padding: 3px 7px; border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 8px;
      opacity: 0; line-height: 1.2;
    }
    .cap-autoreply .b1 {
      top: 5px; left: 6px;
      background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.10);
      animation: capArPop 4s ease-in-out infinite;
    }
    .cap-autoreply .b2 {
      bottom: 5px; right: 6px;
      background: #E5322D; color: #fff;
      animation: capArPop 4s ease-in-out infinite;
      animation-delay: 1s;
    }
    @keyframes capArPop {
      0%, 5%  { opacity: 0; transform: translateY(4px); }
      20%, 80% { opacity: 1; transform: translateY(0); }
      92%, 100% { opacity: 0; }
    }

    /* 05 PITCH — 12-cell deck filling sequentially */
    .cap-pitch { padding: 6px 8px; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); gap: 3px; height: 100%; }
    .cap-pitch .cell {
      border: 1px solid rgba(255,255,255,0.10); border-radius: 1.5px;
      background: rgba(255,255,255,0.04);
      animation: capPitch 6s steps(1, end) infinite;
    }
    .cap-pitch .cell:nth-child(1)  { animation-delay: 0s; }
    .cap-pitch .cell:nth-child(2)  { animation-delay: 0.45s; }
    .cap-pitch .cell:nth-child(3)  { animation-delay: 0.9s; }
    .cap-pitch .cell:nth-child(4)  { animation-delay: 1.35s; }
    .cap-pitch .cell:nth-child(5)  { animation-delay: 1.8s; }
    .cap-pitch .cell:nth-child(6)  { animation-delay: 2.25s; }
    .cap-pitch .cell:nth-child(7)  { animation-delay: 2.7s; }
    .cap-pitch .cell:nth-child(8)  { animation-delay: 3.15s; }
    .cap-pitch .cell:nth-child(9)  { animation-delay: 3.6s; }
    .cap-pitch .cell:nth-child(10) { animation-delay: 4.05s; }
    .cap-pitch .cell:nth-child(11) { animation-delay: 4.5s; }
    .cap-pitch .cell:nth-child(12) { animation-delay: 4.95s; }
    @keyframes capPitch {
      0%, 6%   { background: #E5322D; border-color: #E5322D; box-shadow: 0 0 5px rgba(229,50,45,0.5); }
      9%, 100% { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.10); box-shadow: none; }
    }

    /* 06 CRM — central node + 5 contacts pulsing */
    .cap-crm { padding: 0; }
    .cap-crm svg { width: 100%; height: 100%; display: block; }
    .cap-crm .e { stroke: rgba(255,255,255,0.18); stroke-width: 1; stroke-dasharray: 80; animation: capCrmEdge 3s ease-in-out infinite; }
    @keyframes capCrmEdge {
      0%   { stroke-dashoffset: 80; stroke: rgba(255,255,255,0.14); }
      40%  { stroke-dashoffset: 0;  stroke: rgba(229,50,45,0.75); }
      100% { stroke-dashoffset: -80; stroke: rgba(255,255,255,0.14); }
    }
    .cap-crm .me { fill: #E5322D; filter: drop-shadow(0 0 4px rgba(229,50,45,0.7)); }
    .cap-crm .c { fill: rgba(255,255,255,0.5); animation: capCrmNode 3s ease-in-out infinite; }
    @keyframes capCrmNode {
      0%, 30%, 100% { fill: rgba(255,255,255,0.5); filter: none; }
      55% { fill: #E5322D; filter: drop-shadow(0 0 4px rgba(229,50,45,0.85)); }
    }

    /* 07 RADAR — sweep + blips */
    .cap-radar { padding: 0; display: flex; align-items: center; justify-content: center; }
    .cap-radar svg { width: auto; height: 100%; aspect-ratio: 1; max-height: 100%; }
    .cap-radar .ring { fill: none; stroke-width: 1; }
    .cap-radar .sweep { transform-origin: 30px 30px; animation: capSweep 3s linear infinite; stroke: #E5322D; stroke-width: 1.2; }
    @keyframes capSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .cap-radar .blip { fill: #E5322D; opacity: 0; animation: capBlip 3s ease-in-out infinite; }
    @keyframes capBlip {
      0%, 5% { opacity: 1; }
      30%, 100% { opacity: 0; }
    }

    /* 08 SCRIPT — hook/body/cta segments */
    .cap-script { padding: 5px 8px; display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: center; }
    .cap-script .seg {
      display: flex; align-items: center; gap: 5px;
      opacity: 0;
      animation: capScript 4.5s ease-in-out infinite;
    }
    .cap-script .seg:nth-child(1) { animation-delay: 0s; }
    .cap-script .seg:nth-child(2) { animation-delay: 0.45s; }
    .cap-script .seg:nth-child(3) { animation-delay: 0.9s; }
    .cap-script .seg .t   { font-family: 'JetBrains Mono', monospace; font-size: 6.5px; color: rgba(229,50,45,0.85); width: 18px; }
    .cap-script .seg .lbl { font-family: 'JetBrains Mono', monospace; font-size: 6.5px; letter-spacing: 0.1em; color: rgba(255,255,255,0.55); width: 28px; }
    .cap-script .seg .bar { flex: 1; height: 2.5px; background: rgba(255,255,255,0.20); border-radius: 1px; }
    @keyframes capScript {
      0%, 5%   { opacity: 0; transform: translateX(-3px); }
      18%, 90% { opacity: 1; transform: translateX(0); }
      100%     { opacity: 1; transform: translateX(0); }
    }

    /* 09 EXCEL — formula chip + grid with active cell */
    .cap-excel { padding: 6px 8px; height: 100%; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
    .cap-excel .formula {
      font-family: 'JetBrains Mono', monospace; font-size: 7px;
      color: #E5322D; padding: 1.5px 5px;
      background: rgba(229,50,45,0.10); border: 1px solid rgba(229,50,45,0.4);
      border-radius: 2px; align-self: flex-start;
      animation: capExcelF 3.5s ease-in-out infinite;
    }
    .cap-excel .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
      gap: 2px; flex: 1;
    }
    .cap-excel .cell { background: rgba(255,255,255,0.06); border-radius: 1px; border: 1px solid rgba(255,255,255,0.08); }
    .cap-excel .cell.active { animation: capExcelC 3.5s ease-in-out infinite; }
    @keyframes capExcelF {
      0%, 8%   { opacity: 0; transform: translateY(3px); }
      22%, 88% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; }
    }
    @keyframes capExcelC {
      0%, 18%   { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
      30%, 80%  { background: rgba(229,50,45,0.30); border-color: #E5322D; }
      88%, 100% { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
    }

    /* 10 RECAP — long timeline → bullet summary */
    .cap-recap { padding: 7px 10px; display: flex; flex-direction: column; gap: 6px; height: 100%; justify-content: center; }
    .cap-recap .timeline { height: 3px; background: rgba(255,255,255,0.10); border-radius: 1.5px; position: relative; overflow: hidden; }
    .cap-recap .timeline::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: linear-gradient(to right, rgba(229,50,45,0.4), #E5322D);
      animation: capRecapPlay 4s ease-in-out infinite;
    }
    @keyframes capRecapPlay {
      0% { width: 0; }
      55% { width: 100%; }
      100% { width: 100%; }
    }
    .cap-recap .bullets { display: flex; flex-direction: column; gap: 2.5px; }
    .cap-recap .bullets .b { height: 2px; background: rgba(255,255,255,0.20); border-radius: 1px; opacity: 0; animation: capRecapB 4s ease-in-out infinite; }
    .cap-recap .bullets .b:nth-child(1) { width: 70%; animation-delay: 1.4s; }
    .cap-recap .bullets .b:nth-child(2) { width: 55%; animation-delay: 1.8s; }
    .cap-recap .bullets .b:nth-child(3) { width: 60%; animation-delay: 2.2s; }
    @keyframes capRecapB {
      0%, 5% { opacity: 0; transform: translateY(2px); }
      20%, 100% { opacity: 1; transform: translateY(0); }
    }

    /* 11 CALENDAR — week grid with conflict warning */
    .cap-calendar { padding: 5px 6px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; height: 100%; }
    .cap-calendar .day {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px; padding: 2px;
      display: flex; flex-direction: column; gap: 1.5px; justify-content: center;
    }
    .cap-calendar .day .e { height: 2.5px; background: rgba(255,255,255,0.30); border-radius: 1px; }
    .cap-calendar .day .e.mid { background: rgba(255,255,255,0.45); }
    .cap-calendar .day .e.warn { background: #E5322D; box-shadow: 0 0 4px rgba(229,50,45,0.6); animation: capCalWarn 2.4s ease-in-out infinite; }
    .cap-calendar .day.conflict { animation: capCalConflict 2.4s ease-in-out infinite; }
    @keyframes capCalWarn { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes wseaiPulse { 0%, 100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.6); opacity: 0; } }
    @keyframes capCalConflict {
      0%, 100% { border-color: rgba(255,255,255,0.08); box-shadow: none; }
      50%      { border-color: #E5322D; box-shadow: 0 0 6px rgba(229,50,45,0.55); }
    }

    /* ─── AGENT PERSONA CAROUSEL (2026-05-07) ─── */
    /* translateX-based horizontal carousel inside #proses on the dark/red
       halftone canvas. 1 card visible mobile, 2 tablet, 3 desktop.
       Originally used scroll-snap + overflow-x:auto, but the StartSection's
       centered-flex parent chain prevented scrollLeft from updating. translateX
       sidesteps the entire scroll-container path. */
    /* Wrap container — positioning context for the always-visible nav
       buttons (which sit OUTSIDE .agent-fade so they're not clipped by
       the fade-edge mask). */
    .agent-fade-wrap {
      position: relative;
      padding: 0 28px; /* room for nav buttons on each side */
    }
    @media (min-width: 768px) {
      .agent-fade-wrap { padding: 0 36px; }
    }
    .agent-fade {
      position: relative;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
              mask-image: linear-gradient(to right, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
      padding: 4px 16px;
    }
    @media (min-width: 768px) { .agent-fade { padding: 6px 24px; } }
    .agent-track {
      display: flex;
      gap: 14px;
      will-change: transform;
      transition: transform 700ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    @media (min-width: 768px) { .agent-track { gap: 18px; } }

    /* (No active/inactive distinction in animation. All 10 cards run their
       13s thinking-flow loop in sync — same pattern as the DashboardDemo
       lower on this page where the conversation just plays through. Active
       index only controls which card is centered in the viewport.) */

    @media (prefers-reduced-motion: reduce) {
      .agent-track { transition: none; }
    }

    .agent-card {
      flex: 0 0 auto;
      /* 2026-05-09 16:9 pivot: source GIFs are 1920×1080 landscape. Card
         viz area is 16:9 across all breakpoints; card body grows below
         with the title + desc.
         Mobile: card spans the carousel width (with a 360px cap so phablets
         + small tablets don't go gauche-wide). */
      width: min(86vw, 360px);
      display: flex; flex-direction: column;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px) saturate(1.05);
      -webkit-backdrop-filter: blur(18px) saturate(1.05);
      transition: border-color 240ms ease;
    }
    /* Tablet (768-1024px): single card centered, no peek of neighbors —
       the carousel JS computes pitch from getBoundingClientRect so this
       width just flows through. ~520px keeps the 16:9 viz at 520×293 which
       reads as a hero card without crowding the screen. */
    @media (min-width: 768px) and (max-width: 1024px) {
      .agent-card { width: min(72vw, 520px); }
    }
    /* Desktop (≥1025px): 480px per founder spec — fits 2 visible cards on
       a 1280-1366 laptop with breathing room (480 × 2 + 18px gap = 978px).
       Above 1500px, browser shows 3 cards naturally. */
    @media (min-width: 1025px) {
      .agent-card { width: min(36vw, 480px); }
    }
    .agent-card:hover {
      border-color: rgba(229, 50, 45, 0.40);
    }

    .agent-card .agent-viz {
      position: relative;
      width: 100%;
      /* 16:9 across all breakpoints — matches the source GIFs (1920×1080)
         so object-fit: cover doesn't crop important content out of frame. */
      aspect-ratio: 16 / 9;
      background-color: #050505;
      overflow: hidden;
    }
    /* Halftone background + vignette removed (2026-05-07 pivot): the
       chat bubble + action scenes need clean black so bubbles read as
       the focal point. */

    /* ─── CREATURE SPRITE ANIMATION ─── */
    /* Each card hosts an inline SVG with 4 <g class="frame"> groups stacked
       at the same coords. CSS keyframes smooth-fade opacity 0→1→0 per group
       with staggered delays — overlapping windows produce a cross-fade.
       Per-card cycle is 1400ms (4 frames × 350ms). Stagger across cards
       via --creature-delay so the 10 cards aren't synchronized.
       Symbol size capped at ~50% of card area (centered with breathing
       room), per founder direction "minimalist + elegant, editorial". */
    .agent-card .creature {
      position: absolute;
      width: 70%;
      height: 70%;
      top: 15%;
      left: 15%;
      pointer-events: none;
      z-index: 1; /* above ::after vignette */
    }
    .agent-card .creature .frame {
      opacity: 0;
      animation: creatureCycle 1400ms linear infinite;
      animation-delay: var(--creature-delay, 0ms);
    }
    .agent-card .creature .frame.f0 { animation-delay: calc(var(--creature-delay, 0ms) + 0ms); }
    .agent-card .creature .frame.f1 { animation-delay: calc(var(--creature-delay, 0ms) + 350ms); }
    .agent-card .creature .frame.f2 { animation-delay: calc(var(--creature-delay, 0ms) + 700ms); }
    .agent-card .creature .frame.f3 { animation-delay: calc(var(--creature-delay, 0ms) + 1050ms); }
    /* Each frame is visible for ~30% of the cycle (420ms) with 100ms fade-in
       and 100ms fade-out at the edges — the overlapping fade windows produce
       a soft cross-fade between consecutive frames. */
    @keyframes creatureCycle {
      0%   { opacity: 0; }
      7%   { opacity: 1; }
      23%  { opacity: 1; }
      30%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .agent-card .creature .frame { animation: none; opacity: 0; }
      /* Show only the last (most "complete") frame statically */
      .agent-card .creature .frame:last-child { opacity: 1; }
    }

    /* ─── AGENT SCENE: chat bubble + action mini-dashboard ─── */
    /* Replaces the abstract creature SVG with a literal preview of what
       the agent does — a short user→agent exchange followed by an action
       visualization (memory cards, charts, slide stack, etc). Mirrors
       the visual language of the main DashboardDemo scenes lower on the
       page. 5000ms loop, all elements share one cycle so they stay in
       sync. Each element gets its own keyframe with a different "in"
       timing so the order reads as a story. */
    /* Chat header — WhatsApp-style: agent name + status. No avatar dot
       in the header (the per-message red dot beside each agent bubble is
       the "agent's voice" indicator; doubling up reads as noise).
       Universal status "aktif sekarang" across all 10 cards. */
    .agent-card .scene-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      z-index: 2;
    }
    .agent-card .scene-header .scene-header-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .agent-card .scene-header .scene-header-name {
      font-family: 'Instrument Serif', serif;
      font-size: 13px;
      color: #E5322D;
      line-height: 1.05;
      letter-spacing: 0.005em;
    }
    .agent-card .scene-header .scene-header-status {
      font-family: 'Inter', sans-serif;
      font-size: 8.5px;
      color: rgba(255, 255, 255, 0.40);
      font-style: italic;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    /* === Two-zone scene layout === */
    /*   bubble-zone (top, flex:1)  → WhatsApp-style auto-scroll chat:
     *                                B1-B5 grow in their slots, older
     *                                content gets pushed up + clipped.
     *   pin-zone    (bottom, auto)  → Anim1 + Anim2 stack here, both
     *                                stay visible at end of cycle (no
     *                                auto-scroll, no clipping). */
    .agent-card .agent-scene {
      position: absolute;
      top: 38px; left: 0; right: 0; bottom: 0;
      z-index: 1;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .agent-card .bubble-zone {
      position: relative;
      overflow: hidden;
      flex: 1 1 0;
      min-height: 0;
    }
    .agent-card .chat-content {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding: 8px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .agent-card .pin-zone {
      padding: 7px 12px 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* chat-slot — bubble-zone grow animation (older slots get pushed up
       by newer slots growing below, into a fixed-height overflow:hidden
       parent → effectively "scrolls up out of view"). */
    .agent-card .chat-slot {
      display: grid;
      grid-template-rows: 0fr;
    }
    .agent-card .chat-slot > .chat-slot-inner {
      overflow: hidden;
      min-height: 0;
    }
    /* pin-slot — pin-zone grow animation. Same grid mechanic but inside
       a non-scrolling parent → both anims simply stack and stay visible. */
    .agent-card .pin-slot {
      display: grid;
      grid-template-rows: 0fr;
    }
    .agent-card .pin-slot > .pin-slot-inner {
      overflow: hidden;
      min-height: 0;
    }

    /* === Bubble visual hierarchy (unchanged from prior round) === */
    .agent-card .scene-user {
      align-self: flex-end;
      max-width: 80%;
      padding: 5px 11px;
      border-radius: 11px 11px 4px 11px;
      background: rgba(229, 50, 45, 0.14);
      border: 1px solid rgba(229, 50, 45, 0.40);
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      margin-left: auto; /* right-align inside chat-slot */
    }
    /* Wrapper for slot-user so the bubble can right-align */
    .agent-card .chat-slot.slot-user > .chat-slot-inner {
      display: flex;
      justify-content: flex-end;
    }

    /* Each agent message: avatar (only on first / "ack") + bubble.
       Continuation rows omit the avatar and indent to align with bubbles
       above — like WhatsApp grouping consecutive messages from one sender. */
    .agent-card .scene-agent-row {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }
    .agent-card .scene-agent-row.continuation {
      padding-left: 20px; /* 14px avatar + 6px gap */
    }
    .agent-card .scene-agent-row .scene-avatar {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E5322D, #8B1410);
      flex-shrink: 0;
      margin-top: 3px;
    }
    .agent-card .scene-agent-row .scene-bubble {
      flex: 1;
      min-width: 0;
    }

    .agent-card .scene-bubble {
      padding: 4px 9px;
      border-radius: 4px 11px 11px 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.88);
      font-size: 10.5px;
      line-height: 1.32;
    }
    .agent-card .scene-bubble-ack {
      color: rgba(255, 255, 255, 0.65);
      font-style: italic;
      font-size: 10px;
      padding: 3px 9px;
    }
    .agent-card .scene-bubble-progress {
      color: rgba(255, 255, 255, 0.78);
    }
    .agent-card .scene-bubble-insight {
      background: rgba(229, 50, 45, 0.06);
      border-color: rgba(229, 50, 45, 0.28);
      color: rgba(255, 255, 255, 0.96);
      font-weight: 500;
    }
    .agent-card .scene-bubble-output {
      border-color: rgba(255, 255, 255, 0.16);
    }

    .agent-card .scene-memos {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 5px;
    }
    .agent-card .scene-memo {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.78);
    }
    .agent-card .scene-memo::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 1px;
      background: #E5322D;
      flex-shrink: 0;
    }

    /* Timing — 13000ms cycle. Per-slot grow animation (grid-template-rows
       0fr → 1fr) creates the WhatsApp scroll: as each new bubble grows,
       earlier bubbles get pushed up. Older bubbles stay rendered (just
       scrolled off the top via overflow:hidden), so anim1 and anim2 can
       both exist on screen simultaneously near the end of the cycle.
       Reference timeline:
         0.0s  user bubble grows in
         1.0s  ack bubble grows in (pushes user up)
         2.5s  progress grows
         4.0s  insight grows ← smart moment, gets oxblood pulse
         5.5s  output grows
         6.5s  Animation 1 (raw data) grows
         9.0s  Animation 2 (deliverable) grows ← anim1 stays, just scrolled up
        11.5s  Hold full state (1s breathing)
        12.5s  All slots collapse together (500ms fade)
        13.0s  Loop restart                                                  */
    .agent-card .slot-user     { animation: slotUser     13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .slot-ack      { animation: slotAck      13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .slot-progress { animation: slotProgress 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .slot-insight  { animation: slotInsight  13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .slot-output   { animation: slotOutput   13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .pin-anim1     { animation: pinAnim1     13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .pin-anim2     { animation: pinAnim2     13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    /* Insight bubble pulse — the "smart moment" */
    .agent-card .scene-bubble-insight {
      animation: insightPulse 13000ms ease-out infinite;
    }

    @keyframes slotUser {
      0%        { grid-template-rows: 0fr; opacity: 0; }
      3%        { grid-template-rows: 1fr; opacity: 1; }
      92%       { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    @keyframes slotAck {
      0%, 7.5% { grid-template-rows: 0fr; opacity: 0; }
      11%      { grid-template-rows: 1fr; opacity: 1; }
      92%      { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    @keyframes slotProgress {
      0%, 19%  { grid-template-rows: 0fr; opacity: 0; }
      22%      { grid-template-rows: 1fr; opacity: 1; }
      92%      { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    @keyframes slotInsight {
      0%, 31%  { grid-template-rows: 0fr; opacity: 0; }
      34%      { grid-template-rows: 1fr; opacity: 1; }
      92%      { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    @keyframes slotOutput {
      0%, 42%  { grid-template-rows: 0fr; opacity: 0; }
      45%      { grid-template-rows: 1fr; opacity: 1; }
      92%      { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    /* Pin-zone slots — anim1 emerges 6.5s, anim2 emerges 9.0s. Both
       hold simultaneously from 9.0s → end of cycle (no fade-out of
       anim1 when anim2 arrives). */
    @keyframes pinAnim1 {
      0%, 50%  { grid-template-rows: 0fr; opacity: 0; }
      53%      { grid-template-rows: 1fr; opacity: 1; }
      92%      { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    @keyframes pinAnim2 {
      0%, 69%  { grid-template-rows: 0fr; opacity: 0; }
      72%      { grid-template-rows: 1fr; opacity: 1; }
      92%      { grid-template-rows: 1fr; opacity: 1; }
      96%, 100% { grid-template-rows: 0fr; opacity: 0; }
    }
    @keyframes insightPulse {
      0%, 31%   { box-shadow: 0 0 0 0 rgba(229, 50, 45, 0); }
      34%       { box-shadow: 0 0 0 6px rgba(229, 50, 45, 0.18); }
      42%       { box-shadow: 0 0 0 0 rgba(229, 50, 45, 0); }
      100%      { box-shadow: 0 0 0 0 rgba(229, 50, 45, 0); }
    }

    /* ─── ACTION VISUALIZATIONS (per-agent specific styling) ─── */
    /* Generic stagger utility — children "magic escape" from the agent
       output bubble: drop down + scale up + blur clears. transform-origin
       at top center anchors the emergence to the bubble above. Stagger
       is 200ms (4% of cycle) per item, starting at 22% (1.1s).
       Used by every scene's action block except chart/multi which have
       bespoke draw/grow keyframes. */
    .agent-card .scene-stagger > * {
      opacity: 0;
      transform-origin: top center;
    }
    .agent-card .scene-stagger > *:nth-child(1) { animation: sceneItem1 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .scene-stagger > *:nth-child(2) { animation: sceneItem2 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .scene-stagger > *:nth-child(3) { animation: sceneItem3 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .scene-stagger > *:nth-child(4) { animation: sceneItem4 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .scene-stagger > *:nth-child(5) { animation: sceneItem5 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    .agent-card .scene-stagger > *:nth-child(6) { animation: sceneItem6 13000ms cubic-bezier(0.22, 0.85, 0.36, 1) infinite; }
    /* Anim1 items: emerge at 50% (6.5s), HOLD VISIBLE until 92% — i.e.
       through the entire anim2 emergence + pin-zone hold window. This is
       what makes "anim1 + anim2 both visible at the end of the cycle"
       actually work. transform-origin: top center anchors scale to B5. */
    @keyframes sceneItem1 {
      0%, 50%   { opacity: 0; transform: translateY(-12px) scale(0.6); filter: blur(2px); }
      53%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      92%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      96%, 100% { opacity: 0; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes sceneItem2 {
      0%, 51.5% { opacity: 0; transform: translateY(-12px) scale(0.6); filter: blur(2px); }
      54.5%     { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      92%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      96%, 100% { opacity: 0; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes sceneItem3 {
      0%, 53%   { opacity: 0; transform: translateY(-12px) scale(0.6); filter: blur(2px); }
      56%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      92%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      96%, 100% { opacity: 0; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes sceneItem4 {
      0%, 54.5% { opacity: 0; transform: translateY(-12px) scale(0.6); filter: blur(2px); }
      57.5%     { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      92%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      96%, 100% { opacity: 0; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes sceneItem5 {
      0%, 56%   { opacity: 0; transform: translateY(-12px) scale(0.6); filter: blur(2px); }
      59%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      92%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      96%, 100% { opacity: 0; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes sceneItem6 {
      0%, 57.5% { opacity: 0; transform: translateY(-12px) scale(0.6); filter: blur(2px); }
      60.5%     { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      92%       { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      96%, 100% { opacity: 0; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* === Researcher: papers list with confidence chips === */
    .agent-card .scene-papers { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
    .agent-card .scene-paper {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .agent-card .scene-paper .paper-icon {
      width: 11px; height: 13px;
      border-radius: 1px;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0.10) 100%);
      position: relative;
      flex-shrink: 0;
    }
    .agent-card .scene-paper .paper-icon::before,
