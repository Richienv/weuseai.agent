  <style>
    /* Premium recommended pricing card — pulsing red glow (metallic border

    @keyframes priceGlowPulse {

    /* ── Utility-meter: the Rp 99rb/bulan recurring line reads like a live
          electricity meter ("bayar kayak listrik"). Legibility first;
          the price text never moves. (Pricing rev 2026-06-16.) ── */
    .utility-meter { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .utility-meter__label { letter-spacing: -0.01em; }
    .utility-meter__track {
      position: relative; display: block;
      width: 88px; height: 5px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(229,50,45,0.18);
    }
    .utility-meter__fill {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(229,50,45,0) 0%, rgba(229,50,45,0.55) 40%, #E5322D 70%, rgba(255,170,160,0.95) 85%, #E5322D 100%);
      transform-origin: left center;
      animation: utilMeterDraw 2.6s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    .utility-meter__fill::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 26%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
      animation: utilMeterShimmer 2.6s linear infinite;
    }
    @keyframes utilMeterDraw { 0% { transform: scaleX(0.18); opacity: 0.65; } 55% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(0.18); opacity: 0.65; } }
    @keyframes utilMeterShimmer { 0% { left: -30%; } 100% { left: 110%; } }
    #pricing .pc-card-featured .utility-meter__track { box-shadow: inset 0 0 0 1px rgba(229,50,45,0.4); }
    @media (prefers-reduced-motion: reduce) {
      .utility-meter__fill { animation: none; transform: scaleX(0.85); opacity: 1; }

    /* Interactive value slider (rev 2026-06-17) — konten-style toy: drag to see

    .vslider { max-width: 560px; margin: 0 auto 40px; text-align: center; position: relative; }
    .vslider-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(229,50,45,0.9); margin-bottom: 14px; }

    .vslider-readout .vslider-flat { color: #E5322D; }
    .vslider-track { position: relative; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(229,50,45,0.18); }
    .vslider-fill { position: absolute; inset: 0 auto 0 0; width: var(--vpct, 40%); border-radius: 999px; background: linear-gradient(90deg, rgba(229,50,45,0.5), #E5322D); transition: width 0.12s cubic-bezier(0.4,0,0.2,1); }
    .vslider-fill::after { content: ''; position: absolute; top: 0; bottom: 0; right: -2px; width: 14px; background: radial-gradient(circle, rgba(255,170,160,0.95), transparent 70%); animation: vsliderGlow 1.8s ease-in-out infinite; }
    .vslider-input { position: absolute; left: 0; right: 0; bottom: -10px; width: 100%; height: 26px; opacity: 0; cursor: grab; margin: 0; }

    @media (prefers-reduced-motion: reduce) { .vslider-fill::after { animation: none; opacity: 0.8; } .vslider-fill { transition: none; } }

    /* Global gloss (rev 2026-06-17) — konten-style micro-interactions: hover lift +
       red rim on cards, glossy sheen-sweep on the featured pricing CTA. */

    .pc-card:not(.pc-card-featured):hover, .how-mockbox:hover { transform: translateY(-4px); box-shadow: 0 18px 50px -28px rgba(229,50,45,0.5); border-color: rgba(229,50,45,0.4); }

    :root {

    /* ───── Liquid glass ───── */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative; overflow: hidden;
    }
    .liquid-glass::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,.45) 0%, rgba(255,255,255,.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,.15) 80%, rgba(255,255,255,.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative; overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,.5) 0%, rgba(255,255,255,.2) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,.2) 80%, rgba(255,255,255,.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }

    button, a { font-family: inherit; }
    button { cursor: pointer; }
    html { scroll-behavior: smooth; }

    .faq-item {

    /* ─── DASHBOARD DEMO (12-scene cycle, 72s total) ─── */
    .db-section {
      position: relative;
      padding: 80px 16px 100px;

      overflow: hidden;
    }

    .db-section--hero { padding-top: 118px; }

    /* Headline color-split + a tiny honest micro-line under the hero sub. */
    .hl-em { color: #E5322D; }
    .db-sub-micro { margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(245,245,245,0.4); }

    /* Hero circuit-flow background (rev 2026-06-17) — konten-style nodes flowing into
       a hub, signal-red, SVG stroke-dashoffset only. Sits behind .db-hero-dim. */
    .hero-circuit { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0.8; }
    .hero-circuit .hc-wire { fill: none; stroke: rgba(229,50,45,0.75); stroke-width: 1.8; stroke-dasharray: 16 200; filter: drop-shadow(0 0 4px rgba(229,50,45,0.5)); animation: hcFlow 3.2s linear infinite; }
    .hero-circuit .hc-wire:nth-child(2) { animation-delay: -0.9s; }
    .hero-circuit .hc-wire:nth-child(3) { animation-delay: -1.8s; }
    .hero-circuit .hc-wire--r { animation-direction: reverse; opacity: 0.7; }
    .hero-circuit .hc-hub { fill: rgba(229,50,45,0.18); stroke: #E5322D; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: hcHub 2.6s ease-in-out infinite; }
    .hero-circuit .hc-hub-ring { fill: none; stroke: #E5322D; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: hcRing 2.6s ease-out infinite; }
    @keyframes hcFlow { to { stroke-dashoffset: -234; } }
    @keyframes hcHub  { 0%,100% { opacity: 0.85; } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes hcRing { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
    @media (max-width: 767px) { .hero-circuit { opacity: 0.32; } }
    @media (prefers-reduced-motion: reduce) {
      .hero-circuit .hc-wire, .hero-circuit .hc-hub, .hero-circuit .hc-hub-ring { animation: none; }

      .hero-circuit .hc-hub-ring { display: none; }
    }

    /* Ambient hero video — layered behind the dashboard mockup (rev 2026-06-16). */
    .db-section--hero .db-hero-video {

    .is-wrap { max-width: 1120px; margin: 0 auto; text-align: center; }

    .is-headline { margin: 22px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.03em; line-height: 1.0; color: #f5f5f5; font-size: clamp(2.4rem, 6vw, 4.5rem); }
    .is-sub { margin: 18px auto 0; max-width: 60ch; color: rgba(245,245,245,0.6); font-family: 'Inter', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.6; }
    .is-hub { display: inline-flex; align-items: center; gap: 8px; margin: 30px 0 4px; padding: 7px 16px; border-radius: 999px; background: rgba(229,50,45,0.10); border: 1px solid rgba(229,50,45,0.45); color: #f5f5f5; font-size: 11px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.16em; }
    .is-grid { margin-top: 36px; display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    @media (min-width: 640px) { .is-grid { grid-template-columns: 1fr 1fr; gap: 24px; } }
    @media (min-width: 1024px) { .is-grid { grid-template-columns: repeat(4, 1fr); gap: 26px; } }

    /* Column item: title + desc OUTSIDE the box (cleaner), then the media box. */
    .is-item { display: flex; flex-direction: column; text-align: left; }
    .is-item--segera { opacity: 0.92; }
    .is-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .is-item-name { font-family: 'Instrument Serif', serif; font-size: 23px; color: #f5f5f5; letter-spacing: -0.01em; }
    .is-item-desc {
      margin: 8px 0 14px; color: rgba(245,245,245,0.6);
      font-family: 'Inter', sans-serif; font-weight: 300; font-size: 13px; line-height: 1.5; min-height: 3.8em;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* The box holds: chat flow · middle divider · app screenshot · micro. */
    .is-tile { position: relative; display: flex; flex-direction: column; text-align: left; background: rgba(14,14,14,0.6); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; padding: 16px 16px 18px; overflow: hidden; transition: border-color 220ms ease, transform 220ms ease, box-shadow 220ms ease; }
    .is-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .is-tile--live::before { background: linear-gradient(90deg, transparent, #E5322D, transparent); background-size: 200% 100%; animation: isFlow 2.6s linear infinite; }
    .is-tile--segera::before { background: repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 6px, transparent 6px 12px); }
    .is-tile--live { box-shadow: 0 8px 44px -26px rgba(229,50,45,0.55); }
    .is-item:hover .is-tile { transform: translateY(-3px); border-color: rgba(229,50,45,0.4); }
    .is-chip { display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .is-chip--live { color: #ff7a76; background: rgba(229,50,45,0.12); border: 1px solid rgba(229,50,45,0.4); }
    .is-chip--segera { color: rgba(245,245,245,0.5); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); }
    .is-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #E5322D; box-shadow: 0 0 8px rgba(229,50,45,0.6); animation: isPulse 1.6s ease-in-out infinite; }
    .is-tile-micro { margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: rgba(245,245,245,0.42); }

    /* ── Chat flow inside the box — mirrors the hero's .db-msg-user / .db-bubble ── */
    .is-flow { display: flex; flex-direction: column; gap: 8px; }
    .is-flow-user {
      align-self: flex-end; max-width: 84%;
      padding: 7px 11px; border-radius: 12px 12px 4px 12px;
      background: rgba(229,50,45,0.12); border: 1px solid rgba(229,50,45,0.32);
      font-family: 'Inter', sans-serif; font-size: 11.5px; line-height: 1.4; color: #fff;
    }
    .is-flow-agent { display: flex; gap: 8px; align-items: flex-start; max-width: 96%; }
    .is-flow-avatar {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      background: linear-gradient(135deg, #E5322D, #8B1410);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8px; line-height: 1;
    }
    .is-flow-bubble {
      flex: 1; padding: 8px 11px; border-radius: 4px 12px 12px 12px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      font-family: 'Inter', sans-serif; font-weight: 300; font-size: 11.5px; line-height: 1.45; color: rgba(255,255,255,0.9);
    }
    .is-tile--segera .is-flow-avatar { background: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0.12)); }

    /* The "middle" divider that separates the chat flow from the screenshot. */
    .is-tile-divider { height: 1px; margin: 14px 0; background: linear-gradient(90deg, transparent, rgba(229,50,45,0.28), transparent); }

    /* ── ROW 2: CSS-drawn iPhone portrait frame (placeholder for a real screen-record) ── */
    .is-phone {
      position: relative; width: 100%; max-width: 172px; margin: 16px auto 0;
      aspect-ratio: 9 / 19.5; border-radius: 30px; padding: 7px;
      background: linear-gradient(160deg, #1c1c1e, #050505);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 14px 40px -22px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .is-phone-island {
      position: absolute; top: 13px; left: 50%; transform: translateX(-50%);
      width: 34%; height: 12px; border-radius: 999px;
      background: #000; border: 1px solid rgba(255,255,255,0.10); z-index: 2;
    }
    .is-phone-screen {
      position: relative; width: 100%; height: 100%; border-radius: 24px;
      overflow: hidden; background: #0a0a0a;
    }
    /* SWAP TARGET — a real <img>/<video> drops in here with no geometry change. */
    .is-shot-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    /* Cross-fading slideshow of the 3 real app screenshots per phone. Each .is-shot-slide
       is absolute-fill (via .is-shot-media); staggered animationDelay (0/4/8s, set inline)
       gives a continuous crossfade with no black gap across the 12s loop. */
    .is-shot-slide { opacity: 0; animation: isShotFade 12s ease-in-out infinite; }
    @keyframes isShotFade {
      0%   { opacity: 0; }
      6%   { opacity: 1; }
      33%  { opacity: 1; }
      39%  { opacity: 0; }
      100% { opacity: 0; }
    }
    /* Segera (Gmail/Sekolah): the app preview is real, but the agent's Gmail connection is
       still coming — so the phone stays dashed + a dimming scrim + a "Segera" badge. */
    .is-tile--segera .is-phone { border-style: dashed; border-color: rgba(255,255,255,0.18); }
    .is-tile--segera .is-phone-screen::after {
      content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(5,5,5,0.34), rgba(5,5,5,0.56));
    }
    .is-phone-badge {
      position: absolute; top: 9px; left: 50%; transform: translateX(-50%); z-index: 3;
      font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.16em;
      text-transform: uppercase; color: #fff; padding: 3px 9px; border-radius: 999px;
      background: rgba(229,50,45,0.92); box-shadow: 0 4px 14px -4px rgba(229,50,45,0.7);
    }

    /* Phone size cap on mobile so a 1-up tile doesn't get a giant phone */
    @media (max-width: 639px) { .is-phone { max-width: 150px; } }

    .is-foot { margin: 34px auto 0; color: rgba(245,245,245,0.55); font-family: 'Inter', sans-serif; font-weight: 300; font-size: 14px; }
    .is-foot strong { color: #f5f5f5; font-weight: 500; }
    @keyframes isFlow { 0% { background-position: 150% 0; } 100% { background-position: -150% 0; } }
    @keyframes isBar { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes isPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .is-tile--live::before, .is-chip-dot { animation: none; }
      .is-shot-slide { animation: none; opacity: 0; }
      .is-shot-slide:first-child { opacity: 1; }
    }
    .db-section::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(229, 50, 45, 0.08), transparent 70%);
    }
    .db-section .db-eyebrow {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      margin-bottom: 36px; text-align: center;
    }
    .db-section .db-eyebrow-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px; border-radius: 999px;
      background: rgba(229, 50, 45, 0.10);
      border: 1px solid rgba(229, 50, 45, 0.40);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
      color: #E5322D;
    }
    /* Generic live-dot (rev 2026-06-17) — IntegrationsSpine .is-eyebrow/.is-hub
       use bare .live-dot spans; without this they were zero-size + left a gap. */
    .live-dot {
      display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #E5322D;
      animation: priceLiveDot 1.4s ease-in-out infinite;
    }
    .db-section .db-eyebrow-pill .live-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #E5322D;
      animation: priceLiveDot 1.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
    .db-section .db-headline {
      font-family: 'Instrument Serif', serif;
      color: #fff;
      font-size: 38px; line-height: 1.0; letter-spacing: -0.04em;
      max-width: 24ch;
      margin: 0 auto;
    }
    @media (min-width: 768px) { .db-section .db-headline { font-size: 56px; } }
    @media (min-width: 1024px) { .db-section .db-headline { font-size: 64px; } }
    .db-section .db-sub {
      margin-top: 6px;
      font-family: 'Inter', sans-serif; font-weight: 300;
      font-size: 13px; line-height: 1.5;
      color: rgba(255, 255, 255, 0.55);
      max-width: 42ch;
      margin-left: auto; margin-right: auto;
    }

    /* Frame */
    .db-frame {
      max-width: 1080px; margin: 0 auto;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: rgba(8, 8, 10, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 24px 64px rgba(0,0,0,0.6),
        0 0 80px rgba(229, 50, 45, 0.06);
      display: flex; flex-direction: column;
      height: 660px;
    }
    @media (max-width: 767px) { .db-frame { height: 540px; } }

    .db-topbar {
      height: 38px; flex-shrink: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .db-traffic { display: flex; gap: 6px; }
    .db-traffic span { width: 11px; height: 11px; border-radius: 50%; }
    .db-traffic span:nth-child(1) { background: #FF5F57; }
    .db-traffic span:nth-child(2) { background: #FEBC2E; }
    .db-traffic span:nth-child(3) { background: #28C840; }
    .db-title {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: rgba(255, 255, 255, 0.55); letter-spacing: 0.04em;
    }
    .db-status {
      margin-left: auto; display: flex; align-items: center; gap: 6px;

    }
    .db-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #6FA08F; box-shadow: 0 0 6px rgba(111, 160, 143, 0.7);
    }

    .db-body { flex: 1; display: flex; min-height: 0; }
    .db-sidebar {
      width: 200px; flex-shrink: 0;
      display: flex; flex-direction: column;

    }
    @media (max-width: 767px) { .db-sidebar { display: none; } }
    .db-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 11px; border-radius: 8px;
      background: transparent; border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;

      width: 100%;
    }
    .db-nav.active {
      background: rgba(229, 50, 45, 0.10);
    }
    .db-agent-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 14px;
      letter-spacing: -0.02em;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.78);
    }
    .db-nav.active .db-agent-avatar.a {
      background: linear-gradient(135deg, #E5322D, #8B1410);
      border-color: rgba(229,50,45,0.55);
      color: #fff;
      box-shadow: 0 0 12px rgba(229,50,45,0.30);
    }
    .db-agent-avatar.b {
      background: rgba(111,160,143,0.18);
      border-color: rgba(111,160,143,0.40);
      color: #6FA08F;
    }
    .db-agent-avatar.c {
      background: rgba(217,205,182,0.10);
      border-color: rgba(217,205,182,0.30);
      color: #d9cdb6;
    }
    .db-agent-name {
      flex: 1;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: rgba(255,255,255,0.78);
    }
    .db-nav.active .db-agent-name {
      color: #E5322D;
      font-weight: 500;
    }
    .db-agent-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
      background: #E5322D;
      color: #fff;
      box-shadow: 0 0 8px rgba(229,50,45,0.45);
      animation: badgePulse 2.4s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 8px rgba(229,50,45,0.45); }
      50% { box-shadow: 0 0 14px rgba(229,50,45,0.70); }
    }
    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .db-user {
      margin-top: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 11px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
    }
    .db-user-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: #E5322D;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 600;
    }

    .db-main {
      flex: 1; position: relative; overflow: hidden;
      background: rgba(0, 0, 0, 0.10);
    }
    /* Bottom-anchored chat thread — newest at bottom, older pushed up + clipped */
    .db-thread {
      position: absolute; inset: 0;
      overflow: hidden;
      padding: 22px 28px;
      display: flex;
      mask-image: linear-gradient(to bottom, transparent 0, #000 56px, #000 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 56px, #000 100%);
    }
    @media (max-width: 767px) { .db-thread { padding: 16px 18px; } }

    .db-thread-content {
      display: flex; flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      width: 100%; min-height: 100%;
    }

    .db-bubble-row {
      animation: bubbleMountIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    @keyframes bubbleMountIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Typing indicator row — mounted by React when agent is composing */
    .db-typing-row {
      display: flex; align-items: flex-start;
      animation: bubbleMountIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .db-typing-row.user { justify-content: flex-end; }
    .db-typing-row.agent { gap: 12px; }
    .db-typing-row .typing-bubble {
      display: inline-flex; gap: 5px; align-items: center;
      padding: 9px 12px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .db-typing-row.user .typing-bubble {
      background: rgba(229, 50, 45, 0.12);
      border-color: rgba(229, 50, 45, 0.35);
    }
    .db-typing-row .typing-bubble .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      animation: typingPulse 1.4s ease-in-out infinite;
    }
    .db-typing-row.user .typing-bubble .dot { background: rgba(255, 255, 255, 0.85); }
    .db-typing-row .typing-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
    .db-typing-row .typing-bubble .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingPulse {
      0%, 60%, 100% { opacity: 0.30; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-2px); }
    }
    /* (timing handled by React state machine — no CSS-driven scene cycle) */

    .db-bubble-row.user { display: flex; justify-content: flex-end; }
    .db-bubble-row.agent { display: flex; gap: 12px; align-items: flex-start; }
    .db-bubble-row.agent .db-avatar { margin-top: 2px; }
    .db-bubble-row.system {
      align-self: center;
      font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
      letter-spacing: 0.16em; text-transform: uppercase;

      padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
    }

    /* User msg + Agent msg + content */
    .db-msg-user {
      align-self: flex-end; max-width: 75%;
      padding: 8px 14px; border-radius: 14px 14px 4px 14px;
      background: rgba(229, 50, 45, 0.12);

    }
    .db-msg-agent {
      display: flex; gap: 12px; align-items: flex-start;
      max-width: 92%;
    }
    .db-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;

      color: #fff; font-size: 13px;
    }
    .db-bubble {
      padding: 12px 16px; border-radius: 4px 14px 14px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45;
      color: rgba(255, 255, 255, 0.92); flex: 1;
    }
    .db-bubble strong { color: #fff; font-weight: 500; }

    /* Scene-specific content blocks */
    .db-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .db-list .item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 7px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: rgba(255,255,255,0.78);
    }
    .db-list .item .marker {
      width: 6px; height: 6px; border-radius: 2px; background: #E5322D; flex-shrink: 0;
    }
    .db-list .item .meta { color: rgba(255,255,255,0.40); margin-left: auto; }

    .db-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .db-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 999px;
      background: rgba(229,50,45,0.10);
      border: 1px solid rgba(229,50,45,0.45);
