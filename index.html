      margin: 0;
    }
    @media (min-width: 768px) { .seats-caption { font-size: 15px; } }
    .seats-num-big {
      font-family: 'Instrument Serif', serif;
      font-size: 84px; line-height: 0.88;
      letter-spacing: -0.04em;
      color: #fff;
      margin-top: 4px;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }
    @media (min-width: 768px) { .seats-num-big { font-size: 132px; } }
    .seats-num-big.pulse {
      color: #E5322D;
      text-shadow: 0 0 32px rgba(229, 50, 45, 0.75);
    }
    .seats-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
      color: rgba(255,255,255,0.50);
      margin: 0;
    }
    @media (min-width: 768px) { .seats-sub { font-size: 11px; } }
    .seats-bar {
      width: 100%; max-width: 460px;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
      margin-top: 6px;
    }
    .seats-fill {
      height: 100%;
      background: linear-gradient(to right, rgba(229,50,45,0.55), #E5322D);
      box-shadow: 0 0 10px rgba(229, 50, 45, 0.45);
      border-radius: 2px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .seats-foot {
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; letter-spacing: 0.10em;
      color: rgba(255,255,255,0.40);
      display: flex; align-items: center; gap: 6px;
    }
    .seats-foot::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: #6FA08F;
      animation: priceLiveDot 1.6s ease-in-out infinite;
    }

    /* 12 BRIEF — sun glow + news ticker */
    .cap-brief { padding: 7px 10px; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 6px; position: relative; overflow: hidden; }
    .cap-brief .sun {
      position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
      width: 32px; height: 32px; border-radius: 50%;
      background: radial-gradient(circle, rgba(229,50,45,0.55) 0%, transparent 70%);
      animation: capBriefSun 6s ease-in-out infinite;
    }
    @keyframes capBriefSun {
      0%   { bottom: -22px; opacity: 0; }
      30%  { bottom: -10px; opacity: 0.95; }
      100% { bottom: -10px; opacity: 0.95; }
    }
    .cap-brief .ticker { position: relative; z-index: 1; display: flex; gap: 3px; height: 3px; }
    .cap-brief .news {
      flex: 1; height: 100%; border-radius: 1px;
      background: rgba(255,255,255,0.10);
      animation: capBriefNews 5s ease-in-out infinite;
    }
    .cap-brief .news:nth-child(1) { animation-delay: 0s; }
    .cap-brief .news:nth-child(2) { animation-delay: 0.5s; }
    .cap-brief .news:nth-child(3) { animation-delay: 1.0s; }
    .cap-brief .news:nth-child(4) { animation-delay: 1.5s; }
    .cap-brief .news:nth-child(5) { animation-delay: 2.0s; }
    @keyframes capBriefNews {
      0%, 5%   { background: rgba(229,50,45,0.85); box-shadow: 0 0 4px rgba(229,50,45,0.55); }
      15%, 100% { background: rgba(255,255,255,0.10); box-shadow: none; }
    }

    /* MEMORI — memory grid pulsing */
    .uc-memory { padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; height: 100%; }
    .uc-memory .cell { border-radius: 2px; background: rgba(255,255,255,0.10); animation: ucMemPulse 3.2s ease-in-out infinite; }
    @keyframes ucMemPulse {
      0%, 70%, 100% { background: rgba(255,255,255,0.08); box-shadow: none; }
      40% { background: #E5322D; box-shadow: 0 0 5px rgba(229,50,45,0.7); }
    }
    .uc-memory .latency {
      position: absolute; bottom: 6px; right: 8px; z-index: 6;
      font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
      color: rgba(229,50,45,0.9); background: rgba(0,0,0,0.55);
      padding: 1.5px 6px; border-radius: 3px;
      border: 1px solid rgba(229,50,45,0.4);
      animation: ucBlink 1.4s steps(2) infinite;
    }
    @keyframes ucBlink { 50% { opacity: 0.4; } }

    /* JADWAL — calendar week with day lighting up sequentially */
    .uc-schedule { padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; height: 100%; justify-content: center; }
    .uc-schedule .head { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: rgba(255,255,255,0.4); letter-spacing: 0.14em; text-transform: uppercase; }
    .uc-schedule .days { display: flex; gap: 4px; }
    .uc-schedule .day {
      flex: 1; height: 22px; border-radius: 3px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.55);
      animation: ucDay 4.9s steps(1, end) infinite;
    }
    @keyframes ucDay {
      0%, 12% { background: #E5322D; color: #fff; border-color: #E5322D; box-shadow: 0 0 8px rgba(229,50,45,0.55); }
      13%, 100% { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.10); box-shadow: none; }
    }

    /* BROWSING — URL bar + content lines loading */
    .uc-browse { padding: 12px; display: flex; flex-direction: column; gap: 7px; height: 100%; justify-content: center; }
    .uc-browse .url {
      height: 16px; border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      position: relative; overflow: hidden;
      display: flex; align-items: center; padding: 0 9px;
      font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: rgba(255,255,255,0.45);
    }
    .uc-browse .url .lock { width: 6px; height: 6px; border-radius: 50%; background: rgba(229,50,45,0.7); margin-right: 6px; flex-shrink: 0; }
    .uc-browse .url .domain { white-space: nowrap; overflow: hidden; }
    .uc-browse .url .caret {
      position: absolute; top: 4px; bottom: 4px; left: 24px; width: 1.4px;
      background: #E5322D; box-shadow: 0 0 5px rgba(229,50,45,0.8);
      animation: ucCrawlCaret 4.5s ease-in-out infinite;
    }
    @keyframes ucCrawlCaret {
      0% { transform: translateX(0); opacity: 1; }
      40% { transform: translateX(120px); opacity: 1; }
      45%, 100% { opacity: 0; }
    }
    .uc-browse .row { display: flex; gap: 6px; align-items: center; }
    .uc-browse .row .ln { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); flex: 1; position: relative; overflow: hidden; }
    .uc-browse .row .ln::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0.55); transform: scaleX(0); transform-origin: left;
      animation: ucCrawlFill 4.5s ease-in-out infinite;
    }
    .uc-browse .row:nth-of-type(1) .ln::before { animation-delay: 0.5s; }
    .uc-browse .row:nth-of-type(2) .ln::before { animation-delay: 0.95s; }
    .uc-browse .row:nth-of-type(3) .ln::before { animation-delay: 1.4s; }
    @keyframes ucCrawlFill {
      0%, 5% { transform: scaleX(0); opacity: 1; }
      40% { transform: scaleX(1); opacity: 1; }
      85% { transform: scaleX(1); opacity: 1; }
      92% { opacity: 0; }
      100% { transform: scaleX(0); opacity: 0; }
    }

    /* PLATFORMS — pill row lighting up sequentially */
    .uc-platforms { padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; align-content: center; justify-content: center; height: 100%; }
    .uc-platforms .pill {
      padding: 3px 7px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.05em;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.10); white-space: nowrap;
      animation: ucPlatform 7s steps(1, end) infinite;
    }
    @keyframes ucPlatform {
      0%, 9% { background: #E5322D; color: #fff; border-color: #E5322D; box-shadow: 0 0 6px rgba(229,50,45,0.5); }
      10%, 100% { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.10); box-shadow: none; }
    }

    /* SUB-AGEN — parent node radiating to 4 children */
    .uc-subagent { padding: 0; }
    .uc-subagent svg { width: 100%; height: 100%; display: block; }
    .uc-subagent .b { stroke: rgba(255,255,255,0.18); stroke-width: 1; stroke-dasharray: 80; animation: ucBranch 3.4s ease-in-out infinite; }
    @keyframes ucBranch {
      0%   { stroke-dashoffset: 80; stroke: rgba(255,255,255,0.16); }
      35%  { stroke-dashoffset: 0;  stroke: rgba(229,50,45,0.8); }
      55%  { stroke-dashoffset: -80; stroke: rgba(229,50,45,0.6); }
      100% { stroke-dashoffset: -80; stroke: rgba(255,255,255,0.16); }
    }
    .uc-subagent .parent { fill: #E5322D; filter: drop-shadow(0 0 5px rgba(229,50,45,0.75)); }
    .uc-subagent .child { fill: rgba(255,255,255,0.5); animation: ucChild 3.4s ease-in-out infinite; }
    @keyframes ucChild {
      0%, 30%, 100% { fill: rgba(255,255,255,0.45); filter: none; }
      55% { fill: #E5322D; filter: drop-shadow(0 0 4px rgba(229,50,45,0.85)); }
    }

    /* SKILL — file body with lines + SAVED stamp */
    .uc-skill { padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; height: 100%; justify-content: center; position: relative; }
    .uc-skill .header { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.4); }
    .uc-skill .header .filebadge { padding: 1px 5px; border-radius: 2px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); }
    .uc-skill .ln { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.07); position: relative; overflow: hidden; }
    .uc-skill .ln::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0.55); transform-origin: left;
      transform: scaleX(0); animation: ucSkillFill 4.8s ease-in-out infinite;
    }
    .uc-skill .ln:nth-of-type(1) { width: 80%; }
    .uc-skill .ln:nth-of-type(2) { width: 62%; }
    .uc-skill .ln:nth-of-type(3) { width: 72%; }
    .uc-skill .ln:nth-of-type(1)::before { animation-delay: 0s; }
    .uc-skill .ln:nth-of-type(2)::before { animation-delay: 0.5s; }
    .uc-skill .ln:nth-of-type(3)::before { animation-delay: 1s; }
    @keyframes ucSkillFill {
      0%, 5% { transform: scaleX(0); }
      35% { transform: scaleX(1); }
      85% { transform: scaleX(1); opacity: 1; }
      92% { opacity: 0; }
      100% { opacity: 0; transform: scaleX(0); }
    }
    .uc-skill .saved {
      position: absolute; bottom: 8px; right: 10px;
      font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #6FA08F;
      background: rgba(111,160,143,0.14);
      padding: 2px 6px; border-radius: 3px;
      border: 1px solid rgba(111,160,143,0.35);
      letter-spacing: 0.1em;
      opacity: 0;
      animation: ucSaved 4.8s ease-in-out infinite;
    }
    @keyframes ucSaved {
      0%, 75% { opacity: 0; transform: translateY(2px); }
      80%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(2px); }
    }

    /* SMART HOME — house with rooms lighting up */
    .uc-home { padding: 0; }
    .uc-home svg { width: 100%; height: 100%; display: block; }
    .uc-home .frame { stroke: rgba(255,255,255,0.32); stroke-width: 1.2; fill: none; }
    .uc-home .door  { stroke: rgba(255,255,255,0.22); stroke-width: 1; fill: none; }
    .uc-home .room  { stroke: rgba(255,255,255,0.18); stroke-width: 1; fill: rgba(255,255,255,0.05); animation: ucRoom 3.6s ease-in-out infinite; }
    @keyframes ucRoom {
      0%, 100% { fill: rgba(255,255,255,0.05); filter: none; }
      50% { fill: rgba(229,50,45,0.75); filter: drop-shadow(0 0 5px rgba(229,50,45,0.6)); }
    }

    /* FILES — scattered dots converging into 3 organized stacks */
    .uc-files { padding: 0; }
    .uc-files svg { width: 100%; height: 100%; display: block; }
    .uc-files .folder { stroke: rgba(255,255,255,0.32); stroke-width: 1; fill: none; }
    .uc-files .file {
      fill: rgba(255,255,255,0.55);
      animation: ucFile 4.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes ucFile {
      0% { transform: translate(var(--ox,0px), var(--oy,0px)) rotate(var(--or,0deg)); fill: rgba(255,255,255,0.35); }
      40%, 80% { transform: translate(0,0) rotate(0deg); fill: #E5322D; }
      100% { transform: translate(var(--ox,0px), var(--oy,0px)) rotate(var(--or,0deg)); fill: rgba(255,255,255,0.35); }
    }

    /* ─── HOW IT WORKS — 16s sequence cycle (4 steps × 4s each) ─── */
    .how-cycle .badge { animation: howBadge 16s ease-in-out infinite; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.85); }
    .how-cycle [data-i="1"] .badge { animation-delay: 0s; }
    .how-cycle [data-i="2"] .badge { animation-delay: 4s; }
    .how-cycle [data-i="3"] .badge { animation-delay: 8s; }
    .how-cycle [data-i="4"] .badge { animation-delay: 12s; }
    @keyframes howBadge {
      0%, 22% { background: #E5322D; border-color: #E5322D; color: #fff; box-shadow: 0 0 32px rgba(229, 50, 45, 0.45); }
      26%, 100% { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.85); box-shadow: none; }
    }
    .how-cycle .card-glow { animation: howCardGlow 16s ease-in-out infinite; }
    .how-cycle [data-i="1"] .card-glow { animation-delay: 0s; }
    .how-cycle [data-i="2"] .card-glow { animation-delay: 4s; }
    .how-cycle [data-i="3"] .card-glow { animation-delay: 8s; }
    .how-cycle [data-i="4"] .card-glow { animation-delay: 12s; }
    @keyframes howCardGlow {
      0%, 22% { box-shadow: 0 0 60px rgba(229, 50, 45, 0.18), inset 0 0 0 1px rgba(229, 50, 45, 0.45); }
      26%, 100% { box-shadow: none; }
    }
    /* progress line filling across the 4 badges */
    /* Bigger 4-step mock box (rev 2026-06-16) — replaces the inline 168px height. */
    .how-mockbox { min-height: 240px; padding: 28px; }
    @media (max-width: 1024px) { .how-mockbox { min-height: 200px; padding: 20px; } }

    .how-cycle .how-line {
      position: absolute; top: 32px; left: 12.5%; right: 12.5%; height: 1px;
      background: rgba(255,255,255,0.08); z-index: 0; overflow: hidden;
    }
    .how-cycle .how-line::after {
      content: ''; position: absolute; left: 0; top: -1px; bottom: -1px; width: 0%;
      background: linear-gradient(to right, rgba(229,50,45,0.4), rgba(229,50,45,0.85));
      box-shadow: 0 0 6px rgba(229,50,45,0.5);
      animation: howLine 16s linear infinite;
    }
    @keyframes howLine {
      0% { width: 0%; }
      75% { width: 100%; }
      100% { width: 100%; }
    }

    /* MOCK 1 — Plan check drawing */
    .howmock-plan { width: 100%; height: 100%; }
    .howmock-plan .check {
      stroke-dasharray: 28; stroke-dashoffset: 28;
      animation: howCheckDraw 16s ease-in-out infinite;
      animation-delay: 0s;
    }
    @keyframes howCheckDraw {
      0%, 5% { stroke-dashoffset: 28; }
      20%, 24% { stroke-dashoffset: 0; }
      26%, 100% { stroke-dashoffset: 0; }
    }

    /* MOCK 2 — Form fields lighting up sequentially */
    .howmock-form { padding: 6px 4px; display: flex; flex-direction: column; gap: 8px; height: 100%; justify-content: center; }
    .howmock-form .field {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 6px; background: rgba(0,0,0,0.25);
      animation: howFormFlash 16s ease-in-out infinite;
    }
    .howmock-form .field:nth-child(1) { animation-delay: 4.0s; }
    .howmock-form .field:nth-child(2) { animation-delay: 4.7s; }
    .howmock-form .field:nth-child(3) { animation-delay: 5.4s; }
    .howmock-form .field .label {
      color: rgba(255,255,255,0.45); width: 74px; flex-shrink: 0;
      text-transform: uppercase; letter-spacing: 0.08em;
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
    }
    .howmock-form .field .value {
      color: rgba(255,255,255,0.78); flex: 1;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }
    @keyframes howFormFlash {
      0%, 1%   { border-color: #E5322D; background: rgba(229,50,45,0.10); box-shadow: 0 0 10px rgba(229,50,45,0.30); }
      4%, 100% { border-color: rgba(255,255,255,0.10); background: rgba(0,0,0,0.25); box-shadow: none; }
    }

    /* MOCK 3 — Setup progress + tasks checking */
    .howmock-setup { padding: 6px 4px; display: flex; flex-direction: column; gap: 9px; height: 100%; justify-content: center; }
    .howmock-setup .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .howmock-setup .bar .fill {
      height: 100%; width: 0;
      background: linear-gradient(to right, rgba(229,50,45,0.55), #E5322D);
      animation: howSetupFill 16s ease-in-out infinite;
      animation-delay: 8s;
    }
    @keyframes howSetupFill {
      0%, 1%   { width: 0%; }
      20%      { width: 100%; }
      25%, 100% { width: 100%; }
    }
    .howmock-setup .task {
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
      color: rgba(255,255,255,0.55);
      display: flex; align-items: center; gap: 7px;
    }
    .howmock-setup .task .check {
      color: #6FA08F; width: 11px; opacity: 0; font-weight: bold;
      animation: howCheckPop 16s ease-in-out infinite;
    }
    .howmock-setup .task:nth-of-type(1) .check { animation-delay: 8.6s; }
    .howmock-setup .task:nth-of-type(2) .check { animation-delay: 9.3s; }
    .howmock-setup .task:nth-of-type(3) .check { animation-delay: 10.0s; }
    @keyframes howCheckPop {
      0%, 1%   { opacity: 0; transform: scale(0.6); }
      3%, 25%  { opacity: 1; transform: scale(1); }
      26%, 100% { opacity: 1; transform: scale(1); }
    }

    /* MOCK 4 — Chat with reply + PDF + email toast (sequenced inside step 4 window: 75–97% of cycle) */
    .howmock-chat { padding: 6px; height: 100%; width: 100%; position: relative; }

    .howmock-chat .bubble {
      position: absolute;
      padding: 7px 11px; border-radius: 11px;
      font-family: 'Inter', sans-serif; font-size: 11px;
      line-height: 1.3; opacity: 0;
      white-space: nowrap;
    }
    /* User question — top right */
    .howmock-chat .bubble.user {
      top: 8px; right: 2px;
      background: #E5322D; color: #fff;
      max-width: 78%;
      animation: howChat-user 16s ease-out infinite;
    }
    @keyframes howChat-user {
      0%, 73%  { opacity: 0; transform: translateY(6px); }
      76%, 96% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; }
    }

    /* Typing dots — center-left, brief */
    .howmock-chat .bubble.dots {
      top: 48px; left: 2px;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; gap: 3px; align-items: center; padding: 7px 9px;
      animation: howChat-dots 16s ease-out infinite;
    }
    .howmock-chat .bubble.dots .dot {
      width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.7);
      animation: howTypingDot 1.4s ease-in-out infinite;
    }
    .howmock-chat .bubble.dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .howmock-chat .bubble.dots .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes howChat-dots {
      0%, 78%  { opacity: 0; }
      80%, 86% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    @keyframes howTypingDot {
      0%, 70%, 100% { opacity: 0.3; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-2px); }
    }

    /* Reply bubble — replaces dots */
    .howmock-chat .bubble.reply {
      top: 48px; left: 2px;
      background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 88%;
      animation: howChat-reply 16s ease-out infinite;
    }
    @keyframes howChat-reply {
      0%, 86%  { opacity: 0; transform: translateY(6px); }
      88%, 96% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; }
    }

    /* PDF attachment chip — below reply */
    .howmock-chat .pdf-chip {
      position: absolute; left: 2px; top: 96px;
      display: flex; align-items: center; gap: 7px;
      padding: 5px 9px 5px 5px; border-radius: 8px;
      background: rgba(229,50,45,0.10);
      border: 1px solid rgba(229,50,45,0.45);
      opacity: 0;
      animation: howChat-pdf 16s ease-out infinite;
    }
    .howmock-chat .pdf-chip .ic {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600;
      color: #fff; background: #E5322D;
      padding: 3px 6px; border-radius: 3px;
      letter-spacing: 0.06em;
    }
    .howmock-chat .pdf-chip .nm {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: rgba(255,255,255,0.92); letter-spacing: 0.01em;
    }
    @keyframes howChat-pdf {
      0%, 89%  { opacity: 0; transform: translateY(6px) scale(0.94); }
      92%, 96% { opacity: 1; transform: translateY(0)   scale(1); }
      98%, 100% { opacity: 0; }
    }

    /* Email-sent toast — bottom right, slides in */
    .howmock-chat .email-toast {
      position: absolute; bottom: 4px; right: 2px;
      padding: 4px 9px; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
      color: #6FA08F;
      background: rgba(111,160,143,0.10);
      border: 1px solid rgba(111,160,143,0.4);
      display: flex; align-items: center; gap: 5px;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: howChat-toast 16s ease-out infinite;
    }
    .howmock-chat .email-toast .env {
      font-size: 9px; color: #6FA08F;
      transform: translateY(0.5px);
    }
    @keyframes howChat-toast {
      0%, 91%  { opacity: 0; transform: translateX(14px); }
      93%, 96% { opacity: 1; transform: translateX(0); }
      98%, 100% { opacity: 0; transform: translateX(0); }
    }

    /* ─── PERSONA DETAIL GRID + MODAL (2026-05-23) ─── */
    /* Sub-section under the agent carousel — 10 persona tiles that open a
       detail modal with 5 content blocks (tagline, capabilities, flow,
       sample deliverable, template list). Visual register mirrors the
       carousel: liquid-glass surface, red halftone accent, restrained type. */
    .pd-section {
      width: 100%;
      max-width: 1080px;
      margin: 56px auto 0;
      padding: 0 16px;
      text-align: left;
    }
    .pd-section-head {
      text-align: center;
      margin-bottom: 28px;
    }
    .pd-section-head .pd-eyebrow {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
      font-weight: 500;
      margin-bottom: 12px;
    }
    .pd-section-head h3 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #f5f5f5;
      max-width: 640px;
      margin: 0 auto;
    }
    .pd-section-head p {
      margin-top: 12px;
      color: rgba(245, 245, 245, 0.6);
      font-size: 13px;
      line-height: 1.55;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }
    .pd-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 720px) {
      .pd-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    }
    @media (min-width: 1020px) {
      .pd-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    }
    .pd-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 14px 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #f5f5f5;
      text-align: left;
      cursor: pointer;
      text-decoration: none;            /* tile is now an anchor */
      transition: transform 200ms cubic-bezier(0.22, 0.85, 0.36, 1),
                  border-color 200ms ease,
                  background 200ms ease;
      overflow: hidden;
    }
    .pd-tile:hover, .pd-tile:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(229, 50, 45, 0.4);
      background: rgba(229, 50, 45, 0.04);
      outline: none;
    }
    .pd-tile::before {
      /* Red halftone accent in the corner */
      content: '';
      position: absolute;
      top: -28px; right: -28px;
      width: 70px; height: 70px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.55) 1px, transparent 1.6px);
      background-size: 6px 6px;
      opacity: 0.55;
      pointer-events: none;
    }
    .pd-tile-glyph {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(229, 50, 45, 0.18), rgba(229, 50, 45, 0.04));
      border: 1px solid rgba(229, 50, 45, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 16px;
      color: #E5322D;
      letter-spacing: 0.02em;
    }
    .pd-tile-name {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      color: #f5f5f5;
    }
    .pd-tile-tag {
      font-size: 11px;
      line-height: 1.4;
      color: rgba(245, 245, 245, 0.55);
    }
    .pd-tile-cta {
      margin-top: auto;
      padding-top: 6px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
    }

    /* ─── Modal overlay ─── */
    .pd-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 80;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow-y: auto;
      animation: pdFadeIn 200ms ease;
    }
    @keyframes pdFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (min-width: 720px) {
      .pd-modal-backdrop { padding: 48px 24px; align-items: center; }
    }
    .pd-modal {
      position: relative;
      width: 100%;
      max-width: 880px;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 24px 20px 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
      color: #f5f5f5;
      animation: pdSlideUp 280ms cubic-bezier(0.22, 0.85, 0.36, 1);
    }
    @keyframes pdSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (min-width: 720px) {
      .pd-modal { padding: 36px 40px 40px; }
    }
    .pd-modal::after {
      /* Red halftone accent — top right of modal */
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 220px; height: 220px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.5) 1px, transparent 1.8px);
      background-size: 10px 10px;
      mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.5;
      border-radius: 18px;
    }
    .pd-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5f5f5;
      z-index: 2;
      cursor: pointer;
      transition: background 160ms ease;
    }
    .pd-modal-close:hover { background: rgba(229, 50, 45, 0.18); border-color: rgba(229, 50, 45, 0.4); }
    .pd-modal-close svg { width: 14px; height: 14px; }

    .pd-modal-header {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding-right: 40px;
      position: relative;
      z-index: 1;
    }
    .pd-modal-glyph {
      flex-shrink: 0;
      width: 52px; height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(229, 50, 45, 0.22), rgba(229, 50, 45, 0.04));
      border: 1px solid rgba(229, 50, 45, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      color: #E5322D;
    }
    .pd-modal-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #f5f5f5;
    }
    .pd-modal-tag {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(245, 245, 245, 0.65);
      max-width: 560px;
    }

    .pd-block {
      margin-top: 28px;
      position: relative;
      z-index: 1;
    }
    .pd-block-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(229, 50, 45, 0.85);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .pd-block-title {
      font-family: 'Instrument Serif', serif;
      font-size: 19px;
      line-height: 1.2;
      color: #f5f5f5;
      margin-bottom: 12px;
    }
    .pd-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pd-list li {
      position: relative;
      padding-left: 18px;
      font-size: 13.5px;
      line-height: 1.55;
      color: rgba(245, 245, 245, 0.82);
    }
    .pd-list li::before {
      content: '';
      position: absolute;
      left: 0; top: 9px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #E5322D;
    }

    /* Flow steps */
    .pd-flow {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) {
      .pd-flow { grid-template-columns: repeat(2, 1fr); }
    }
    .pd-step {
      display: flex;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pd-step-num {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 6px;
      background: rgba(229, 50, 45, 0.14);
      border: 1px solid rgba(229, 50, 45, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      color: #E5322D;
    }
    .pd-step-body {
      flex: 1;
      min-width: 0;
    }
    .pd-step-title {
      font-size: 13px;
      font-weight: 500;
      color: #f5f5f5;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .pd-step-desc {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(245, 245, 245, 0.6);
    }

    /* Deliverable cards */
    .pd-deliverable-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) {
      .pd-deliverable-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .pd-deliverable {
      position: relative;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .pd-deliv-mini {
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      line-height: 1.5;
      color: rgba(245, 245, 245, 0.7);
      min-height: 120px;
      position: relative;
    }
    .pd-deliv-mini .pd-mini-title {
      font-family: 'Instrument Serif', serif;
      font-size: 14px;
      color: #f5f5f5;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .pd-deliv-mini .pd-mini-line {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin: 5px 0;
    }
    .pd-deliv-mini .pd-mini-line.short { width: 50%; }
    .pd-deliv-mini .pd-mini-line.med   { width: 75%; }
    .pd-deliv-mini .pd-mini-line.long  { width: 100%; }
    .pd-deliv-mini .pd-mini-line.accent { background: rgba(229, 50, 45, 0.6); }
    .pd-deliv-mini .pd-mini-row {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 9.5px;
      color: rgba(245, 245, 245, 0.55);
      margin-top: 4px;
    }
    .pd-deliv-mini .pd-mini-row .pd-mini-tag {
      background: rgba(229, 50, 45, 0.12);
      color: #E5322D;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      letter-spacing: 0.05em;
    }
    .pd-deliv-mini .pd-mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 38px;
      margin-top: 6px;
    }
    .pd-deliv-mini .pd-mini-chart .bar {
      flex: 1;
      background: rgba(229, 50, 45, 0.4);
      border-radius: 1px;
    }
    .pd-deliv-mini .pd-mini-chip {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(229, 50, 45, 0.14);
      color: #E5322D;
      font-size: 9px;
      letter-spacing: 0.04em;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .pd-deliv-mini .pd-mini-slide {
      display: inline-block;
      width: 22px; height: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-right: 4px;
    }
    .pd-deliv-mini .pd-mini-slide.active {
      background: rgba(229, 50, 45, 0.25);
      border-color: rgba(229, 50, 45, 0.4);
    }
    .pd-deliv-mini .pd-mini-kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 6px;
    }
    .pd-deliv-mini .pd-mini-kanban .col {
      background: rgba(255,255,255,0.03);
      border-radius: 3px;
      padding: 4px;
      font-size: 8px;
      color: rgba(245, 245, 245, 0.5);
    }
    .pd-deliv-mini .pd-mini-kanban .col .card {
      background: rgba(255,255,255,0.06);
      height: 6px;
      border-radius: 1.5px;
      margin: 2px 0;
    }
    .pd-deliv-mini .pd-mini-kanban .col .card.accent {
      background: rgba(229, 50, 45, 0.45);
    }
    .pd-deliv-mini .pd-mini-citation {
      font-size: 9px;
      color: rgba(245, 245, 245, 0.5);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.6;
    }
    .pd-deliv-caption {
      font-size: 12px;
      color: rgba(245, 245, 245, 0.7);
      line-height: 1.5;
    }
    .pd-deliv-caption strong { color: #f5f5f5; font-weight: 500; }

    /* Templates list */
    .pd-templates {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 540px) {
      .pd-templates { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 880px) {
      .pd-templates { grid-template-columns: repeat(3, 1fr); }
    }
    .pd-template {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .pd-template-icon {
      flex-shrink: 0;
      width: 24px; height: 24px;
      border-radius: 5px;
      background: rgba(229, 50, 45, 0.1);
      border: 1px solid rgba(229, 50, 45, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #E5322D;
      letter-spacing: 0.02em;
    }
    .pd-template-body {
      min-width: 0;
      flex: 1;
    }
    .pd-template-name {
      font-size: 12px;
      color: #f5f5f5;
      font-weight: 500;
      line-height: 1.3;
      word-break: break-word;
    }
    .pd-template-kind {
      font-size: 10px;
      color: rgba(245, 245, 245, 0.5);
      margin-top: 2px;
    }

    .pd-cta-row {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    @media (min-width: 540px) {
      .pd-cta-row { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    .pd-cta-row .pd-cta-hint {
      font-size: 12px;
      color: rgba(245, 245, 245, 0.55);
    }
    .pd-cta-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background: #E5322D;
      color: #f5f5f5;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: background 200ms ease, transform 160ms ease;
      text-decoration: none;
    }
    .pd-cta-primary:hover { background: #c92823; transform: translateY(-1px); }
    .pd-cta-primary svg { width: 13px; height: 13px; }

    /* Lock body scroll when modal is open */
    body.pd-modal-open { overflow: hidden; }

    /* ─────────────────────────────────────────────────────────────────────
       BENTO REDESIGN (per 2026-05-19 cowork consult)
       Mixed-size grid cards with CSS-rendered visual mockups inside each.
       Currently scoped to Deep Researcher as the style proof — extend
       to remaining 9 personas after founder approval.
       ───────────────────────────────────────────────────────────────────── */

    /* Bento grid for "Apa yang aku bisa" — 4-col on desktop, 1-col mobile */
    .pd-bento {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(140px, auto);
    }
    @media (min-width: 720px) {
      .pd-bento { grid-template-columns: repeat(4, 1fr); }
    }
    .pd-bento-card {
      position: relative;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 200ms ease, transform 200ms ease;
    }
    .pd-bento-card:hover {
      border-color: rgba(229, 50, 45, 0.32);
      transform: translateY(-1px);
    }
    .pd-bento-card.span-2 { grid-column: span 1; }
    @media (min-width: 720px) {
      .pd-bento-card.span-2 { grid-column: span 2; }
      .pd-bento-card.span-row-2 { grid-row: span 2; }
    }
    .pd-bento-card .pd-bento-title {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
      line-height: 1.15;
      color: #f5f5f5;
      letter-spacing: -0.015em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pd-bento-card .pd-bento-desc {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(245, 245, 245, 0.6);
    }
    .pd-bento-card .pd-bento-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      background: rgba(229, 50, 45, 0.16);
      color: #E5322D;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: middle;
    }

    /* Halftone accent in card corner — repeats brand motif */
    .pd-bento-card::after {
      content: '';
      position: absolute;
      bottom: -30px;
      right: -30px;
      width: 90px;
      height: 90px;
      background-image: radial-gradient(circle, rgba(229, 50, 45, 0.32) 1px, transparent 1.6px);
      background-size: 8px 8px;
      mask-image: radial-gradient(circle at bottom right, #000 0%, transparent 65%);
      -webkit-mask-image: radial-gradient(circle at bottom right, #000 0%, transparent 65%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 240ms ease;
    }
    .pd-bento-card:hover::after { opacity: 1; }

    /* The mockup area inside each bento card */
    .pd-bento-mock {
      margin-top: auto;
      background: #0d0d0d;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      line-height: 1.55;
      color: rgba(245, 245, 245, 0.7);
      position: relative;
      z-index: 1;
    }

    /* Mockup primitives — chunks of fake UI */
    .pd-mock-paragraph {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px;
      line-height: 1.65;
      color: rgba(245, 245, 245, 0.78);
    }
    .pd-mock-paragraph .ref {
      display: inline-block;
      background: rgba(229, 50, 45, 0.18);
      color: #E5322D;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 9px;
      margin: 0 1px;
      vertical-align: 1px;
      letter-spacing: 0.04em;
    }
    .pd-mock-footnotes {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.07);
    }
    .pd-mock-footnote {
      font-size: 9px;
      color: rgba(245, 245, 245, 0.5);
      line-height: 1.7;
      display: flex;
      gap: 6px;
    }
    .pd-mock-footnote .num {
      color: #E5322D;
      flex-shrink: 0;
    }

    /* Two-column split for verified vs unverified */
    .pd-mock-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .pd-mock-split-col {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 5px;
      padding: 6px 7px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .pd-mock-split-col .lbl {
      font-size: 8.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .pd-mock-split-col.verified .lbl { color: rgba(120, 220, 150, 0.9); }
    .pd-mock-split-col.unverified .lbl { color: rgba(229, 180, 60, 0.9); }
    .pd-mock-split-col .ln {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1.5px;
      margin: 2px 0;
    }
    .pd-mock-split-col.verified .ln { background: rgba(120, 220, 150, 0.32); }
    .pd-mock-split-col.unverified .ln { background: rgba(229, 180, 60, 0.32); }

    /* Conflict attribution — two opposing quotes side by side */
    .pd-mock-conflict {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      position: relative;
    }
    .pd-mock-conflict::before {
      content: 'vs';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Instrument Serif', serif;
      font-size: 16px;
      color: rgba(229, 50, 45, 0.6);
      background: #0d0d0d;
      padding: 1px 5px;
      border-radius: 50%;
      z-index: 2;
    }
    .pd-mock-quote {
      background: rgba(255, 255, 255, 0.025);
      border-left: 2px solid rgba(229, 50, 45, 0.4);
      padding: 7px 8px;
      border-radius: 4px;
      font-size: 9.5px;
      line-height: 1.55;
      color: rgba(245, 245, 245, 0.75);
      font-style: italic;
    }
    .pd-mock-quote .src {
      display: block;
      margin-top: 4px;
      font-style: normal;
      font-size: 8.5px;
      color: rgba(245, 245, 245, 0.45);
      letter-spacing: 0.04em;
    }

    /* Source-count visualization */
    .pd-mock-sources {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      justify-content: center;
      padding: 8px 0 4px;
    }
    .pd-mock-source-icon {
      width: 18px;
      height: 22px;
      background: rgba(229, 50, 45, 0.18);
      border: 1px solid rgba(229, 50, 45, 0.32);
      border-radius: 2px;
      position: relative;
    }
    .pd-mock-source-icon::before {
      content: '';
      position: absolute;
      top: 4px; left: 3px; right: 3px;
      height: 2px;
      background: rgba(229, 50, 45, 0.5);
      box-shadow: 0 3px 0 rgba(229, 50, 45, 0.5), 0 6px 0 rgba(229, 50, 45, 0.5);
    }
    .pd-mock-counter {
      text-align: center;
      font-family: 'Instrument Serif', serif;
      font-size: 26px;
      color: #E5322D;
      line-height: 1;
      margin-top: 6px;
    }
    .pd-mock-counter-lbl {
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: rgba(245, 245, 245, 0.5);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Sintesis: stack of paper icons → arrow → summary */
    .pd-mock-funnel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .pd-mock-paper-stack {
      position: relative;
      width: 32px;
      height: 36px;
      flex-shrink: 0;
    }
    .pd-mock-paper-stack .pg {
      position: absolute;
      width: 22px;
      height: 28px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }
    .pd-mock-paper-stack .pg:nth-child(1) { top: 0; left: 0; }
    .pd-mock-paper-stack .pg:nth-child(2) { top: 4px; left: 5px; }
    .pd-mock-paper-stack .pg:nth-child(3) { top: 8px; left: 10px; background: rgba(229, 50, 45, 0.16); border-color: rgba(229, 50, 45, 0.32); }
    .pd-mock-arrow {
      color: #E5322D;
      font-size: 16px;
      line-height: 1;
    }
    .pd-mock-summary-card {
      flex: 1;
      background: rgba(229, 50, 45, 0.06);
      border: 1px solid rgba(229, 50, 45, 0.2);
      border-radius: 4px;
      padding: 6px 7px;
    }
    .pd-mock-summary-card .ttl {
      font-size: 9px;
      color: #E5322D;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .pd-mock-summary-card .ln {
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1.5px;
      margin: 2px 0;
    }
    .pd-mock-summary-card .ln.short { width: 60%; }

    /* Bento for flow steps — 3x2 on desktop */
    .pd-bento-flow {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 540px) {
      .pd-bento-flow { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 880px) {
      .pd-bento-flow { grid-template-columns: repeat(3, 1fr); }
    }
    .pd-bento-step {
      position: relative;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 110px;
    }
    .pd-bento-step-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pd-bento-step-num {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      color: rgba(229, 50, 45, 0.85);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .pd-bento-step-icon {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: rgba(229, 50, 45, 0.1);
      border: 1px solid rgba(229, 50, 45, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E5322D;
      flex-shrink: 0;
    }
    .pd-bento-step-icon svg { width: 12px; height: 12px; }
    .pd-bento-step-title {
      font-size: 13px;
      font-weight: 500;
      color: #f5f5f5;
      line-height: 1.3;
    }
    .pd-bento-step-desc {
      font-size: 11.5px;
      line-height: 1.5;
      color: rgba(245, 245, 245, 0.6);
    }

    /* Enlarged deliverable frames — document-preview styling */
    .pd-bento-deliv {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) {
      .pd-bento-deliv { grid-template-columns: 1.4fr 1fr; }
    }
    .pd-bento-deliv-frame {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      overflow: hidden;
    }
    .pd-bento-deliv-frame::before {
      /* Window-chrome dots, top left — feels like a document preview */
      content: '';
      position: absolute;
      top: 10px;
      left: 14px;
      width: 36px;
      height: 8px;
      background:
        radial-gradient(circle at 4px 4px, rgba(229, 50, 45, 0.45) 3px, transparent 3.5px),
        radial-gradient(circle at 16px 4px, rgba(255, 255, 255, 0.18) 3px, transparent 3.5px),
        radial-gradient(circle at 28px 4px, rgba(255, 255, 255, 0.12) 3px, transparent 3.5px);
    }
    .pd-bento-deliv-frame .pd-deliv-mini {
      margin-top: 14px;
      min-height: 150px;
    }
    .pd-bento-deliv-caption {
      font-size: 12px;
      color: rgba(245, 245, 245, 0.7);
      line-height: 1.55;
      margin-top: 12px;
    }
    .pd-bento-deliv-caption strong { color: #f5f5f5; font-weight: 500; }
  </style>
</head>
<body class="bg-black text-white">
  <div id="app"></div>

  <script src="/assets/app.js" defer></script>
</body>
