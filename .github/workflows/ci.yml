# CI gate — tests + typecheck on every PR and every push to main.
#
# Mission 2 Phase 0.1 (2026-06-10). Before this, the ~2100-test suite and
# typecheck:all ran ONLY on developer machines — CI was post-deploy smoke
# only, so a red commit could physically reach main. Multiple autonomous
# sessions write to this repo; this gate is the floor.
#
# To make it required: GitHub repo Settings → Branches → main protection →
# require status check "test-and-typecheck" (needs repo admin — see
# docs/runbooks/ci-gate.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck all packages
        run: npm run typecheck:all
      - name: Run test suite
        run: npm test
